const CUR_SPACE = [
  { go: { v: "galaxies", id: "m87" },
    title: { it: "Vicino a un buco nero il tempo rallenta", en: "Near a black hole, time slows down" },
    text: { it: "Secondo la teoria di Einstein, la gravità non piega solo lo spazio ma anche il tempo: più la gravità è forte, più il tempo scorre lento. Vicino a un buco nero l'effetto è enorme: un'ora passata lì potrebbe valere anni per chi è rimasto lontano. Succede anche sulla Terra, in piccolissimo: gli orologi dei satelliti GPS, più lontani dalla gravità terrestre, vanno avanti di circa 38 milionesimi di secondo al giorno. Il sistema li deve correggere, altrimenti le mappe sbaglierebbero strada di chilometri.",
      en: "According to Einstein's theory, gravity bends not only space but time too: the stronger the gravity, the slower time runs. Near a black hole the effect is huge: an hour spent there could be worth years for someone far away. It even happens on Earth, in a tiny way: clocks on GPS satellites, farther from Earth's gravity, run about 38 millionths of a second fast every day. The system has to correct them, or maps would send you kilometres off course." } },
  { title: { it: "Le pulsar sono fari cosmici", en: "Pulsars are cosmic lighthouses" },
    text: { it: "Una pulsar è ciò che resta di una stella gigante esplosa: un nucleo grande come una città ma più pesante del Sole, che gira su se stesso velocissimo. Dai suoi poli escono due fasci di onde radio che spazzano lo spazio come la luce di un faro: ogni volta che ci colpiscono riceviamo un 'bip' regolarissimo. La più veloce conosciuta ruota 716 volte al secondo. La prima fu scoperta nel 1967 da una studentessa, Jocelyn Bell Burnell: il segnale era così regolare che per scherzo la chiamarono LGM-1, 'Little Green Men', omini verdi.",
      en: "A pulsar is what is left of an exploded giant star: a core the size of a city but heavier than the Sun, spinning incredibly fast. Two beams of radio waves shoot from its poles and sweep through space like a lighthouse: each time they hit us we get a perfectly regular 'beep'. The fastest one known spins 716 times a second. The first was discovered in 1967 by a student, Jocelyn Bell Burnell: the signal was so regular that it was jokingly nicknamed LGM-1, 'Little Green Men'." } },
  { go: { v: "lesson", id: "tardigradi" }, title: { it: "Un tardigrado può sopravvivere nello spazio", en: "A tardigrade can survive in space" },
    text: { it: "I tardigradi, o 'orsi d'acqua', sono animaletti lunghi meno di un millimetro. Nel 2007 una missione dell'Agenzia Spaziale Europea li ha lasciati per dieci giorni fuori da un satellite, nel vuoto dello spazio e sotto i raggi del Sole. Tornati a terra, molti si sono risvegliati e alcuni hanno persino deposto uova. Il loro trucco è seccarsi quasi del tutto e diventare una pallina chiamata 'barilotto': il corpo si mette in pausa finché non torna l'acqua. Nello spazio non vivono: resistono, in attesa.",
      en: "Tardigrades, or 'water bears', are tiny animals less than a millimetre long. In 2007 a European Space Agency mission left them outside a satellite for ten days, in the vacuum of space and under the Sun's rays. Back on Earth, many woke up and some even laid eggs. Their trick is to dry out almost completely and become a little ball called a 'tun': the body pauses until water returns. They don't live in space: they hold out, waiting." } },
  { go: { v: "lesson", id: "stelle" }, title: { it: "Un cucchiaino di stella di neutroni pesa miliardi di tonnellate", en: "A teaspoon of neutron star weighs billions of tonnes" },
    text: { it: "Quando una stella gigante esplode, il suo cuore può schiacciarsi fino a diventare una stella di neutroni: una sfera di circa 20 km con più massa del Sole. La pressione è così forte che gli atomi vengono schiacciati, e i loro elettroni e protoni si fondono in neutroni, stretti uno contro l'altro. Ne viene fuori una materia talmente densa che un cucchiaino peserebbe miliardi di tonnellate: più di tutte le persone della Terra messe insieme.",
      en: "When a giant star explodes, its core can be crushed into a neutron star: a ball about 20 km across with more mass than the Sun. The pressure is so great that atoms are squashed, and their electrons and protons merge into neutrons packed tightly together. The result is matter so dense that a teaspoon of it would weigh billions of tonnes: more than every person on Earth put together." } },
  { go: { v: "solar", id: "venus" },
    title: { it: "Su Venere un giorno dura più di un anno", en: "On Venus a day lasts longer than a year" },
    text: { it: "Venere impiega 225 giorni terrestri a girare intorno al Sole, ma ben 243 a fare un giro su se stessa. E gira al contrario rispetto alla Terra: lì il Sole sorge a ovest e tramonta a est. Gli scienziati pensano che la sua rotazione sia stata rallentata, e forse capovolta, dalla sua atmosfera densissima e dalle maree del Sole.",
      en: "Venus takes 225 Earth days to go around the Sun, but a full 243 to spin once on its axis. And it spins the opposite way to Earth: there the Sun rises in the west and sets in the east. Scientists think its spin was slowed, and perhaps flipped, by its very thick atmosphere and the Sun's tides." } },
  { go: { v: "solar", id: "neptune" },
    title: { it: "Dentro Urano e Nettuno potrebbe piovere diamanti", en: "It may rain diamonds inside Uranus and Neptune" },
    text: { it: "Nelle profondità di Urano e Nettuno la pressione e il calore sono enormi. Lì il metano si spezza, e il carbonio che contiene potrebbe compattarsi in cristalli di diamante che affondano lentamente verso il centro, come una pioggia. Nel 2017 alcuni scienziati in California sono riusciti a creare in laboratorio minuscoli diamanti proprio così, schiacciando per un istante una plastica simile con un laser potentissimo.",
      en: "Deep inside Uranus and Neptune the pressure and heat are enormous. There methane breaks apart, and its carbon may pack into diamond crystals that slowly sink towards the centre, like rain. In 2017 scientists in California made tiny diamonds in the lab exactly this way, squeezing a similar plastic for an instant with an extremely powerful laser." } },
  { go: { v: "galaxies", id: "m31" },
    title: { it: "Guardare il cielo è guardare il passato", en: "Looking at the sky is looking at the past" },
    text: { it: "La luce viaggia velocissima, 300.000 km al secondo, ma nello spazio le distanze sono così grandi che impiega tempo ad arrivare. La luce del Sole che vedi è partita 8 minuti fa. Quella della stella Polare circa 430 anni fa. E la Galassia di Andromeda, l'oggetto più lontano visibile a occhio nudo, la vediamo com'era 2,5 milioni di anni fa. Se oggi esplodesse una stella lontana, lo scopriremmo solo tra moltissimo tempo.",
      en: "Light travels incredibly fast, 300,000 km a second, but distances in space are so vast that it takes time to arrive. The sunlight you see left the Sun 8 minutes ago. The light of the North Star left about 430 years ago. And we see the Andromeda Galaxy, the farthest thing visible to the naked eye, as it was 2.5 million years ago. If a distant star exploded today, we would only find out a very long time from now." } },
  { go: { v: "solar", id: "sun" },
    title: { it: "Il Sole perde 4 milioni di tonnellate ogni secondo", en: "The Sun loses 4 million tonnes every second" },
    text: { it: "Nel cuore del Sole l'idrogeno si fonde e diventa elio. In questa trasformazione una piccola parte della materia sparisce e diventa energia, secondo la famosa formula di Einstein, E=mc². Così ogni secondo il Sole 'consuma' circa 4 milioni di tonnellate di materia: è l'energia che ci arriva come luce e calore. Non preoccuparti: è così grande che può andare avanti per altri 5 miliardi di anni.",
      en: "In the heart of the Sun, hydrogen fuses into helium. In the process a tiny part of the matter disappears and becomes energy, as Einstein's famous formula E=mc² says. So every second the Sun 'uses up' about 4 million tonnes of matter: that is the energy that reaches us as light and heat. Don't worry: it is so big it can keep going for another 5 billion years." } },
  { title: { it: "Nello spazio nessuno può sentirti", en: "In space nobody can hear you" },
    text: { it: "Il suono è una vibrazione che viaggia passando da una molecola all'altra: nell'aria, nell'acqua, nei muri. Nello spazio tra una molecola e l'altra c'è quasi il vuoto, e il suono non ha niente su cui viaggiare. Per questo durante le passeggiate spaziali gli astronauti parlano via radio: le onde radio sono una forma di luce, e la luce attraversa il vuoto senza problemi. Le esplosioni dei film di fantascienza, in realtà, sarebbero silenziosissime.",
      en: "Sound is a vibration that travels by passing from one molecule to the next: through air, water, walls. In space there is almost nothing between molecules, so sound has nothing to travel through. That's why astronauts on spacewalks talk by radio: radio waves are a form of light, and light crosses empty space with no trouble. The explosions in science-fiction films would actually be completely silent." } },
  { go: { v: "galaxies", id: "mw" },
    title: { it: "Tutte le stelle che vedi sono della nostra galassia", en: "Every star you can see belongs to our galaxy" },
    text: { it: "In una notte buia, lontano dalle luci, a occhio nudo si vedono alcune migliaia di stelle. Sono tutte vicine, tutte dentro la Via Lattea. Le altre galassie sono così lontane che le loro stelle non si distinguono una per una: al massimo vediamo una macchiolina chiara, come Andromeda o le Nubi di Magellano. La Via Lattea ha centinaia di miliardi di stelle: quelle che vedi sono una piccolissima parte del nostro vicinato.",
      en: "On a dark night, far from city lights, you can see a few thousand stars with the naked eye. They are all nearby, all inside the Milky Way. Other galaxies are so far away that their stars can't be seen one by one: at most we see a pale smudge, like Andromeda or the Magellanic Clouds. The Milky Way has hundreds of billions of stars: the ones you see are a tiny part of our neighbourhood." } },
  { go: { v: "solar", id: "mars" },
    title: { it: "Il vulcano più grande del sistema solare è largo quasi come l'Italia", en: "The solar system's biggest volcano is almost as wide as Italy" },
    text: { it: "L'Olympus Mons, su Marte, è alto circa 22 km, più di due volte e mezzo l'Everest. Ma la cosa più incredibile è la sua base: circa 600 km di diametro, una superficie quasi pari a quella dell'Italia. È così largo e le sue pendenze sono così dolci che, camminandoci sopra dal bordo, non ti accorgeresti nemmeno di essere su una montagna: la cima resterebbe oltre l'orizzonte.",
      en: "Olympus Mons, on Mars, is about 22 km tall, more than two and a half times Everest. But the most amazing thing is its base: about 600 km across, an area almost as big as Italy. It is so wide and its slopes are so gentle that, walking up from its edge, you wouldn't even notice you were on a mountain: the summit would stay beyond the horizon." } },
  { go: { v: "solar", id: "jupiter" },
    title: { it: "La Grande Macchia Rossa si sta rimpicciolendo", en: "The Great Red Spot is shrinking" },
    text: { it: "La Grande Macchia Rossa di Giove è una tempesta con venti che superano i 400 km/h. Alla fine dell'Ottocento era larga circa 40.000 km, tre volte la Terra; oggi è poco più larga del nostro pianeta. Nessuno sa con certezza se un giorno sparirà. È osservata senza interruzioni almeno dal 1830: è la tempesta più lunga mai seguita dagli astronomi.",
      en: "Jupiter's Great Red Spot is a storm with winds faster than 400 km/h. In the late 1800s it was about 40,000 km wide, three times the Earth; today it is only a little wider than our planet. Nobody knows for sure whether it will one day disappear. It has been watched without a break since at least 1830: the longest storm astronomers have ever followed." } },
  { go: { v: "solar", id: "saturn" },
    title: { it: "Gli anelli di Saturno potrebbero essere giovanissimi", en: "Saturn's rings may be very young" },
    text: { it: "Gli anelli di Saturno sono fatti quasi solo di ghiaccio pulito e brillante. Secondo le misure della sonda Cassini potrebbero essersi formati 'solo' qualche centinaio di milioni di anni fa, forse addirittura dopo la comparsa dei dinosauri sulla Terra. E piano piano stanno cadendo su Saturno, come una pioggia di ghiaccio. Non tutti gli scienziati sono d'accordo sulla loro età: è uno dei misteri ancora aperti.",
      en: "Saturn's rings are made almost entirely of clean, bright ice. According to measurements by the Cassini probe, they may have formed 'only' a few hundred million years ago, perhaps even after the first dinosaurs appeared on Earth. And slowly they are falling onto Saturn, like a rain of ice. Not all scientists agree on their age: it's one of the open mysteries." } },
  { go: { v: "solar", id: "uranus" },
    title: { it: "Urano fu scoperto da un musicista", en: "Uranus was discovered by a musician" },
    text: { it: "Nel 1781 William Herschel, un musicista tedesco trasferito in Inghilterra con la passione per l'astronomia, notò con il suo telescopio una 'stella' che si muoveva. All'inizio pensò fosse una cometa: era invece il primo pianeta mai scoperto con un telescopio. Voleva chiamarlo 'la stella di Giorgio', in onore del re d'Inghilterra, ma alla fine vinse il nome di Urano, il dio greco del cielo.",
      en: "In 1781 William Herschel, a German musician living in England who loved astronomy, noticed a 'star' moving through his telescope. At first he thought it was a comet: it was actually the first planet ever discovered with a telescope. He wanted to call it 'George's Star', after the King of England, but in the end the name Uranus won, after the Greek god of the sky." } },
  { go: { v: "solar", id: "moon" },
    title: { it: "Le impronte sulla Luna dureranno milioni di anni", en: "Footprints on the Moon will last millions of years" },
    text: { it: "Sulla Luna non c'è aria, quindi non c'è vento e non c'è pioggia. Le impronte lasciate dagli astronauti delle missioni Apollo, tra il 1969 e il 1972, sono ancora lì, insieme a strumenti e veicoli. A cancellarle, molto lentamente, saranno solo i minuscoli meteoriti che continuano a cadere sulla superficie: ci vorranno probabilmente milioni di anni.",
      en: "The Moon has no air, so there's no wind and no rain. The footprints left by the Apollo astronauts between 1969 and 1972 are still there, along with instruments and vehicles. Only the tiny meteorites that keep falling on the surface will wipe them away, very slowly: it will probably take millions of years." } },
  { go: { v: "solar", id: "mercury" },
    title: { it: "C'è ghiaccio anche su Mercurio", en: "There is ice even on Mercury" },
    text: { it: "Mercurio è il pianeta più vicino al Sole e di giorno arriva a 430 °C. Eppure ai suoi poli ci sono crateri così profondi che il fondo non vede mai la luce del Sole: lì la temperatura resta sotto i −170 °C da milioni di anni. La sonda MESSENGER della NASA ha confermato che in quei crateri c'è ghiaccio d'acqua.",
      en: "Mercury is the closest planet to the Sun and reaches 430 °C by day. Yet at its poles there are craters so deep that their floors never see sunlight: there the temperature has stayed below −170 °C for millions of years. NASA's MESSENGER probe confirmed that those craters hold water ice." } },
  { go: { v: "galaxies", id: "mw" },
    title: { it: "Un anno galattico dura 230 milioni di anni", en: "A galactic year lasts 230 million years" },
    text: { it: "Il Sole, con tutti i suoi pianeti, gira intorno al centro della Via Lattea a circa 800.000 km/h. Eppure la galassia è così grande che per fare un giro completo ci vogliono circa 230 milioni di anni. L'ultima volta che il Sole si trovava in questo punto della sua orbita, sulla Terra stavano comparendo i primi dinosauri.",
      en: "The Sun, with all its planets, travels around the centre of the Milky Way at about 800,000 km/h. Yet the galaxy is so big that one full lap takes about 230 million years. The last time the Sun was at this point of its orbit, the first dinosaurs were appearing on Earth." } },
  { go: { v: "galaxies", id: "m31" },
    title: { it: "Se potessi vederla tutta, Andromeda sarebbe enorme nel cielo", en: "If you could see all of it, Andromeda would look huge" },
    text: { it: "A occhio nudo la Galassia di Andromeda sembra una macchiolina. Ma quello è solo il suo centro luminoso: le parti esterne sono troppo deboli per i nostri occhi. Se potessimo vederla tutta, nel cielo sarebbe larga circa sei volte la Luna piena. È lassù, nelle notti d'autunno: semplicemente non è abbastanza luminosa.",
      en: "To the naked eye the Andromeda Galaxy looks like a little smudge. But that is only its bright centre: its outer parts are too faint for our eyes. If we could see all of it, it would stretch across the sky about six times the width of the full Moon. It's up there on autumn nights: it just isn't bright enough." } },
  { go: { v: "lesson", id: "big-bang" }, title: { it: "Una parte della 'neve' delle vecchie TV veniva dal Big Bang", en: "Some of the 'snow' on old TVs came from the Big Bang" },
    text: { it: "Quando una vecchia televisione non era sintonizzata su nessun canale, lo schermo mostrava un fruscio di puntini, la 'neve'. Una piccola parte di quel disturbo, circa l'1%, era la radiazione cosmica di fondo: la luce più antica dell'universo, partita circa 380.000 anni dopo il Big Bang e diventata, con l'espansione, onde radio debolissime. È ancora ovunque intorno a noi.",
      en: "When an old television wasn't tuned to any channel, the screen showed a fizz of dots, the 'snow'. A small part of that noise, about 1%, was the cosmic microwave background: the oldest light in the universe, released about 380,000 years after the Big Bang and stretched, by the expansion, into very faint radio waves. It is still all around us." } },
  { go: { v: "exo", id: "kepler16b" },
    title: { it: "Molte stelle hanno una gemella", en: "Many stars have a twin" },
    text: { it: "Il nostro Sole è solo, ma non è la regola: circa la metà delle stelle simili al Sole ha almeno una compagna, e le due girano una intorno all'altra. Esistono anche pianeti che girano intorno a due stelle insieme: da lì si vedrebbero due tramonti ogni sera, come nei film di fantascienza.",
      en: "Our Sun is alone, but that's not the rule: about half of Sun-like stars have at least one companion, and the two circle each other. There are even planets that orbit two stars at once: from there you would see two sunsets every evening, just like in science-fiction films." } },
  { go: { v: "exo", id: "51pegb" },
    title: { it: "Conosciamo più di 6.000 pianeti fuori dal sistema solare", en: "We know more than 6,000 planets beyond the solar system" },
    text: { it: "Fino al 1995 non sapevamo se esistessero pianeti intorno ad altre stelle simili al Sole. Quell'anno fu scoperto il primo, 51 Pegasi b. Oggi la NASA ne conta più di 6.400 e i telescopi ne trovano di nuovi ogni settimana. Quasi nessuno è stato visto direttamente: di solito si scoprono perché fanno 'ondeggiare' la loro stella, o ne oscurano un poco la luce passandole davanti.",
      en: "Until 1995 we didn't know whether there were planets around other Sun-like stars. That year the first one was found, 51 Pegasi b. Today NASA counts more than 6,400, and telescopes find new ones every week. Almost none has been seen directly: usually they are found because they make their star 'wobble', or dim its light a little as they pass in front." } },
  { go: { v: "exo", id: "proxb" },
    title: { it: "Per arrivare alla stella più vicina servirebbero 70.000 anni", en: "Reaching the nearest star would take 70,000 years" },
    text: { it: "Proxima Centauri, la stella più vicina al Sole, è a 4,2 anni luce: la sua luce impiega più di quattro anni ad arrivare fino a noi. La sonda Voyager 1, lanciata nel 1977, è l'oggetto costruito dall'uomo più lontano dalla Terra e viaggia a circa 61.000 km/h. A quella velocità, per arrivare fino a Proxima impiegherebbe più di 70.000 anni.",
      en: "Proxima Centauri, the nearest star to the Sun, is 4.2 light-years away: its light takes more than four years to reach us. The Voyager 1 probe, launched in 1977, is the human-made object farthest from Earth and travels at about 61,000 km/h. At that speed it would take more than 70,000 years to reach Proxima." } },
  { go: { v: "galaxies", id: "m87" },
    title: { it: "Per fotografare un buco nero serviva un telescopio grande come la Terra", en: "Photographing a black hole needed an Earth-sized telescope" },
    text: { it: "Un buco nero non emette luce, ma il gas che gli gira intorno brilla fortissimo. Il problema è che anche quello di M87, enorme, da qui appare minuscolo. Per vederlo gli scienziati hanno collegato otto radiotelescopi sparsi tra Hawaii, Cile, Spagna, Messico, Arizona e Polo Sud, facendoli lavorare come un unico telescopio grande quanto la Terra. Nel 2019 è uscita la prima foto di un buco nero della storia.",
      en: "A black hole gives off no light, but the gas swirling around it glows fiercely. The problem is that even M87's huge one looks tiny from here. To see it, scientists linked eight radio telescopes in Hawaii, Chile, Spain, Mexico, Arizona and the South Pole, making them work as a single telescope the size of the Earth. In 2019 the first photo of a black hole in history was released." } },
  { go: { v: "galaxies", id: "momz14" },
    title: { it: "L'universo ha 13,8 miliardi di anni ma è largo 93 miliardi di anni luce", en: "The universe is 13.8 billion years old but 93 billion light-years wide" },
    text: { it: "Sembra impossibile: se l'universo ha 13,8 miliardi di anni e niente va più veloce della luce, come fa a essere così grande? Il trucco è che, mentre la luce viaggia, lo spazio stesso si allarga. Le galassie più lontane che vediamo oggi hanno continuato ad allontanarsi, e ora si trovano a circa 46 miliardi di anni luce da noi. Per questo l'universo osservabile ha un diametro di circa 93 miliardi di anni luce.",
      en: "It sounds impossible: if the universe is 13.8 billion years old and nothing goes faster than light, how can it be so big? The trick is that while light travels, space itself stretches. The most distant galaxies we see today have kept moving away, and are now about 46 billion light-years from us. That's why the observable universe is about 93 billion light-years across." } },
  { go: { v: "galaxies", id: "m51" },
    title: { it: "Quando due galassie si scontrano, le stelle quasi non si toccano", en: "When two galaxies collide, the stars hardly ever touch" },
    text: { it: "Le stelle sono lontanissime tra loro: se il Sole fosse una pallina da ping pong, la stella più vicina sarebbe un'altra pallina a più di 1.000 km di distanza. Così, quando due galassie si scontrano, si attraversano e si deformano, ma le stelle quasi mai urtano una contro l'altra. A scontrarsi davvero sono le nubi di gas, che si comprimono e fanno nascere tantissime stelle nuove.",
      en: "Stars are incredibly far apart: if the Sun were a ping-pong ball, the nearest star would be another ping-pong ball more than 1,000 km away. So when two galaxies collide, they pass through each other and get pulled out of shape, but the stars almost never hit one another. What really collides are the gas clouds, which get squeezed and give birth to lots of new stars." } },
  { go: { v: "solar", id: "mars" },
    title: { it: "Su Marte i tramonti sono blu", en: "Sunsets on Mars are blue" },
    text: { it: "Sulla Terra il cielo è azzurro di giorno e rosso al tramonto. Su Marte succede quasi il contrario: di giorno il cielo è color caramello per la polvere sospesa nell'aria, mentre al tramonto, intorno al Sole, si forma un alone blu. La polvere finissima di Marte lascia passare la luce blu soprattutto nella direzione del Sole. I robot della NASA lo hanno fotografato molte volte.",
      en: "On Earth the sky is blue by day and red at sunset. On Mars it's almost the opposite: by day the sky is butterscotch-coloured because of dust in the air, while at sunset a blue glow forms around the Sun. Mars's very fine dust lets blue light through mostly in the Sun's direction. NASA's rovers have photographed it many times." } },
  { go: { v: "solar", id: "earth" },
    title: { it: "Gli astronauti vedono 16 albe al giorno", en: "Astronauts see 16 sunrises a day" },
    text: { it: "La Stazione Spaziale Internazionale gira intorno alla Terra a circa 400 km di altezza e a 28.000 km/h: fa un giro completo in circa 90 minuti. A ogni giro passa dal giorno alla notte e di nuovo al giorno, così in 24 ore gli astronauti vedono circa 16 albe e 16 tramonti. Per dormire si chiudono in piccole cabine e seguono l'orario di Greenwich.",
      en: "The International Space Station circles the Earth about 400 km up at 28,000 km/h: one full lap takes about 90 minutes. Each lap goes from day to night and back again, so in 24 hours the astronauts see about 16 sunrises and 16 sunsets. To sleep they shut themselves in small cabins and follow Greenwich time." } },
  { go: { v: "solar", id: "neptune" },
    title: { it: "Nettuno ha fatto un solo giro da quando l'abbiamo scoperto", en: "Neptune has made only one lap since we found it" },
    text: { it: "Nettuno è così lontano dal Sole che per fare un giro completo impiega 165 anni terrestri. È stato scoperto nel 1846 e ha completato la sua prima orbita, da allora, solo nel 2011. Su Nettuno nessuno di noi riuscirebbe a festeggiare nemmeno un compleanno.",
      en: "Neptune is so far from the Sun that one full lap takes 165 Earth years. It was discovered in 1846 and only completed its first orbit since then in 2011. On Neptune none of us would live to celebrate even one birthday." } },
  { title: { it: "Plutone ha un cuore di ghiaccio", en: "Pluto has a heart of ice" },
    text: { it: "Nel 2015 la sonda New Horizons ha sorvolato Plutone e ha scoperto sulla sua superficie una grande zona chiara a forma di cuore. È una pianura di ghiaccio di azoto larga circa 1.000 km, che si rimescola lentamente come un ghiacciaio. Dal 2006 Plutone non è più considerato un pianeta ma un 'pianeta nano', perché nella sua zona dello spazio ci sono molti altri corpi simili.",
      en: "In 2015 the New Horizons probe flew past Pluto and found a large, bright, heart-shaped region on its surface. It's a plain of nitrogen ice about 1,000 km wide that slowly churns like a glacier. Since 2006 Pluto has been classed not as a planet but as a 'dwarf planet', because many similar bodies share its region of space." } },
  { title: { it: "Le stelle cadenti sono granelli di sabbia", en: "Shooting stars are grains of sand" },
    text: { it: "Una stella cadente non è una stella: è un granello di polvere, spesso più piccolo di un chicco di sabbia, che entra nell'atmosfera a decine di chilometri al secondo. L'aria che gli sbatte contro lo scalda così tanto che si vaporizza a circa 100 km di altezza, lasciando una scia luminosa. Le 'notti delle stelle cadenti', come quella di San Lorenzo ad agosto, avvengono quando la Terra attraversa la scia di polvere lasciata da una cometa.",
      en: "A shooting star isn't a star: it's a speck of dust, often smaller than a grain of sand, hitting the atmosphere at tens of kilometres a second. The air slamming into it heats it so much that it vaporises about 100 km up, leaving a glowing trail. Meteor showers, like the Perseids in August, happen when the Earth passes through the trail of dust left by a comet." } },
  { title: { it: "La coda di una cometa non sta dietro, ma lontano dal Sole", en: "A comet's tail points away from the Sun, not behind" },
    text: { it: "Quando una cometa si avvicina al Sole, il suo ghiaccio si scalda e diventa gas, liberando polvere: nasce la coda, che può essere lunga milioni di chilometri. Ma la coda non segue la cometa come quella di un aquilone: è spinta dal vento solare e dalla luce del Sole, e punta sempre dalla parte opposta al Sole. Quando la cometa si allontana, la coda le sta davanti!",
      en: "As a comet nears the Sun, its ice warms up and turns to gas, releasing dust: a tail forms that can be millions of kilometres long. But the tail doesn't trail behind like a kite's: it is pushed by the solar wind and sunlight, and always points away from the Sun. When the comet heads back out, its tail goes in front!" } }
];
const CUR_EARTH = [
  { go: { v: "lesson", id: "cielo-blu" },
    title: { it: "Perché il cielo è azzurro?", en: "Why is the sky blue?" },
    text: { it: "La luce del Sole sembra bianca, ma contiene tutti i colori dell'arcobaleno. Quando attraversa l'aria, le molecole di azoto e ossigeno fanno 'rimbalzare' in ogni direzione soprattutto la luce blu, che ha onde più corte. Così il blu ci arriva da ogni punto del cielo. Al tramonto la luce attraversa molta più aria: il blu si disperde per strada e arrivano soprattutto il rosso e l'arancione.",
      en: "Sunlight looks white, but it contains all the colours of the rainbow. As it passes through the air, nitrogen and oxygen molecules bounce mostly the blue light, which has shorter waves, in every direction. So blue reaches us from every part of the sky. At sunset the light crosses much more air: the blue gets scattered away on the journey and mostly red and orange arrive." } },
  { go: { v: "lesson", id: "nuvole" },
    title: { it: "Una nuvola può pesare quanto 100 elefanti", en: "A cloud can weigh as much as 100 elephants" },
    text: { it: "Una normale nuvola bianca, un cumulo, contiene centinaia di tonnellate d'acqua: una stima famosa del servizio geologico americano parla di circa 500 tonnellate, come 100 elefanti. Allora perché non cade? Perché quell'acqua è divisa in miliardi di goccioline piccolissime, sparse in un volume d'aria enorme, e l'aria calda che sale le tiene sospese. Quando le goccioline si uniscono e diventano troppo pesanti, cadono: è la pioggia.",
      en: "An ordinary white cloud, a cumulus, holds hundreds of tonnes of water: a well-known estimate from the US Geological Survey puts it at about 500 tonnes, like 100 elephants. So why doesn't it fall? Because the water is split into billions of tiny droplets spread through a huge volume of air, and rising warm air holds them up. When droplets join and get too heavy, they fall: that's rain." } },
  { title: { it: "Un fulmine è più caldo della superficie del Sole", en: "Lightning is hotter than the surface of the Sun" },
    text: { it: "Per una frazione di secondo l'aria attraversata da un fulmine arriva a circa 30.000 °C, cinque volte la temperatura della superficie del Sole. Si scalda così in fretta che si espande di colpo, come un'esplosione: quel boato è il tuono. La luce arriva quasi subito, il suono viaggia a circa 340 metri al secondo: conta i secondi tra lampo e tuono, dividi per 3, e saprai a quanti chilometri è caduto.",
      en: "For a split second, the air a lightning bolt passes through reaches about 30,000 °C, five times the temperature of the Sun's surface. It heats so fast that it expands all at once, like an explosion: that boom is thunder. Light arrives almost instantly, while sound travels at about 340 metres a second: count the seconds between flash and thunder, divide by 3, and you'll know how many kilometres away it struck." } },
  { go: { v: "earth", hotspot: "amazon" },
    title: { it: "Il deserto del Sahara nutre la foresta amazzonica", en: "The Sahara Desert feeds the Amazon rainforest" },
    text: { it: "Ogni anno il vento solleva milioni di tonnellate di polvere dal Sahara e la trasporta attraverso l'oceano Atlantico fino al Sud America. In quella polvere c'è il fosforo, un nutriente prezioso che le piogge amazzoniche portano continuamente via dal terreno. Secondo i satelliti della NASA, dal Sahara arrivano in Amazzonia circa 22.000 tonnellate di fosforo all'anno: più o meno quanto la foresta ne perde.",
      en: "Every year the wind lifts millions of tonnes of dust from the Sahara and carries it across the Atlantic to South America. That dust contains phosphorus, a precious nutrient that Amazon rains keep washing out of the soil. According to NASA satellites, about 22,000 tonnes of Saharan phosphorus reach the Amazon each year: roughly as much as the forest loses." } },
  { go: { v: "lesson", id: "mare-salato" },
    title: { it: "Perché il mare è salato?", en: "Why is the sea salty?" },
    text: { it: "La pioggia scioglie piano piano le rocce e porta via piccole quantità di sali, che i fiumi trasportano fino al mare. Quando l'acqua del mare evapora per formare le nuvole, il sale resta lì. Va avanti così da miliardi di anni: oggi in un litro d'acqua di mare ci sono circa 35 grammi di sale. Altri sali e minerali arrivano dai vulcani sottomarini.",
      en: "Rain slowly dissolves rocks and carries away small amounts of salts, which rivers take to the sea. When seawater evaporates to form clouds, the salt stays behind. This has gone on for billions of years: today a litre of seawater holds about 35 grams of salt. More salts and minerals come from underwater volcanoes." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "Un respiro su due lo devi al mare", en: "You owe every second breath to the sea" },
    text: { it: "Circa metà dell'ossigeno della Terra è prodotta nell'oceano da alghe microscopiche, il fitoplancton, che come le piante usano la luce del Sole. Una di queste, il Prochlorococcus, è così piccola che in un solo millilitro d'acqua di mare ce ne possono essere centinaia di migliaia. Probabilmente è l'organismo che fa fotosintesi più abbondante del pianeta.",
      en: "About half of Earth's oxygen is made in the ocean by microscopic algae, phytoplankton, which use sunlight just like plants. One of them, Prochlorococcus, is so small that a single millilitre of seawater can hold hundreds of thousands. It is probably the most abundant photosynthetic organism on the planet." } },
  { title: { it: "Perché alcuni vulcani esplodono e altri no?", en: "Why do some volcanoes explode and others don't?" },
    text: { it: "Dipende da quanto è densa la lava. Alle Hawaii il magma è fluido e povero di silice: il gas esce facilmente e la lava scorre come un fiume. In vulcani come il Vesuvio il magma è denso e appiccicoso, ricco di silice: il gas resta intrappolato, la pressione cresce e alla fine tutto esplode, come una bottiglia di spumante agitata. È quello che successe a Pompei nel 79 d.C.",
      en: "It depends on how thick the lava is. In Hawaii the magma is runny and low in silica: gas escapes easily and lava flows like a river. In volcanoes like Vesuvius the magma is thick and sticky, rich in silica: gas gets trapped, pressure builds, and in the end everything blows, like a shaken bottle of sparkling wine. That's what happened at Pompeii in 79 AD." } },
  { go: { v: "lesson", id: "aurore" },
    title: { it: "Da dove vengono i colori dell'aurora boreale", en: "Where the colours of the northern lights come from" },
    text: { it: "Il Sole lancia continuamente nello spazio particelle cariche: il vento solare. Il campo magnetico terrestre le devia verso i poli, dove colpiscono l'atmosfera tra 100 e 300 km di altezza e la fanno brillare, come un'insegna al neon. Il verde e il rosso vengono dall'ossigeno, il blu e il viola dall'azoto. Al Polo Sud lo stesso spettacolo si chiama aurora australe.",
      en: "The Sun constantly flings charged particles into space: the solar wind. Earth's magnetic field steers them towards the poles, where they hit the atmosphere 100 to 300 km up and make it glow, like a neon sign. Green and red come from oxygen, blue and purple from nitrogen. In the far south the same show is called the aurora australis." } },
  { title: { it: "L'arcobaleno in realtà è un cerchio", en: "A rainbow is really a circle" },
    text: { it: "Un arcobaleno nasce quando la luce del Sole entra nelle gocce di pioggia, si piega e si divide nei suoi colori. Le gocce che ci rimandano i colori sono tutte disposte su un cerchio intorno al punto opposto al Sole. Da terra ne vediamo solo la parte sopra l'orizzonte, cioè un arco; da un aereo o da una montagna alta, a volte, si vede il cerchio completo.",
      en: "A rainbow forms when sunlight enters raindrops, bends and splits into its colours. The drops that send the colours back to us all lie on a circle around the point opposite the Sun. From the ground we only see the part above the horizon, an arc; from a plane or a high mountain you can sometimes see the full circle." } },
  { go: { v: "lesson", id: "nuvole" }, title: { it: "Perché i fiocchi di neve hanno sei punte", en: "Why snowflakes have six points" },
    text: { it: "Quando il vapore acqueo gela in alto nel cielo, le molecole d'acqua si agganciano tra loro formando un esagono: è la loro forma naturale da ghiaccio. Per questo ogni fiocco ha sei lati o sei punte. Mentre cade, il fiocco attraversa zone più calde, più fredde, più umide, e ogni 'ricamo' cresce in modo diverso: per questo trovarne due identici è praticamente impossibile.",
      en: "When water vapour freezes high in the sky, water molecules lock together in a hexagon: their natural ice shape. That's why every snowflake has six sides or six points. As it falls, the flake passes through warmer, colder and damper air, and every 'lace' grows differently: that's why finding two identical ones is practically impossible." } },
  { go: { v: "lesson", id: "mare-salato" }, title: { it: "Nel Mar Morto si galleggia senza fare niente", en: "In the Dead Sea you float without trying" },
    text: { it: "Il Mar Morto, tra Israele e Giordania, è salato quasi dieci volte più dell'oceano. Più l'acqua è salata, più è densa e più spinge verso l'alto ciò che ci sta dentro: così il corpo galleggia da solo, come un tappo. È così salato che non ci vivono pesci, solo alcuni microbi: per questo si chiama 'Morto'. La sua riva è il punto più basso della Terra fuori dall'acqua, circa 430 metri sotto il livello del mare.",
      en: "The Dead Sea, between Israel and Jordan, is almost ten times saltier than the ocean. The saltier the water, the denser it is and the harder it pushes things up: so your body floats on its own, like a cork. It's so salty that no fish live there, only some microbes: hence the name 'Dead'. Its shore is the lowest dry land on Earth, about 430 metres below sea level." } },
  { go: { v: "lesson", id: "placche" },
    title: { it: "In cima all'Everest ci sono fossili di animali marini", en: "There are sea fossils at the top of Everest" },
    text: { it: "Le rocce sulla vetta dell'Everest, a 8.849 metri, contengono fossili di trilobiti, conchiglie e gigli di mare vissuti in un antico oceano centinaia di milioni di anni fa. Come ci sono arrivati lassù? L'India, spinta dal movimento delle placche, si è scontrata con l'Asia e ha sollevato il fondale di quell'oceano fino a formare l'Himalaya. E lo scontro continua: le montagne crescono ancora di qualche millimetro all'anno.",
      en: "The rocks at the summit of Everest, at 8,849 metres, hold fossils of trilobites, shells and sea lilies that lived in an ancient ocean hundreds of millions of years ago. How did they get up there? India, pushed by moving tectonic plates, crashed into Asia and lifted that ocean's floor until it became the Himalayas. The collision is still going: the mountains still grow a few millimetres a year." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "La montagna più alta del mondo è quasi tutta sott'acqua", en: "The tallest mountain in the world is mostly underwater" },
    text: { it: "L'Everest è la vetta più alta sopra il livello del mare. Ma se misuriamo una montagna dalla sua base, la più alta è il Mauna Kea, un vulcano delle Hawaii: parte dal fondo dell'oceano Pacifico e arriva a 4.207 metri sopra il mare, per un totale di oltre 10.000 metri. Più di metà della montagna è nascosta sotto le onde.",
      en: "Everest is the highest peak above sea level. But if we measure a mountain from its base, the tallest is Mauna Kea, a volcano in Hawaii: it rises from the floor of the Pacific to 4,207 metres above the sea, more than 10,000 metres in all. More than half the mountain is hidden beneath the waves." } },
  { go: { v: "solar", id: "earth" },
    title: { it: "Il punto più lontano dal centro della Terra non è l'Everest", en: "The point farthest from Earth's centre isn't Everest" },
    text: { it: "La Terra non è una sfera perfetta: girando su se stessa si è un po' 'allargata' all'equatore. Per questo una montagna vicina all'equatore parte già più lontana dal centro del pianeta. Il Chimborazo, un vulcano dell'Ecuador alto 6.263 metri, ha la cima più lontana dal centro della Terra di tutte: circa 2 km più lontana di quella dell'Everest.",
      en: "The Earth isn't a perfect sphere: spinning has made it bulge a little at the equator. So a mountain near the equator already starts farther from the planet's centre. Chimborazo, a 6,263-metre volcano in Ecuador, has the summit farthest from Earth's centre of all: about 2 km farther than Everest's." } },
  { go: { v: "lesson", id: "aurore" }, title: { it: "Il centro della Terra è caldo quanto la superficie del Sole", en: "Earth's centre is as hot as the Sun's surface" },
    text: { it: "A più di 5.000 km sotto i nostri piedi c'è il nucleo interno della Terra: una palla di ferro e nichel a circa 5.200 °C, quasi quanto la superficie del Sole. A quella temperatura il ferro dovrebbe essere liquido, ma la pressione, milioni di volte quella dell'aria, lo tiene solido. Intorno c'è un nucleo esterno liquido che, muovendosi, crea il campo magnetico terrestre: quello che fa funzionare le bussole.",
      en: "More than 5,000 km beneath our feet lies Earth's inner core: a ball of iron and nickel at about 5,200 °C, nearly as hot as the Sun's surface. At that temperature iron should be liquid, but the pressure, millions of times that of the air, keeps it solid. Around it is a liquid outer core whose motion creates Earth's magnetic field: the one that makes compasses work." } },
  { title: { it: "Esiste un albero vivo più vecchio delle piramidi", en: "There's a living tree older than the pyramids" },
    text: { it: "Sulle White Mountains, in California, crescono i pini dai coni setolosi, alberi contorti che vivono in un ambiente freddo e secco. Uno di loro, soprannominato Matusalemme, ha più di 4.800 anni: era già un alberello quando in Egitto si costruivano le piramidi di Giza. La sua posizione esatta è tenuta segreta, per proteggerlo.",
      en: "In California's White Mountains grow bristlecone pines, twisted trees that live in a cold, dry place. One of them, nicknamed Methuselah, is more than 4,800 years old: it was already a sapling when the pyramids of Giza were being built in Egypt. Its exact location is kept secret to protect it." } },
  { title: { it: "Il più grande essere vivente è un bosco intero", en: "The biggest living thing is a whole forest" },
    text: { it: "Nello Utah, negli Stati Uniti, c'è un bosco di circa 47.000 pioppi tremuli. Sembrano alberi diversi, ma sono tutti lo stesso individuo: un'unica pianta che si è allargata nei secoli con nuovi tronchi spuntati dalle stesse radici. Si chiama Pando, che in latino significa 'mi allargo', e pesa circa 6.000 tonnellate: è uno degli organismi più pesanti della Terra.",
      en: "In Utah, in the United States, there's a grove of about 47,000 quaking aspens. They look like separate trees, but they're all one individual: a single plant that has spread over the centuries, sending up new trunks from the same roots. It's called Pando, Latin for 'I spread', and weighs about 6,000 tonnes: one of the heaviest organisms on Earth." } },
  { go: { v: "dive", id: "amazon" },
    title: { it: "Sulla Terra vivono circa 20 milioni di miliardi di formiche", en: "About 20 quadrillion ants live on Earth" },
    text: { it: "Nel 2022 un gruppo di scienziati ha stimato quante formiche vivono sul pianeta: circa 20 milioni di miliardi, cioè 20 seguito da 15 zeri. Sono circa due milioni e mezzo di formiche per ogni essere umano, e tutte insieme pesano più di tutti gli uccelli e i mammiferi selvatici messi insieme. Sono fondamentali: smuovono il terreno, spargono semi e ripuliscono il suolo.",
      en: "In 2022 a team of scientists estimated how many ants live on the planet: about 20 quadrillion, that's 20 followed by 15 zeros. That's around two and a half million ants for every person, and together they outweigh all wild birds and mammals combined. They're essential: they turn the soil, spread seeds and clean up the ground." } },
  { go: { v: "lesson", id: "luce" }, title: { it: "Le api vedono colori che noi non possiamo vedere", en: "Bees see colours we can't" },
    text: { it: "Gli occhi delle api vedono la luce ultravioletta, invisibile per noi. Molti fiori che a noi sembrano tinta unita, per un'ape hanno disegni nascosti: righe e macchie ultraviolette che indicano il centro del fiore, dove c'è il nettare, come le luci di una pista d'atterraggio. In cambio, passando da un fiore all'altro, le api trasportano il polline e aiutano le piante a fare i semi.",
      en: "Bees' eyes can see ultraviolet light, which is invisible to us. Many flowers that look plain to us have hidden patterns for a bee: ultraviolet stripes and spots pointing to the flower's centre, where the nectar is, like runway lights. In return, flying from flower to flower, bees carry pollen and help plants make seeds." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "Esiste una medusa che può tornare giovane", en: "There's a jellyfish that can turn young again" },
    text: { it: "La Turritopsis dohrnii, una medusa grande meno di un centimetro, vive anche nel Mediterraneo. Quando è ferita, malata o in difficoltà, invece di morire può trasformarsi di nuovo nella sua forma giovanile, il polipo, e ricominciare la vita da capo. Per questo la chiamano 'medusa immortale', anche se in natura può comunque essere mangiata o ammalarsi.",
      en: "Turritopsis dohrnii, a jellyfish less than a centimetre across, lives in the Mediterranean too. When it's injured, sick or stressed, instead of dying it can turn back into its young form, the polyp, and start its life again. That's why it's called the 'immortal jellyfish', although in the wild it can still be eaten or fall ill." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "L'animale più grande mai esistito vive oggi", en: "The largest animal that ever lived is alive today" },
    text: { it: "La balenottera azzurra può superare i 30 metri di lunghezza e pesare oltre 150 tonnellate: più di qualsiasi dinosauro conosciuto. Eppure si nutre di animaletti lunghi pochi centimetri, il krill, e in un giorno ne può mangiare fino a 16 tonnellate. Il suo cuore da solo pesa circa 180 kg.",
      en: "The blue whale can grow over 30 metres long and weigh more than 150 tonnes: more than any known dinosaur. Yet it feeds on animals a few centimetres long, krill, and can eat up to 16 tonnes of them in a day. Its heart alone weighs about 180 kg." } },
  { go: { v: "lesson", id: "tardigradi" }, title: { it: "I tardigradi forse vivono nel tuo giardino", en: "Tardigrades may live in your garden" },
    text: { it: "I tardigradi, gli animaletti capaci di resistere persino nello spazio, non sono rari: vivono un po' ovunque, dai ghiacci dell'Antartide alle cime delle montagne. Il posto più facile dove cercarli è il muschio umido sui muri o sugli alberi. Con un semplice microscopio e un po' di pazienza si possono vedere camminare goffamente sulle loro otto zampette, come piccoli orsi.",
      en: "Tardigrades, the tiny animals that can even hold out in space, aren't rare: they live almost everywhere, from Antarctic ice to mountain tops. The easiest place to look is damp moss on walls or trees. With a simple microscope and a little patience you can watch them waddle on their eight stubby legs, like tiny bears." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "Conosciamo meglio la superficie di Marte del fondo dell'oceano", en: "We know Mars's surface better than our ocean floor" },
    text: { it: "L'oceano copre più di due terzi della Terra, ma solo circa un quarto del suo fondale è stato mappato in modo dettagliato. Di Marte e della Luna invece esistono mappe complete fatte dai satelliti, perché lì non c'è acqua a nascondere il suolo. Ogni volta che i robot sottomarini scendono negli abissi trovano specie mai viste prima.",
      en: "The ocean covers more than two thirds of the Earth, but only about a quarter of its floor has been mapped in detail. Mars and the Moon, on the other hand, have complete maps made by satellites, because there's no water hiding the ground. Every time underwater robots go down into the deep, they find species never seen before." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "La prima discesa nel punto più profondo dell'oceano", en: "The first descent to the deepest point of the ocean" },
    text: { it: "Il 23 gennaio 1960 Jacques Piccard e Don Walsh scesero nella Fossa delle Marianne a bordo del batiscafo Trieste, costruito in Italia. Ci misero quasi cinque ore ad arrivare a quasi 11.000 metri e restarono sul fondo solo 20 minuti. Il primo a tornarci fu il regista James Cameron, nel 2012, da solo.",
      en: "On 23 January 1960, Jacques Piccard and Don Walsh descended into the Mariana Trench aboard the bathyscaphe Trieste, built in Italy. It took them almost five hours to reach nearly 11,000 metres, and they stayed on the bottom for only 20 minutes. The first to return was film director James Cameron, in 2012, alone." } },
  { go: { v: "dive", id: "ocean" },
    title: { it: "Tre animali degli abissi su quattro producono luce", en: "Three in four deep-sea animals make their own light" },
    text: { it: "Nel buio totale degli abissi la luce è un linguaggio: serve ad attirare le prede, confondere i predatori, trovare un compagno. Uno studio del centro di ricerca dell'acquario di Monterey, in California, ha scoperto che circa il 76% degli animali osservati in profondità è bioluminescente: produce luce propria grazie a reazioni chimiche, come le lucciole.",
      en: "In the total darkness of the deep, light is a language: it lures prey, confuses predators and helps find a mate. A study by the Monterey Bay Aquarium Research Institute in California found that about 76% of the animals observed in the deep are bioluminescent: they make their own light through chemical reactions, like fireflies." } },
  { go: { v: "solar", id: "mars" },
    title: { it: "Nel deserto più secco del mondo si provano i robot per Marte", en: "Mars rovers are tested in the world's driest desert" },
    text: { it: "Il deserto di Atacama, in Cile, è il deserto non polare più secco della Terra: in alcune zone cadono pochi millimetri di pioggia in molti anni. Il suolo è così arido e povero di vita che somiglia a quello di Marte: per questo la NASA e altre agenzie spaziali ci vanno a provare robot e strumenti destinati al pianeta rosso. Eppure, quando piove, il deserto si copre di fiori.",
      en: "Chile's Atacama is the driest non-polar desert on Earth: some areas get only a few millimetres of rain over many years. Its soil is so dry and lifeless that it resembles Mars, so NASA and other space agencies go there to test rovers and instruments bound for the red planet. And yet, when it rains, the desert bursts into flower." } },
  { title: { it: "L'Antartide è il deserto più grande del mondo", en: "Antarctica is the largest desert in the world" },
    text: { it: "Un deserto non è per forza caldo: è un luogo dove piove o nevica pochissimo. In gran parte dell'Antartide cadono meno di 200 millimetri d'acqua all'anno, per questo è considerata un deserto, il più grande della Terra. Eppure il suo ghiaccio, spesso in media più di 2 km, contiene circa il 70% dell'acqua dolce del pianeta. Lì è stata registrata la temperatura più bassa mai misurata da una stazione meteo: −89,2 °C.",
      en: "A desert doesn't have to be hot: it's a place where very little rain or snow falls. Most of Antarctica gets less than 200 millimetres of water a year, so it counts as a desert, the largest on Earth. Yet its ice, on average more than 2 km thick, holds about 70% of the planet's fresh water. It's also where the lowest temperature ever measured by a weather station was recorded: −89.2 °C." } },
  { go: { v: "dive", id: "amazon" },
    title: { it: "La foresta amazzonica crea la propria pioggia", en: "The Amazon rainforest makes its own rain" },
    text: { it: "Gli alberi assorbono acqua dal terreno e la rilasciano dalle foglie come vapore. In Amazzonia gli alberi sono così tanti che ogni giorno mandano nell'aria miliardi di tonnellate d'acqua, formando dei veri e propri 'fiumi volanti' di vapore. Quel vapore diventa nuvole e ricade come pioggia, anche a migliaia di chilometri di distanza: una parte importante della pioggia amazzonica viene dalla foresta stessa.",
      en: "Trees draw water from the soil and release it from their leaves as vapour. The Amazon has so many trees that every day they send billions of tonnes of water into the air, forming real 'flying rivers' of vapour. That vapour becomes clouds and falls again as rain, even thousands of kilometres away: a large share of Amazon rain comes from the forest itself." } },
  { go: { v: "dive", id: "madagascar" },
    title: { it: "Il Madagascar è un'isola dove l'evoluzione ha fatto a modo suo", en: "Madagascar is an island where evolution went its own way" },
    text: { it: "Il Madagascar si è separato dall'India circa 88 milioni di anni fa ed è rimasto isolato in mezzo all'oceano. Gli animali e le piante che c'erano, o che ci sono arrivati per caso galleggiando su tronchi e zolle, si sono evoluti da soli. Il risultato: circa il 90% delle sue specie non vive da nessun'altra parte del mondo. I lemuri, per esempio, vengono tutti da lì.",
      en: "Madagascar split from India about 88 million years ago and has stayed isolated in the middle of the ocean ever since. The animals and plants already there, or that arrived by chance floating on logs and rafts of vegetation, evolved on their own. The result: about 90% of its species live nowhere else in the world. Lemurs, for example, all come from there." } },
  { go: { v: "lesson", id: "luna" },
    title: { it: "Ai tempi dei dinosauri un anno aveva 372 giorni", en: "In the age of dinosaurs a year had 372 days" },
    text: { it: "Con le maree, la Luna frena pian piano la rotazione della Terra: le giornate si allungano di circa 2 millesimi di secondo ogni secolo. Sembra niente, ma in milioni di anni conta. Studiando gli anelli di crescita di una conchiglia fossile vissuta 70 milioni di anni fa, gli scienziati hanno scoperto che allora un giorno durava circa 23 ore e mezza, e un anno ne contava 372.",
      en: "Through the tides, the Moon slowly brakes Earth's spin: days get longer by about 2 thousandths of a second every century. It sounds like nothing, but over millions of years it adds up. By studying the daily growth rings of a fossil shell that lived 70 million years ago, scientists found that a day then lasted about 23 and a half hours, and a year had 372 of them." } }
];

   LOOP
   ========================================================= */
let lastW = -1, lastH = -1;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (!(w > 0 && h > 0)) return;
  lastW = w; lastH = h;
  renderer.setSize(w, h, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); applyOffset(); measureBar();
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
  const p = camera.position;
  if (needsFit || !isFinite(p.x + p.y + p.z)) { needsFit = false; fly = null; solar.follow = null; setCamera(VIEW); }
  if (dive) { measureAnchors(); onDiveScroll(); }
  if (!diveEl.hidden) startMotes();
}
window.addEventListener("resize", resize);
try { new ResizeObserver(() => resize()).observe(document.documentElement); } catch (e) {}
const clock = new THREE.Clock();
function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
function loop() {
  requestAnimationFrame(loop); loopStarted = true;

  if (innerWidth !== lastW || innerHeight !== lastH) resize();
  if (overlayOpen || lastW <= 0) return;
  const V = VIEWS[VIEW]; V.update(dt);
  if (fly) {
    fly.k = Math.min(1, (performance.now() - fly.start) / (fly.dur * 1000)); const e = ease(fly.k);
    if (VIEW === "solar" && panelState && panelState.type === "planet") { const live = solar.worldPos(panelState.id, new THREE.Vector3()); const d = live.clone().sub(fly.t1); fly.t1.add(d); fly.p1.add(d); }
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.k >= 1) { const a = fly.after; fly = null; a && a(); }
  } else if (VIEW === "solar" && solar.follow) {
    const now = solar.worldPos(solar.follow.id, new THREE.Vector3()); const d = now.clone().sub(solar.follow.last);
    camera.position.add(d); controls.target.add(d); solar.follow.last.copy(now);
    if (solar.follow.center && !interacting) {
      const c = now.clone().sub(controls.target);
      if (c.length() < 1e-3) solar.follow.center = false; else { c.multiplyScalar(Math.min(1, dt * 4)); camera.position.add(c); controls.target.add(c); }
    }
  }
  controls.update();
  if (VIEW === "solar") keepOutsidePlanets();
  stepOffset(dt);
  renderer.render(V.scene, camera);
  updateLabels();
}

      p: { it: "Immagina un muro con due fessure strette e, dietro, uno schermo. Se lanci delle palline, sullo schermo si formano due strisce, una dietro ogni fessura. Se invece mandi un’onda, come le onde dell’acqua, le due onde che escono dalle fessure si sommano e si cancellano: sullo schermo compaiono tante strisce alternate, chiare e scure. Si chiama interferenza ed è il marchio di fabbrica delle onde.", en: "Imagine a wall with two narrow slits and a screen behind it. If you throw little balls, two stripes form on the screen, one behind each slit. If instead you send a wave, like water waves, the two waves coming out of the slits add up and cancel out: many alternating stripes appear on the screen, bright and dark. This is called interference, and it is the trademark of waves." } },
    { h: { it: "Uno alla volta, eppure a strisce", en: "One at a time, yet in stripes" },
      p: { it: "Ora spara elettroni, uno alla volta. Ognuno arriva sullo schermo come un puntino, proprio come una pallina. Ma dopo migliaia di puntini compare il disegno a strisce delle onde! Ogni singolo elettrone si comporta come se fosse passato da tutte e due le fessure insieme e avesse interferito con se stesso. Nel 1989 Akira Tonomura lo ha filmato puntino dopo puntino. Funziona anche con molecole fatte di quasi duemila atomi.", en: "Now fire electrons, one at a time. Each one lands on the screen as a single dot, just like a ball. But after thousands of dots, the striped pattern of waves appears! Every single electron behaves as if it had gone through both slits at once and interfered with itself. In 1989 Akira Tonomura filmed it happening, dot after dot. It even works with molecules made of nearly two thousand atoms." } },
    { h: { it: "Se guardi, cambia tutto", en: "If you look, everything changes" },
      p: { it: "E se mettiamo un rivelatore per scoprire da quale fessura passa ogni elettrone? Le strisce spariscono: resta solo la somma di due macchie, una per fessura, come per le palline. Basta ricavare l’informazione sul percorso perché il comportamento da onda si perda. Non è che l’elettrone «si offenda»: misurare vuol dire interagire, e l’interazione distrugge l’interferenza. Prova qui sotto ad accendere e spegnere il rivelatore.", en: "And what if we place a detector to find out which slit each electron goes through? The stripes vanish: all that is left is the sum of two patches, one per slit, as with balls. Simply obtaining information about the path is enough to lose the wave behaviour. It is not that the electron “takes offence”: measuring means interacting, and the interaction destroys the interference. Try switching the detector on and off below." } }
  ],
  try: { it: "Nell’esperimento qui sotto lascia arrivare almeno 500 elettroni con il rivelatore spento, poi ricomincia con il rivelatore acceso. Confronta i due disegni: è la stessa particella, con due comportamenti diversi.", en: "In the experiment below, let at least 500 electrons arrive with the detector off, then start again with the detector on. Compare the two patterns: same particle, two different behaviours." },
  fact: { it: "Nel 2002 i lettori della rivista Physics World hanno votato la doppia fenditura con elettroni singoli come «l’esperimento più bello di tutta la fisica».", en: "In 2002 the readers of Physics World voted the single-electron double-slit experiment “the most beautiful experiment in physics”." } },

{ id: "indeterminazione", s: "quanti",
  t: { it: "Il principio di indeterminazione", en: "The uncertainty principle" },
  k: { it: "Più sai dove si trova una particella, meno sai dove sta andando. Non è un limite degli strumenti: è come è fatto il mondo.", en: "The better you know where a particle is, the less you know where it is going. It is not a limit of our instruments: it is how the world works." },
  b: [
    { h: { it: "La regola di Heisenberg", en: "Heisenberg’s rule" },
      p: { it: "Nel 1927 il fisico tedesco Werner Heisenberg scoprì una regola sorprendente: di una particella non si possono conoscere con precisione, nello stesso momento, la posizione e la quantità di moto (cioè quanto e in che direzione si muove). Se stringi l’una, l’altra si allarga. Non dipende dal fatto che siamo maldestri: anche con strumenti perfetti sarebbe così, perché una particella non ha valori precisi di entrambe le cose.", en: "In 1927 the German physicist Werner Heisenberg discovered a surprising rule: you cannot know precisely, at the same time, both the position of a particle and its momentum (how much and in which direction it is moving). Squeeze one and the other spreads out. It is not because we are clumsy: even with perfect instruments it would be so, because a particle simply does not have precise values of both." } },
    { h: { it: "Perché gli atomi non crollano", en: "Why atoms don’t collapse" },
      p: { it: "Gli elettroni sono attratti dal nucleo: perché non ci cadono sopra? Proprio per l’indeterminazione. Se un elettrone fosse schiacciato in uno spazio piccolissimo, la sua velocità diventerebbe enormemente incerta e quindi grande: schizzerebbe via. L’equilibrio tra attrazione e questo «nervosismo» quantistico fissa la grandezza degli atomi. Senza il principio di indeterminazione la materia non esisterebbe.", en: "Electrons are attracted to the nucleus, so why don’t they fall into it? Because of uncertainty. If an electron were squeezed into a tiny space, its speed would become hugely uncertain and therefore large: it would shoot away. The balance between attraction and this quantum “restlessness” sets the size of atoms. Without the uncertainty principle, matter could not exist." } },
    { h: { it: "Niente sta mai fermo del tutto", en: "Nothing is ever completely still" },
      p: { it: "Per la stessa ragione nessuna particella può stare perfettamente ferma in un punto preciso, nemmeno alla temperatura più bassa possibile. Resta sempre un piccolo tremolio, chiamato energia di punto zero. L’elio ne è la prova: a pressione normale non diventa mai solido, nemmeno vicinissimo allo zero assoluto (−273,15 °C), perché i suoi atomi, leggeri, tremano troppo per incastrarsi in un cristallo.", en: "For the same reason, no particle can sit perfectly still at an exact point, not even at the lowest possible temperature. A tiny jitter always remains, called zero-point energy. Helium is the proof: at normal pressure it never turns solid, even extremely close to absolute zero (−273.15 °C), because its light atoms jitter too much to lock into a crystal." } }
  ],
  try: { it: "Fai passare la luce di una torcia attraverso una fessura sottilissima tra due dita, guardando un muro bianco al buio. Più stringi la fessura, più la luce si allarga invece di restringersi: è un parente stretto dell’indeterminazione.", en: "Shine a torch through a very thin gap between two fingers onto a white wall in the dark. The narrower you make the gap, the more the light spreads instead of narrowing: a close relative of uncertainty." },
  fact: { it: "Heisenberg aveva 23 anni quando trovò le idee alla base della meccanica quantistica, lavorando da solo su un’isola del Mare del Nord dove era andato per curare un attacco di febbre da fieno.", en: "Heisenberg was 23 when he found the ideas behind quantum mechanics, working alone on an island in the North Sea where he had gone to recover from hay fever." } },

{ id: "tunnel", s: "quanti", go: { v: "solar", id: "sun" },
  t: { it: "L’effetto tunnel: attraversare i muri", en: "Quantum tunnelling: going through walls" },
  k: { it: "Le particelle possono attraversare barriere che, per le regole normali, sarebbero insuperabili. E il Sole brilla proprio per questo.", en: "Particles can pass through barriers that, by ordinary rules, would be impossible to cross. And the Sun shines precisely because of it." },
  b: [
    { h: { it: "La pallina che passa la collina", en: "The ball that crosses the hill" },
      p: { it: "Se fai rotolare una pallina verso una collina senza darle abbastanza spinta, torna indietro. Sempre. Per una particella quantistica non è così. La sua nuvola di possibilità si allunga anche dentro la barriera e un pochino oltre: quindi c’è una piccola probabilità di ritrovarla dall’altra parte, come se avesse scavato una galleria. Più la barriera è sottile e bassa, più è facile.", en: "If you roll a ball towards a hill without giving it enough push, it rolls back. Always. A quantum particle is different. Its cloud of possibilities stretches into the barrier and a little beyond it, so there is a small chance of finding it on the other side, as if it had dug a tunnel. The thinner and lower the barrier, the easier it is." } },
    { h: { it: "Il segreto del Sole", en: "The secret of the Sun" },
      p: { it: "Al centro del Sole i protoni devono avvicinarsi tantissimo per fondersi e liberare energia. Ma hanno tutti carica positiva e si respingono. Anche a 15 milioni di gradi, secondo la fisica classica, quasi nessuno avrebbe abbastanza energia per superare la repulsione: il Sole sarebbe spento. Grazie all’effetto tunnel, invece, ogni tanto due protoni «passano attraverso» la barriera e si fondono. Ogni raggio di sole che senti sulla pelle nasce da questo trucco quantistico.", en: "At the centre of the Sun, protons must get extremely close in order to fuse and release energy. But they are all positively charged and repel each other. Even at 15 million degrees, classical physics says almost none would have enough energy to overcome the repulsion: the Sun would be dark. Thanks to tunnelling, though, every now and then two protons “slip through” the barrier and fuse. Every sunbeam you feel on your skin begins with this quantum trick." } },
    { h: { it: "Nel tuo telefono", en: "Inside your phone" },
      p: { it: "L’effetto tunnel lavora anche per noi. Le memorie flash di telefoni, chiavette USB e fotocamere salvano i dati spingendo elettroni attraverso uno strato isolante sottilissimo: passano proprio per tunnel. E il microscopio a effetto tunnel, inventato nel 1981, fa saltare elettroni tra una punta finissima e una superficie: misurando quanti ne passano, «vede» i singoli atomi. I suoi inventori, Gerd Binnig e Heinrich Rohrer, vinsero il Nobel nel 1986.", en: "Tunnelling works for us too. The flash memory in phones, USB sticks and cameras stores data by pushing electrons through an extremely thin insulating layer: they get there by tunnelling. And the scanning tunnelling microscope, invented in 1981, makes electrons jump between a very fine tip and a surface: by measuring how many pass, it “sees” individual atoms. Its inventors, Gerd Binnig and Heinrich Rohrer, won the Nobel Prize in 1986." } }
  ],
  try: { it: "Apri il Sole in Orbis e pensa: lì dentro, ogni secondo, circa 600 milioni di tonnellate di idrogeno diventano elio, e ogni fusione comincia con un piccolo tunnel quantistico.", en: "Open the Sun in Orbis and think: inside it, every second, about 600 million tonnes of hydrogen become helium, and every fusion begins with a tiny quantum tunnel." },
  fact: { it: "In teoria anche tu potresti attraversare un muro per effetto tunnel. La probabilità però è così piccola che non succederebbe nemmeno provando per un tempo miliardi di volte più lungo dell’età dell’universo.", en: "In theory, you too could tunnel through a wall. The probability, though, is so small that it would not happen even if you tried for billions of times the age of the universe." } },

{ id: "entanglement", s: "quanti",
  t: { it: "L’entanglement: legati a distanza", en: "Entanglement: linked at a distance" },
  k: { it: "Due particelle possono restare collegate anche ai lati opposti della Terra. Einstein lo chiamava «azione fantasma a distanza».", en: "Two particles can stay linked even on opposite sides of the Earth. Einstein called it “spooky action at a distance”." },
  b: [
    { h: { it: "Due monete magiche", en: "Two magic coins" },
      p: { it: "Immagina due monete magiche create insieme. Le lanci in due città lontane: ognuna dà testa o croce a caso, ma quando confrontate i risultati scoprite che sono sempre opposti. Due particelle «entangled», cioè intrecciate, si comportano più o meno così: le loro proprietà non sono decise finché non le misuri, ma il risultato di una è sempre legato a quello dell’altra, a qualunque distanza.", en: "Imagine two magic coins created together. You toss them in two distant cities: each lands heads or tails at random, but when you compare results you find they are always opposite. Two “entangled” particles behave roughly like this: their properties are not decided until you measure them, yet the result of one is always linked to the result of the other, at any distance." } },
    { h: { it: "Einstein non ci credeva", en: "Einstein didn’t believe it" },
      p: { it: "Einstein pensava che le monete dovessero avere già il loro risultato scritto dentro fin dall’inizio, come due guanti separati in due scatole: se apri una scatola e trovi il destro, sai che l’altro è il sinistro, senza magia. Nel 1964 John Bell trovò un modo per distinguere le due idee con un esperimento. Gli esperimenti di Alain Aspect, John Clauser e Anton Zeilinger hanno dato torto a Einstein, e nel 2022 i tre hanno vinto il Nobel.", en: "Einstein thought the coins must have their results written inside from the start, like a pair of gloves split into two boxes: open one, find the right glove, and you know the other is the left, no magic involved. In 1964 John Bell found a way to tell the two ideas apart with an experiment. Experiments by Alain Aspect, John Clauser and Anton Zeilinger proved Einstein wrong, and in 2022 the three won the Nobel Prize." } },
    { h: { it: "Ma non si possono mandare messaggi", en: "But you can’t send messages" },
      p: { it: "Si potrebbe usare l’entanglement per comunicare più veloci della luce? No. Ogni persona vede solo risultati a caso; il legame si scopre solo confrontandoli dopo, con un mezzo normale come una telefonata. Però l’entanglement serve: permette chiavi segrete impossibili da intercettare senza farsi scoprire. Nel 2017 il satellite cinese Micius ha distribuito coppie di fotoni intrecciati a stazioni distanti oltre 1.200 chilometri.", en: "Could entanglement be used to communicate faster than light? No. Each person only sees random results; the link shows up only when you compare them afterwards, by ordinary means such as a phone call. Entanglement is still useful: it allows secret keys that cannot be intercepted without being noticed. In 2017 the Chinese satellite Micius delivered pairs of entangled photons to stations more than 1,200 kilometres apart." } }
  ],
  try: { it: "Gioca con un amico: mettete un calzino rosso e uno blu in due sacchetti senza guardare, prendetene uno a testa e allontanatevi. Quando guardi il tuo, sai subito il colore dell’altro. Questo è il caso «dei guanti» di Einstein: l’entanglement vero è più strano, perché il colore non sarebbe deciso prima.", en: "Play with a friend: put a red sock and a blue sock into two bags without looking, take one each and walk apart. When you look at yours, you instantly know the other’s colour. That is Einstein’s “gloves” case: real entanglement is stranger, because the colour would not be decided beforehand." },
  fact: { it: "I computer quantistici usano proprio l’entanglement: i loro «qubit» intrecciati possono esplorare molte possibilità insieme. Sono ancora piccoli e delicati, e funzionano raffreddati a pochi millesimi di grado sopra lo zero assoluto.", en: "Quantum computers rely on entanglement: their entangled “qubits” can explore many possibilities together. They are still small and fragile, and they work cooled to a few thousandths of a degree above absolute zero." } },

{ id: "neutrini", s: "quanti", go: { v: "dive", id: "antarctica" },
  t: { it: "I neutrini, le particelle fantasma", en: "Neutrinos, the ghost particles" },
  k: { it: "In questo momento miliardi di neutrini ti stanno attraversando. Non te ne accorgi, e loro nemmeno.", en: "Right now, billions of neutrinos are passing through you. You don’t notice them, and they don’t notice you." },
  b: [
    { h: { it: "Una particella inventata per disperazione", en: "A particle invented in desperation" },
      p: { it: "Nel 1930 i fisici avevano un problema: in alcuni decadimenti radioattivi sembrava sparire un po’ di energia. Wolfgang Pauli propose una soluzione «disperata»: una particella invisibile, senza carica e quasi senza massa, che si portava via l’energia mancante. Ci vollero 26 anni per trovarla: nel 1956 Clyde Cowan e Frederick Reines rivelarono i neutrini accanto a un reattore nucleare.", en: "In 1930 physicists had a problem: in some radioactive decays, a little energy seemed to vanish. Wolfgang Pauli proposed a “desperate” solution: an invisible particle, with no charge and almost no mass, carrying away the missing energy. It took 26 years to find it: in 1956 Clyde Cowan and Frederick Reines detected neutrinos next to a nuclear reactor." } },
    { h: { it: "Attraversano anche la Terra", en: "They go straight through the Earth" },
      p: { it: "Il Sole ne produce quantità enormi: ogni secondo, su ogni centimetro quadrato del tuo corpo passano circa 60 miliardi di neutrini solari. Di notte arrivano dal basso, dopo aver attraversato tutta la Terra, come se non ci fosse. I neutrini interagiscono così poco che per fermarne la metà servirebbe un muro di piombo spesso anni-luce.", en: "The Sun makes enormous numbers of them: every second, about 60 billion solar neutrinos pass through every square centimetre of your body. At night they come from below, having crossed the entire Earth as if it weren’t there. Neutrinos interact so weakly that stopping half of them would take a wall of lead light-years thick." } },
    { h: { it: "Come si catturano i fantasmi", en: "How to catch a ghost" },
      p: { it: "Per vederli servono rivelatori giganteschi, sepolti sotto terra per schermare il resto. Il Super-Kamiokande in Giappone è una vasca con 50.000 tonnellate di acqua purissima. IceCube, al Polo Sud, usa un chilometro cubo di ghiaccio antartico come rivelatore: quando, raramente, un neutrino urta un atomo, nasce un lampo di luce blu che i sensori registrano. Studiandoli si è scoperto che i neutrini cambiano tipo mentre viaggiano: Nobel 2015.", en: "Seeing them takes gigantic detectors, buried underground to shield out everything else. Super-Kamiokande in Japan is a tank holding 50,000 tonnes of ultra-pure water. IceCube, at the South Pole, uses a cubic kilometre of Antarctic ice as its detector: when, rarely, a neutrino hits an atom, a flash of blue light is born and the sensors record it. Studying them revealed that neutrinos change type as they travel: Nobel Prize 2015." } }
  ],
  try: { it: "Metti la mano aperta davanti a te e conta fino a uno: in quel secondo l’hanno attraversata circa diecimila miliardi di neutrini. Prova a fare il calcolo tu: 60 miliardi per centimetro quadrato, e la tua mano ne misura circa 150.", en: "Hold your open hand in front of you and count to one: in that second about ten trillion neutrinos passed through it. Try the sum yourself: 60 billion per square centimetre, and your hand is about 150 square centimetres." },
  fact: { it: "Il 23 febbraio 1987 una stella è esplosa in una galassia vicina, la Grande Nube di Magellano. Tre rivelatori sulla Terra hanno catturato in tutto 25 dei suoi neutrini, arrivati qualche ora prima della luce dell’esplosione.", en: "On 23 February 1987 a star exploded in a nearby galaxy, the Large Magellanic Cloud. Three detectors on Earth caught a total of 25 of its neutrinos, which arrived a few hours before the light of the explosion." } },

{ id: "radioattivita", s: "quanti", w: "halflife",
  t: { it: "Radioattività e tempo di dimezzamento", en: "Radioactivity and half-life" },
  k: { it: "Nessuno sa quando un singolo atomo si spezzerà. Eppure, tutti insieme, seguono un orologio precisissimo.", en: "Nobody knows when a single atom will break apart. Yet together they follow an extremely precise clock." },
  b: [
    { h: { it: "Atomi che cambiano", en: "Atoms that change" },
      p: { it: "Alcuni nuclei atomici sono instabili: prima o poi si trasformano da soli, sparando via una particella o un lampo di energia. È la radioattività. Nel 1896 Henri Becquerel scoprì che l’uranio anneriva le lastre fotografiche anche al buio, e Marie Curie studiò il fenomeno a fondo, scoprendo il polonio e il radio. È stata la prima persona a vincere due premi Nobel, in fisica nel 1903 e in chimica nel 1911.", en: "Some atomic nuclei are unstable: sooner or later they change on their own, firing off a particle or a burst of energy. This is radioactivity. In 1896 Henri Becquerel discovered that uranium darkened photographic plates even in the dark, and Marie Curie studied the phenomenon in depth, discovering polonium and radium. She was the first person to win two Nobel Prizes, in physics in 1903 and in chemistry in 1911." } },
    { h: { it: "Il caso e l’orologio", en: "Chance and the clock" },
      p: { it: "Un singolo atomo radioattivo può spezzarsi tra un secondo o tra mille anni: è puro caso. Ma se ne hai tantissimi, succede una cosa bellissima. Dopo un certo tempo, sempre lo stesso, ne sarà cambiata esattamente metà. Dopo un altro uguale tempo, metà dei rimanenti, e così via. Questo tempo si chiama tempo di dimezzamento: per alcuni atomi è una frazione di secondo, per altri miliardi di anni. Prova a vederlo nell’esperimento qui sotto.", en: "A single radioactive atom may break apart in a second or in a thousand years: pure chance. But when you have huge numbers of them, something beautiful happens. After a certain time, always the same, exactly half will have changed. After another equal stretch, half of those left, and so on. This time is called the half-life: for some atoms it is a fraction of a second, for others billions of years. See it happen in the experiment below." } },
    { h: { it: "L’orologio dei fossili", en: "The clock of fossils" },
