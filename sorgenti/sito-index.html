<title>Orbis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed 3D stage; instrument-like glass panels float at its edges; each descent is one long vertical documentary strip read past a fixed depth gauge. */
:root{
  --void:#05070c;
  --ink:#eef1f6;
  --mist:#a3acbd;
  --hair:rgba(238,241,246,.15);
  --glass:rgba(7,11,19,.82);
  --glass-solid:#0b111d;
  --sol:#f1b766;
  --bio:#66e2d8;
  --leaf:#bfe08f;
  --accent:var(--sol);
  --display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
  --bar-h:78px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* ---------- stage ---------- */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--void)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:none;text-shadow:0 0 6px #000,0 0 2px #000;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.82;white-space:nowrap;padding:4px 8px;border-radius:999px;transition:opacity .2s,background .2s;will-change:transform}
.lbl:hover,.lbl:focus-visible{opacity:1;background:rgba(5,7,12,.6)}
.lbl.dim{opacity:.45}
.lbl.hot{display:flex;align-items:center;gap:8px;background:rgba(5,7,12,.55);border:1px solid var(--hair);opacity:.95}
.lbl.hot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.lbl.soon{font-size:.64rem;opacity:.5;background:none;border:0}
.lbl.ring{opacity:.42;font-size:.62rem;pointer-events:none}

/* ---------- top bar ---------- */
.bar{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:14px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,rgba(5,7,12,.92),rgba(5,7,12,0))}
.brand{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.65rem;line-height:1;letter-spacing:.01em;flex:none}
.brand b{font-weight:500;color:var(--accent);font-style:normal}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:7px 14px;border-radius:999px;font-size:.88rem;color:var(--mist);border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
.nav button:hover{color:var(--ink);border-color:var(--hair)}
.nav button[aria-current="page"]{color:var(--void);background:var(--ink)}
.lang{flex:none;display:flex;border:1px solid var(--hair);border-radius:999px;padding:2px}
.lang button{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:5px 9px;border-radius:999px;color:var(--mist)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--void)}

/* ---------- hint & corner ---------- */
.hint{position:fixed;z-index:10;pointer-events:none;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 32px));text-align:center;font-size:.9rem;color:var(--mist);background:rgba(5,7,12,.6);border:1px solid var(--hair);border-radius:999px;padding:8px 16px;backdrop-filter:blur(8px);transition:opacity .3s}
.hint.faded{opacity:0!important;pointer-events:none}
.corner{position:fixed;z-index:10;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.corner button{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);padding:6px 10px;border-radius:999px;border:1px solid var(--hair);background:rgba(5,7,12,.5)}
.corner button:hover{color:var(--ink)}
.count-badge{position:fixed;z-index:10;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--mist)}

/* ---------- info panel ---------- */
.panel{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--bar-h) + env(safe-area-inset-top,0px));max-height:calc(100% - 100px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));overflow-y:auto;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hair);border-radius:var(--r);padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.panel > *{flex-shrink:0}
.panel .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);font-size:1.1rem;line-height:1;color:var(--mist)}
.panel .x:hover{color:var(--ink)}
.kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-right:40px}
.panel h2{font-family:var(--display);font-weight:500;font-size:2.3rem;line-height:1.05;padding-right:30px}
.sci{font-family:var(--display);font-style:italic;color:var(--mist);font-size:1.02rem;margin-top:-6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin:0}
.stats div{background:var(--glass-solid);padding:10px 12px;min-width:0}
.stats div:last-child:nth-child(odd){grid-column:1/-1}
.stats dt{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.stats dd{margin:2px 0 0;font-size:.95rem;font-variant-numeric:tabular-nums}
.panel .body{color:#d6dbe5}
.fact{border-left:2px solid var(--accent);padding:2px 0 2px 14px;color:#d6dbe5;font-size:.95rem}
.fact strong{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:2px}
.note{font-size:.8rem;color:var(--mist);font-style:italic}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--void);font-weight:700;font-size:.95rem;transition:transform .15s}
.cta:hover{transform:translateX(3px)}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--hair);font-weight:400}
/* collapsed panel: the text hides, the view stays where it is */
.pbar{display:none}
.panel.collapsed{animation:none;padding:8px;gap:0;width:auto;max-width:min(460px,calc(100vw - 32px));overflow:visible}
.panel.collapsed > *:not(.pbar){display:none}
.panel.collapsed .pbar{display:flex;align-items:center;gap:8px}
.pbar .nm{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:2px 8px;min-width:0;flex:1}
.pbar .nm .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .nm b{font-family:var(--display);font-weight:500;font-size:1.2rem;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .info{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:.86rem;color:var(--ink);white-space:nowrap;flex:none}
.pbar .info::before{content:"i";display:grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-family:var(--display);font-style:italic;font-weight:700;font-size:.78rem;line-height:1}
.pbar .home{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);color:var(--mist);flex:none}
.pbar .home:hover,.pbar .info:hover{color:var(--ink);border-color:var(--ink)}
.pbar .home svg{width:18px;height:18px}

/* ---------- photos & lightbox ---------- */
.photo{display:block;width:100%;padding:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;position:relative;background:#000;cursor:zoom-in}
.photo img{display:block;width:100%;height:190px;object-fit:cover}
.photo .ph-zoom{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(5,7,12,.7);border:1px solid var(--hair);border-radius:999px;padding:4px 9px;color:var(--ink)}
.ph-cap{font-size:.82rem;color:var(--mist);margin-top:-6px}
.ph-cap span{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.04em;margin-top:3px;opacity:.85}
.lightbox{position:fixed;inset:0;z-index:78;background:rgba(2,3,6,.96);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lightbox .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid var(--hair);background:rgba(5,7,12,.7);font-size:1.3rem;color:var(--ink)}
.lb-scroll{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:56px 12px 8px}
.lb-scroll img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;display:block}
.lightbox.zoom .lb-scroll{display:block;place-items:initial}
.lightbox.zoom .lb-scroll img{max-width:none;max-height:none;width:auto;height:auto;cursor:zoom-out;margin:0 auto}
.lb-cap{padding:10px max(16px,env(safe-area-inset-left,0px)) 16px;color:var(--mist);font-size:.85rem;text-align:center;max-width:70ch;margin:0 auto}

/* ---------- daily curiosities ---------- */
.cur-chip{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(5,7,12,.72);border:1px solid color-mix(in srgb,var(--sol) 55%,transparent);color:var(--ink);font-size:.86rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cur-chip::before{content:"✦";color:var(--sol);font-size:.95rem}
.cur-chip:hover{border-color:var(--sol)}
.recenter{position:fixed;z-index:12;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--bar-h) + 10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(5,7,12,.72);border:1px solid var(--hair);color:var(--ink);font-size:.86rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:rise .3s ease-out}
.recenter:hover{border-color:var(--ink)}
.recenter svg{width:17px;height:17px;flex:none}
.cur{position:fixed;inset:0;z-index:72;background:rgba(2,3,6,.72);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cur-card{position:relative;width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--glass-solid);border:1px solid var(--hair);border-radius:20px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .35s ease-out}
.cur-card > *{flex-shrink:0}
.cur-card .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);font-size:1.15rem;color:var(--mist)}
.cur-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.cur-card h2{font-family:var(--display);font-weight:500;font-size:2.4rem;line-height:1;margin-top:-6px}
.cur-item{border-top:1px solid var(--hair);padding-top:16px;display:flex;flex-direction:column;gap:9px}
.cur-k{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
.cur-item.space .cur-k{color:var(--sol)}
.cur-item.earth .cur-k{color:var(--bio)}
.cur-item h3{font-family:var(--display);font-weight:500;font-size:1.5rem;line-height:1.12}
.cur-item p:not(.cur-k){color:#d6dbe5}
.cur-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.cur-row .cta{padding:9px 15px;font-size:.88rem}
.cur-item.earth .cta:not(.ghost){background:var(--bio)}

/* ---------- exoplanet list ---------- */
.exo-ui{position:fixed;z-index:14;left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--bar-h) + env(safe-area-inset-top,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hair);border-radius:var(--r);padding:16px}
.exo-ui h2{font-family:var(--display);font-weight:500;font-size:1.5rem}
.exo-ui .tally{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--mist);line-height:1.5}
.exo-ui .tally b{color:var(--accent);font-weight:500;font-size:.95rem}
.search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:.95rem}
.search::placeholder{color:var(--mist)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;padding:5px 10px;border-radius:999px;border:1px solid var(--hair);color:var(--mist)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.exo-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.exo-list button{width:100%;text-align:left;padding:9px 10px;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.exo-list button:hover{background:rgba(255,255,255,.05)}
.exo-list button[aria-current="true"]{background:rgba(241,183,102,.12)}
.exo-list .n{font-weight:700;font-size:.95rem}
.exo-list .d{font-family:var(--mono);font-size:.7rem;color:var(--mist);text-align:right;font-variant-numeric:tabular-nums}
.exo-list .tg{grid-column:1/-1;font-size:.72rem;color:var(--mist)}
.exo-list .empty{color:var(--mist);font-size:.9rem;padding:10px}

/* ---------- loading & veil ---------- */
.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--void);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.loading .in{display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 24px;text-align:center}
.loading .logo{font-family:var(--display);font-style:italic;font-size:3.4rem;line-height:1}
.loading .msg{color:var(--mist);font-size:.9rem}
.loading .track{width:220px;height:2px;background:var(--hair);border-radius:2px;overflow:hidden}
.loading .fill{height:100%;width:0;background:var(--accent);transition:width .3s}
.veil{position:fixed;inset:0;z-index:50;background:var(--void);opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1}
.toast{position:fixed;z-index:70;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(460px,calc(100vw - 32px));background:var(--glass-solid);border:1px solid var(--hair);border-radius:12px;padding:12px 16px;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- descent ---------- */
.dive{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;background:#1d76a8;--accent:var(--bio);scroll-behavior:auto;overscroll-behavior:contain}
.dive.amazon{--accent:var(--leaf);background:#9fd0ea}
#motes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.dive-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(3,6,12,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.dive-top .back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(3,6,12,.6);border:1px solid var(--hair);font-size:.9rem}
.dive-top .sound{margin-left:auto;flex:none;width:38px;height:38px;display:inline-grid;place-items:center;border-radius:999px;background:rgba(3,6,12,.6);border:1px solid var(--hair);color:var(--ink)}
.dive-top .sound[aria-pressed="false"]{opacity:.65}
.dive-top .sound svg{width:20px;height:20px}
.dive-top .where{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(150px,calc(env(safe-area-inset-right,0px) + 150px));padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.intro{min-height:62vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:40px}
.intro .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.intro h1{font-family:var(--display);font-weight:500;font-size:clamp(2.8rem,8vw,5.6rem);line-height:.95;letter-spacing:-.01em}
.intro h1 em{font-style:italic;font-weight:400}
.intro p{max-width:56ch;font-size:1.05rem;opacity:.92}
.intro .scrollcue{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;opacity:.8}
.intro .scrollcue::after{content:"";width:1px;height:40px;background:currentColor;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}
.dive.amazon .intro{color:#0b1a12}
.dive.madagascar{--accent:#f4b26a;background:#b9dfe4}
.dive.madagascar .intro{color:#10221a}
.dive.himalaya{--accent:#cfe3ff;background:#0d2a4a}
.dive.tianshan{--accent:#d8e9b8;background:#1b2f4f}
.dive.andes{--accent:#f0c987;background:#22324f}
.dive.newzealand{--accent:#a6e6b8;background:#2b4d6e}
.dive.tundra{--accent:#9fd3ff;background:#9db6cc}
.dive.tundra .intro{color:#0f1f2b}
.dive.antarctica{--accent:#9fd3ff;background:#7fa6c8}
.dive.antarctica .intro{color:#0b1a28}
.dive.sahara{--accent:#ffc982;background:#f2c98a}
.dive.sahara .intro{color:#2a1608}
.dive.reef{--accent:#7fe3d6;background:#7fc0e6}
.dive.reef .intro{color:#06222e}
.dive.ghats{--accent:#cdb6ff;background:#3f6584}
.zone-head{display:grid;gap:8px;padding:22px 0 18px;border-top:1px solid rgba(255,255,255,.28);max-width:62ch}
.zone-head .range{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
.zone-head h2{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,3.2rem);line-height:1}
.zone-head p{opacity:.9}
.zone-head .pill{display:inline-block;background:rgba(3,6,12,.55);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;color:var(--ink);opacity:.85;padding:6px 0}

        text: { it: "Un mollusco con otto placche sulla schiena, come un’armatura, che vive sui pezzi di legno caduti fino al fondo dell’oceano. Per raschiare il legno usa una ‘lingua’ coperta di dentini rinforzati con il ferro. È stato trovato nel 2024 vicino al Giappone.", en: "A mollusc with eight overlapping plates on its back, like armour, living on pieces of wood that have sunk to the bottom of the ocean. To scrape the wood it uses a ‘tongue’ covered in tiny teeth reinforced with iron. It was found in 2024 near Japan." },

        prompt: "Photorealistic macro photograph of a blue dragon sea slug (Glaucus atlanticus) floating upside down just under the ocean surface: a small slender body about 3 cm long, vivid electric-blue and deep-blue stripes on its upper side, silvery-white underside, three pairs of short arm-like lobes each ending in a fan of finger-like blue and white cerata, a pointed tail, seen from slightly below with sunlight rippling through the surface above.", style: "surface" },

        text: { it: "Un minuscolo crostaceo, più piccolo di un chicco di riso. Il corpo del maschio è fatto di strati di cristalli sottilissimi che riflettono la luce in colori brillanti, dal blu al violetto all’oro.", en: "A tiny crustacean, smaller than a grain of rice. The male’s body is built from layers of ultra-thin crystals that reflect light in brilliant colours, from blue to violet to gold." },
        fact: { it: "Basta che cambi leggermente angolazione e diventa trasparente, come se svanisse nel nulla. Per questo lo chiamano zaffiro di mare.", en: "If it turns just slightly it becomes transparent, as if vanishing into thin air. That’s why it is called the sea sapphire." },
        prompt: "Photorealistic macro photograph of a male sea sapphire copepod (Sapphirina): a tiny flat, oval, leaf-shaped crustacean only a few millimetres long, its body shimmering with intense iridescent structural colours (sapphire blue, violet and gold) like a jewel, short antennae, drifting in deep blue open ocean water, dark blue background.", style: "surface" },

        text: { it: "Ha la testa trasparente come una cupola di vetro, piena di liquido. Quelle che sembrano occhi sul muso sono in realtà le narici: i veri occhi sono le due sfere verdi dentro la testa, e guardano verso l’alto per cercare le sagome delle prede.", en: "Its head is transparent like a glass dome, filled with fluid. What look like eyes on its snout are actually nostrils: the real eyes are the two green globes inside its head, gazing upwards for the silhouettes of prey." },
        fact: { it: "Fino al 2009 nessuno sapeva della testa trasparente, perché gli esemplari portati in superficie la perdevano. Solo filmandolo vivo con un robot sottomarino si è scoperto che i suoi occhi possono anche ruotare in avanti.", en: "Until 2009 nobody knew about the transparent head, because specimens brought to the surface lost it. Only by filming a live one with an underwater robot did scientists learn its eyes can also swivel forward." },

        fact: { it: "Nonostante il nome non succhia sangue: si nutre di neve marina, i fiocchi di resti che cadono dall’alto. Se si spaventa si rovescia il mantello sopra il corpo come un ombrello e libera una nuvola di muco luminoso.", en: "Despite its name it drinks no blood: it eats marine snow, the flakes of debris drifting down from above. When frightened it pulls its cloak over its body like an umbrella and releases a cloud of glowing mucus." },
        prompt: "Photorealistic deep-sea photograph of a vampire squid (Vampyroteuthis infernalis), about 25 cm long, deep reddish-black velvety skin, very large round eyes reflecting blue, a pair of ear-like fins on top of its mantle, eight arms connected by a dark webbed cloak lined with soft fleshy spines, small glowing blue photophores, gliding slowly.", style: "ocean" },

        text: { it: "Sta immobile sul fondo come su un treppiede, appoggiato a tre lunghe spine delle pinne che possono superare il metro. Rivolto contro corrente, aspetta che i piccoli crostacei gli arrivino davanti alla bocca.", en: "It stands still on the seabed as if on a tripod, propped on three long fin spines that can exceed a metre. Facing into the current, it waits for small crustaceans to drift up to its mouth." },

        fact: { it: "Polpi simili, nel Pacifico, sono stati visti covare le uova su spugne attaccate a noduli di metallo sul fondale: gli stessi noduli che alcune aziende vorrebbero estrarre.", en: "Similar octopuses in the Pacific have been seen brooding eggs on sponges attached to metal nodules on the seabed: the same nodules some companies want to mine." },
        prompt: "Photorealistic deep-sea photograph of a small ghost octopus nicknamed Casper (an undescribed finless incirrate octopod found near Hawaii in 2016): a soft, nearly translucent milky-white body with no pigment, rounded head, two small dark eyes, short arms with a single row of suckers, no fins, sitting on a flat dark rock on the abyssal seafloor.", style: "ocean" },

      { id: "snailfish", d: 7500, h: 340, name: { it: "Pesce lumaca delle Marianne", en: "Mariana snailfish" }, sci: "Pseudoliparis swirei",
        range: { it: "6.200–8.200 m", en: "6,200–8,200 m" }, size: { it: "fino a circa 23 cm", en: "up to about 23 cm" },
        text: { it: "Uno dei pesci che vivono più in profondità sulla Terra. Ha il corpo morbido, rosato e quasi trasparente, senza squame: a quelle pressioni un corpo gelatinoso funziona meglio di uno rigido.", en: "One of the deepest-living fish on Earth. Its body is soft, pinkish and almost see-through, with no scales: at those pressures a jelly-like body works better than a stiff one." },
        fact: { it: "Sotto gli 8.200 metri non è mai stato visto, e gli scienziati pensano che poco più in basso ci sia il limite oltre il quale nessun pesce può vivere. Le sue ossa hanno ispirato un robot capace di scendere negli abissi.", en: "It has never been seen below 8,200 metres, and scientists think the limit beyond which no fish can live lies just a little deeper. Its bones inspired a robot able to dive into the abyss." },
        prompt: "Photorealistic deep-sea photograph of a Mariana snailfish (Pseudoliparis swirei), about 20 cm long, tadpole-shaped soft gelatinous body, translucent pale pink-white skin through which faint internal organs are visible, no scales, broad rounded head, small dark eyes, long tapering tail with continuous fins, swimming among small white amphipods above the sediment of a deep ocean trench.", style: "ocean" },
      { id: "xeno", d: 10641, h: 35, name: { it: "Xenofioforo", en: "Xenophyophore" }, sci: "Xenophyophorea",
        range: { it: "fino a 10.641 m", en: "down to 10,641 m" }, size: { it: "fino a circa 20 cm", en: "up to about 20 cm" },
        text: { it: "Sembra una spugna o una pallina di sabbia fragile, ma è un essere vivente fatto di una sola cellula. Una cellula grande quanto un pugno, che si costruisce un guscio incollando granelli e detriti.", en: "It looks like a sponge or a crumbly ball of sand, but it is a living thing made of a single cell. One cell as big as a fist, building itself a shell by gluing together grains and debris." },
        fact: { it: "Nel 2011 ne sono stati trovati a 10.641 metri, nella Fossa delle Marianne. Sono tra le cellule più grandi che esistano, e sul fondale fanno da casa a tanti piccoli animali.", en: "In 2011 some were found 10,641 metres down in the Mariana Trench. They are among the biggest cells there are, and on the seabed they give a home to many small animals." },
        prompt: "Photorealistic deep-sea photograph of a xenophyophore, a giant single-celled organism about 10 cm across resting on the trench floor: a fragile, lumpy, sponge-like mass with a honeycomb surface of cemented sediment grains, mud and tiny shell fragments, pale tan-grey colour.", style: "ocean" },
      { id: "hirondellea", d: 10850, h: 20, name: { it: "Anfipode del fondo", en: "Trench amphipod" }, sci: "Hirondellea gigas",
        range: { it: "6.000–10.900 m", en: "6,000–10,900 m" }, size: { it: "pochi centimetri", en: "a few centimetres" },
        text: { it: "Un crostaceo simile a un gamberetto che vive fin sul fondo del punto più profondo dell’oceano, il Challenger Deep. Lì arriva poco cibo, e quel poco è spesso legno e resti di piante caduti dalla superficie.", en: "A shrimp-like crustacean that lives right at the bottom of the deepest point in the ocean, the Challenger Deep. Little food reaches it, and much of that is wood and plant debris sinking from the surface." },
        fact: { it: "Nell’intestino ha enzimi speciali capaci di trasformare il legno in zucchero. Gli scienziati li studiano anche per produrre biocarburanti.", en: "Its gut holds special enzymes that turn wood into sugar. Scientists study them for making biofuels too." },
        prompt: "Photorealistic deep-sea macro photograph of Hirondellea gigas, a hadal amphipod a few centimetres long: a curved, laterally flattened, shrimp-like segmented body, semi-translucent milky white to pale pink, many small legs, short antennae, several of them swarming over the soft sediment at the very bottom of the Mariana Trench.", style: "ocean" }
    ]
  },
  amazon: {
    scene: [{ fx: "clouds", from: -95, to: -58, fade: 6 }, { fx: "leaves", from: -80, to: -2, fade: 6, dark: 1 }, { fx: "trunks", from: -45, to: -0.5, fade: 5 }, { fx: "soil", from: 0, to: 9, fade: 0.4, key: "amazon", base: "#3a2716", light: "#7a5a38", dark: "#1a1008", a: 0.7 }],
    unit: "m", start: -90, end: 8, px: 7, minGap: 70, maxGap: 560,
    where: { it: "Amazzonia · Brasile", en: "Amazon rainforest · Brazil" },
    eyebrow: { it: "Foresta amazzonica", en: "Amazon rainforest" },
    title: { it: "Dentro <em>l’Amazzonia</em>", en: "Inside <em>the Amazon</em>" },
    lead: { it: "Dalla cima degli alberi più alti fin sotto terra. Più scendi, più le creature si fanno piccole e la luce scarsa. Lo strumento mostra l’altezza e quanta luce del sole arriva.", en: "From the tops of the tallest trees down beneath the ground. The lower you go, the smaller the creatures and the dimmer the light. The gauge shows height and how much sunlight gets through." },
    cue: { it: "Scorri per scendere", en: "Scroll to descend" },
    note: { it: "Queste creature vivono in zone diverse dell’Amazzonia: qui le trovi all’altezza in cui si incontrano.", en: "These creatures live in different parts of the Amazon: here you meet them at the height where they are found." },
    stops: [[-90, "#a8d6ee"], [-62, "#86c3a2"], [-42, "#4a9459"], [-28, "#2b6a3f"], [-14, "#1a4a2c"], [-3, "#11301e"], [0, "#2e2014"], [3, "#22170d"], [8, "#120b06"]],
    zones: [
      { from: -90, to: -40, name: { it: "Strato emergente", en: "Emergent layer" }, range: { it: "oltre 40 m", en: "above 40 m" }, text: { it: "Le chiome dei giganti che bucano il tetto della foresta. Sole pieno e vento forte: è il regno dei grandi rapaci.", en: "The crowns of the giants that break through the forest roof. Full sun and strong wind: the realm of the great birds of prey." } },
      { from: -40, to: -20, name: { it: "La volta", en: "The canopy" }, range: { it: "20–40 m", en: "20–40 m" }, text: { it: "Un tetto quasi continuo di foglie. Qui vive gran parte degli animali della foresta, e molti non scendono mai a terra.", en: "A nearly unbroken roof of leaves. Most of the forest’s animals live here, and many never come down to the ground." } },
      { from: -20, to: -3, name: { it: "Il sottobosco", en: "The understory" }, range: { it: "3–20 m", en: "3–20 m" }, text: { it: "Ombra, umidità e alberi giovani che aspettano un varco di luce. Le foglie sono grandi, per catturare il poco sole che arriva.", en: "Shade, damp, and young trees waiting for a gap to open in the light. Leaves are large to catch what little sun gets through." } },
      { from: -3, to: 0, name: { it: "Il suolo della foresta", en: "The forest floor" }, range: { it: "0–3 m", en: "0–3 m" }, text: { it: "Qui arriva solo circa il 2% della luce del sole. Foglie e legno morto si decompongono in fretta, grazie a funghi, insetti e batteri.", en: "Only about 2% of the sunlight reaches down here. Fallen leaves and dead wood break down fast, thanks to fungi, insects and bacteria." } },
      { from: 0, to: 8, name: { it: "Sotto terra", en: "Underground" }, range: { it: "sotto il suolo", en: "below the surface" }, text: { it: "Gallerie, radici, funghi e animali che quasi nessuno vede mai.", en: "Tunnels, roots, fungi and animals that almost nobody ever sees." } }
    ],
    marks: [
      { d: -88.5, text: { it: "88,5 m: l’albero più alto mai trovato in Amazzonia, un angelim vermelho (Dinizia excelsa), scoperto nel 2019", en: "88.5 m: the tallest tree ever found in the Amazon, a red angelim (Dinizia excelsa), discovered in 2019" } },
      { d: -30, text: { it: "Un palazzo di dieci piani è alto circa 30 metri", en: "A ten-storey building is about 30 metres tall" } }
    ],
    endTitle: { it: "Le radici della foresta", en: "The roots of the forest" },
    endText: { it: "Il suolo amazzonico è sottile e povero: quasi tutto il nutrimento sta negli esseri viventi e nelle foglie che cadono, e viene riciclato in fretta da funghi, insetti e radici.", en: "Amazon soil is thin and poor: almost all the nourishment is held in living things and fallen leaves, and it is recycled quickly by fungi, insects and roots." },
    creatures: [
      { id: "harpy", d: -50, h: 210, name: { it: "Aquila arpia", en: "Harpy eagle" }, sci: "Harpia harpyja",
        range: { it: "strato emergente", en: "emergent layer" }, size: { it: "apertura alare circa 2 m", en: "wingspan about 2 m" },
        text: { it: "Una delle aquile più potenti al mondo. Vola agile tra i rami e caccia bradipi e scimmie direttamente sugli alberi. Ha una doppia cresta di piume grigie che solleva quando è in allerta.", en: "One of the most powerful eagles in the world. It flies nimbly between branches and hunts sloths and monkeys right in the trees. It has a double crest of grey feathers that it raises when alert." },
        fact: { it: "I suoi artigli posteriori possono arrivare a circa 13 cm, più lunghi di quelli di un orso grizzly.", en: "Its rear talons can reach about 13 cm, longer than a grizzly bear’s claws." },
        prompt: "Photorealistic wildlife photograph of a harpy eagle (Harpia harpyja) perched on a high branch of a giant emergent rainforest tree above the Amazon canopy: slate-grey upper body, white chest with a black band across the upper breast, pale grey head with a double crest of feathers raised, black-barred white legs, massive yellow feet with huge black talons, piercing dark eyes, morning mist over the forest below.", style: "forest" },
      { id: "kinkajou", d: -34, h: 30, name: { it: "Kinkajou", en: "Kinkajou" }, sci: "Potos flavus",
        range: { it: "la volta, di notte", en: "the canopy, at night" }, size: { it: "40–60 cm, più la coda", en: "40–60 cm, plus the tail" },
        text: { it: "Sembra una scimmia ma è parente del procione. Di giorno dorme nei tronchi cavi, di notte si muove tra i rami usando la coda come una quinta mano.", en: "It looks like a monkey but is related to the raccoon. By day it sleeps in hollow trunks; by night it moves through the branches using its tail as a fifth hand." },
        fact: { it: "Ha una lingua lunghissima e sottile, circa 13 cm, con cui lecca il nettare dai fiori. Passando da un fiore all’altro li impollina, come fanno le api.", en: "Its tongue is very long and thin, about 13 cm, for licking nectar from flowers. Moving from flower to flower it pollinates them, as bees do." },
        prompt: "Photorealistic night wildlife photograph of a kinkajou (Potos flavus) in the rainforest canopy: golden-brown woolly fur, round head with large dark eyes and small rounded ears, short muzzle, long prehensile tail wrapped around a branch, reaching toward a flower with its long slender tongue, softly lit.", style: "forest" },
      { id: "uakari", d: -28, h: 5, name: { it: "Uakari calvo", en: "Bald uakari" }, sci: "Cacajao calvus",
        range: { it: "la volta, nelle foreste allagate", en: "the canopy, in flooded forest" }, size: { it: "circa 45 cm, coda corta", en: "about 45 cm, short tail" },
        text: { it: "Una scimmia con il viso senza peli e rosso acceso, e un mantello di pelo lungo e chiaro. Vive nelle foreste amazzoniche che restano allagate per mesi, e scende raramente a terra.", en: "A monkey with a bare, bright-red face and a cloak of long pale fur. It lives in Amazon forests that stay flooded for months, and seldom comes down to the ground." },
        fact: { it: "Il rosso del viso dipende dai vasi sanguigni sotto la pelle: più è acceso, più la scimmia è in salute. Un viso pallido può essere segno di malattia.", en: "The red of its face comes from blood vessels under the skin: the brighter it is, the healthier the monkey. A pale face can be a sign of illness." },
        prompt: "Photorealistic wildlife photograph of a bald uakari monkey (Cacajao calvus) sitting on a branch in a flooded Amazon forest: a completely hairless bright crimson-red face and scalp, small amber eyes, long shaggy pale whitish-ginger fur, short stubby tail, flooded forest and dark water in the background.", style: "forest" },
      { id: "slothmoth", d: -23, h: 85, name: { it: "Falena del bradipo", en: "Sloth moth" }, sci: "Cryptoses choloepi",
        range: { it: "nella pelliccia dei bradipi", en: "in sloth fur" }, size: { it: "piccola", en: "small" },
        text: { it: "Una piccola falena che passa la vita nella pelliccia dei bradipi, in cima agli alberi. Il pelo di un bradipo è un mondo intero: ospita alghe, funghi e insetti.", en: "A small moth that spends its life in the fur of sloths, high in the trees. A sloth’s coat is a whole world: it hosts algae, fungi and insects." },
        fact: { it: "Circa una volta a settimana il bradipo scende a terra per fare i bisogni. Le falene ne approfittano per deporre le uova negli escrementi; le nuove falene poi volano su a cercare un bradipo.", en: "About once a week the sloth climbs down to the ground to relieve itself. The moths seize the moment to lay eggs in the dung; the new moths then fly up to find a sloth." },
        prompt: "Photorealistic macro wildlife photograph of several tiny brownish-grey sloth moths (Cryptoses) resting and crawling in the shaggy, coarse, greenish-tinged fur of a brown-throated three-toed sloth hanging in the Amazon canopy, green algae tinting the fur, shallow depth of field.", style: "forest" },
      { id: "hoatzin", d: -12, h: 25, name: { it: "Hoatzin", en: "Hoatzin" }, sci: "Opisthocomus hoazin",
        range: { it: "sottobosco, lungo i fiumi", en: "understory, along rivers" }, size: { it: "circa 65 cm", en: "about 65 cm" },
        text: { it: "Un uccello dall’aspetto preistorico, con la cresta spettinata, il viso blu e gli occhi rossi. Mangia quasi solo foglie e le fa fermentare nel gozzo, come fa una mucca: per l’odore forte lo chiamano uccello puzzolente.", en: "A prehistoric-looking bird with a scruffy crest, a blue face and red eyes. It eats almost only leaves and ferments them in its crop, like a cow does: its strong smell earned it the name stinkbird." },
        fact: { it: "I pulcini hanno due artigli su ogni ala. Se arriva un predatore si lasciano cadere in acqua, nuotano e poi risalgono sul ramo arrampicandosi con le ali.", en: "Its chicks have two claws on each wing. When a predator comes they drop into the water, swim, then climb back up the branch using their wings." },
        prompt: "Photorealistic wildlife photograph of a hoatzin (Opisthocomus hoazin) perched on a branch overhanging a calm Amazon river: pheasant-sized bird with a spiky rufous-brown crest, bare bright blue facial skin, maroon-red eyes, dark bronze-brown upper body with pale streaks, chestnut wings, buff chest, long dark tail.", style: "forest" },
      { id: "glassfrog", d: -8, h: 95, name: { it: "Rana di vetro", en: "Glass frog" }, sci: "Hyalinobatrachium",
        range: { it: "sottobosco, sopra i ruscelli", en: "understory, above streams" }, size: { it: "2–3 cm", en: "2–3 cm" },
        text: { it: "Una ranocchia verde chiaro grande come un pollice. Ha la pancia trasparente: guardandola da sotto si vedono il cuore che batte, il fegato e l’intestino.", en: "A pale green frog the size of a thumb. Its belly is transparent: from below you can see its beating heart, liver and gut." },
        fact: { it: "Quando dorme nasconde nel fegato quasi tutti i globuli rossi del sangue e diventa ancora più trasparente. Lo ha scoperto uno studio del 2022.", en: "While it sleeps it hides almost all its red blood cells in its liver and becomes even more see-through. A 2022 study discovered this." },
        prompt: "Photorealistic macro photograph of a glass frog (Hyalinobatrachium, family Centrolenidae), about 2.5 cm, lime-green translucent back with tiny pale yellow dots, gold-flecked eyes, sitting on a broad green leaf above a forest stream; the leaf is lit from behind so the frog's transparent belly shows its red heart and internal organs as silhouettes.", style: "forest" },
      { id: "fulgora", d: -5, h: 45, name: { it: "Fulgora testa d’arachide", en: "Peanut-head bug" }, sci: "Fulgora laternaria",
        range: { it: "sottobosco, sui tronchi", en: "understory, on tree trunks" }, size: { it: "fino a circa 9 cm", en: "up to about 9 cm" },
        text: { it: "Un insetto con una testa enorme e vuota a forma di arachide, decorata con finti occhi e finti denti: di lato sembra la testa di un piccolo alligatore. Di giorno resta immobile sui tronchi, mimetizzato con la corteccia.", en: "An insect with a huge, hollow, peanut-shaped head painted with fake eyes and fake teeth: from the side it looks like a tiny alligator’s head. By day it sits still on trunks, blending into the bark." },
        fact: { it: "Se disturbato apre di scatto le ali e mostra due grandi macchie a forma di occhio. In molte leggende si dice che sia velenoso, ma è del tutto innocuo.", en: "If disturbed it flashes open its wings to show two big eye-shaped spots. Many legends say it is deadly, but it is completely harmless." },
        prompt: "Photorealistic macro wildlife photograph of a peanut-head bug (Fulgora laternaria) on a rainforest tree trunk, side view: a large hollow, inflated, peanut-shaped head projection with false eye markings and false teeth resembling a tiny alligator head, mottled brown, grey and cream forewings matching the bark, hind wings partly open showing large yellow-ringed eyespots, about 9 cm long.", style: "forest" },
      { id: "bulletant", d: -1.8, h: 15, name: { it: "Formica proiettile", en: "Bullet ant" }, sci: "Paraponera clavata",
        range: { it: "alla base dei grandi alberi", en: "at the base of big trees" }, size: { it: "fino a 3 cm", en: "up to 3 cm" },
        text: { it: "Una formica nera e lucida, lunga fino a 3 centimetri. Costruisce il nido alla base dei grandi alberi e sale sui tronchi a cercare nettare e piccoli insetti.", en: "A glossy black ant up to 3 centimetres long. It nests at the foot of big trees and climbs the trunks in search of nectar and small insects." },
        fact: { it: "La sua puntura è considerata la più dolorosa di tutti gli insetti, e il dolore può durare fino a un giorno intero. Il nome viene proprio da quella sensazione, simile a un colpo d’arma da fuoco.", en: "Its sting is rated the most painful of any insect, and the pain can last a whole day. Its name comes from that very feeling, like being shot." },
        prompt: "Photorealistic macro wildlife photograph of a bullet ant (Paraponera clavata), about 2.5 cm long, glossy reddish-black body, large head with strong mandibles, visible stinger at the tip of the abdomen, walking on the bark at the base of a rainforest tree.", style: "forest" },
      { id: "goliath", d: -0.6, h: 22, name: { it: "Tarantola Golia", en: "Goliath birdeater" }, sci: "Theraphosa blondi",
        range: { it: "suolo della foresta, in tane", en: "forest floor, in burrows" }, size: { it: "zampe aperte fino a circa 30 cm", en: "leg span up to about 30 cm" },
        text: { it: "Il ragno più pesante del mondo: con le zampe aperte può essere largo quanto un piatto. Vive in tane nel terreno umido della foresta e caccia di notte.", en: "The heaviest spider in the world: with its legs spread it can be as wide as a dinner plate. It lives in burrows in the damp forest soil and hunts at night." },
        fact: { it: "Il nome inglese significa mangiatore di uccelli, ma si nutre soprattutto di insetti, vermi, rane e piccoli roditori. Per difendersi lancia nell’aria peli urticanti dall’addome.", en: "Despite its name it mostly eats insects, worms, frogs and small rodents. To defend itself it flicks stinging hairs off its abdomen into the air." },
        prompt: "Photorealistic wildlife photograph of a Goliath birdeater tarantula (Theraphosa blondi) on the dark rainforest floor among fallen leaves at the entrance of its burrow: huge hairy spider with a leg span of about 28 cm, rich chestnut-brown body and legs covered with fine hairs, faint pale rings at the leg joints, low-angle view at night.", style: "forest" },
      { id: "cordyceps", d: -0.3, h: 60, name: { it: "Fungo delle formiche zombie", en: "Zombie-ant fungus" }, sci: "Ophiocordyceps",
        range: { it: "foglie basse del sottobosco", en: "low understory leaves" }, size: { it: "piccolo", en: "small" },
        text: { it: "Un fungo che infetta le formiche e ne prende il controllo. La formica infetta lascia il nido, sale su una foglia vicino al suolo, ci si aggrappa con le mandibole e lì muore.", en: "A fungus that infects ants and takes control of them. The infected ant leaves its nest, climbs a leaf near the ground, clamps on with its jaws and dies there." },
        fact: { it: "Dalla testa della formica spunta poi un sottile stelo che fa piovere spore sul sentiero sotto, dove passeranno altre formiche. Esistono decine di specie di questi funghi, ognuna specializzata su un tipo di formica.", en: "A thin stalk then sprouts from the ant’s head and rains spores onto the trail below, where other ants will pass. There are dozens of species of these fungi, each specialised on one kind of ant." },
        prompt: "Photorealistic macro photograph of a zombie-ant fungus (Ophiocordyceps): a dead carpenter ant clamped by its mandibles to the underside vein of a green leaf in the rainforest understory, a thin pale tan fungal stalk with a small swollen tip growing out of the back of the ant's head, fine whitish fungal threads around its legs and joints, soft diffuse light.", style: "forest" },
      { id: "caecilian", d: 1.5, h: 220, name: { it: "Ceciliano anellato", en: "Ringed caecilian" }, sci: "Siphonops annulatus",
        range: { it: "gallerie nel terreno", en: "tunnels in the soil" }, size: { it: "fino a circa 40 cm", en: "up to about 40 cm" },
        text: { it: "Sembra un grosso lombrico blu-grigio ad anelli bianchi, ma è un anfibio senza zampe, parente delle rane. Vive scavando gallerie nel terreno ed è quasi cieco.", en: "It looks like a big blue-grey earthworm with white rings, but it is a legless amphibian, related to frogs. It lives digging tunnels in the soil and is nearly blind." },
        fact: { it: "Nel 2024 si è scoperto che le mamme producono una specie di latte per i piccoli, che lo chiedono emettendo dei suoni. I piccoli mangiano anche lo strato esterno della pelle della mamma, che si rinnova.", en: "In 2024 scientists found that mothers make a kind of milk for their young, who beg for it with little sounds. The young also eat the outer layer of their mother’s skin, which grows back." },
        prompt: "Photorealistic wildlife photograph of a ringed caecilian (Siphonops annulatus), a legless burrowing amphibian about 35 cm long: smooth shiny dark blue-grey body marked with regular thin white rings, blunt rounded head with tiny eyes under the skin, emerging from dark moist soil among roots.", style: "forest" },
      { id: "leafcutter", d: 4, h: 30, name: { it: "Il giardino delle formiche tagliafoglie", en: "Leafcutter ant fungus garden" }, sci: "Atta",
        range: { it: "camere a diversi metri sotto terra", en: "chambers several metres underground" }, size: { it: "nidi con milioni di formiche", en: "nests of millions of ants" },
        text: { it: "Le formiche tagliafoglie non mangiano le foglie che trasportano: le portano sotto terra, le sminuzzano e le usano per coltivare un fungo, di cui si nutrono. Sono agricoltrici da milioni di anni.", en: "Leafcutter ants don’t eat the leaves they carry: they take them underground, chew them up and use them to grow a fungus, which they eat. They have been farmers for millions of years." },
        fact: { it: "Un solo nido può ospitare milioni di formiche divise in caste: soldati giganti, operaie che tagliano e minuscole giardiniere che curano il fungo.", en: "A single nest can hold millions of ants split into castes: giant soldiers, workers that cut leaves and tiny gardeners that tend the fungus." },
        prompt: "Photorealistic macro photograph inside an underground chamber of a leafcutter ant nest (Atta): a large spongy greyish-white fungus garden made of chewed leaf fragments, tended by many reddish-brown leafcutter ants of different sizes, from tiny gardener workers to large-headed soldiers, some carrying small green leaf pieces, dark earthen walls.", style: "forest" }
    ]
  },

    lead: { it: "Dalla cima degli alberi della foresta pluviale fino alle tane scavate nella terra rossa. Qui vivono animali che non esistono in nessun altro posto al mondo. Lo strumento mostra l’altezza e quanta luce del sole arriva.", en: "From the treetops of the rainforest down to burrows dug in the red earth. The animals here live nowhere else in the world. The gauge shows height and how much sunlight gets through." },
    cue: { it: "Scorri per scendere", en: "Scroll to descend" },
    note: { it: "Queste creature vivono in foreste diverse dell’isola, dalla foresta pluviale dell’est a quella secca dell’ovest: qui le trovi all’altezza in cui si incontrano.", en: "These creatures live in different forests across the island, from the eastern rainforest to the dry western forest: here you meet them at the height where they are found." },
    stops: [[-32, "#b9dfe4"], [-25, "#86c49a"], [-15, "#3f8a55"], [-6, "#24603a"], [-1, "#173f27"], [0, "#7a3320"], [1, "#4f1f12"], [2.5, "#2a0e08"]],
    zones: [
      { from: -32, to: -15, name: { it: "La chioma", en: "The canopy" }, range: { it: "15–30 m", en: "15–30 m" }, text: { it: "Le cime degli alberi della foresta pluviale dell’est. Di giorno qui cantano gli indri, di notte si muovono gli aye-aye.", en: "The treetops of the eastern rainforest. By day the indris sing here; by night the aye-ayes come out." } },
      { from: -15, to: -2, name: { it: "Il sottobosco", en: "The understory" }, range: { it: "2–15 m", en: "2–15 m" }, text: { it: "Tronchi, liane e rami più bassi: il regno dei cacciatori agili e dei nidi nascosti.", en: "Trunks, vines and lower branches: the realm of nimble hunters and hidden nests." } },
      { from: -2, to: 0, name: { it: "Il suolo", en: "The forest floor" }, range: { it: "0–2 m", en: "0–2 m" }, text: { it: "Foglie secche, rocce e terra rossa. Nella lettiera si nascondono animali grandi come un’unghia.", en: "Dry leaves, rocks and red earth. Animals the size of a fingernail hide in the leaf litter." } },
      { from: 0, to: 2.5, name: { it: "Sotto terra e sott’acqua", en: "Underground and underwater" }, range: { it: "sotto il suolo", en: "below the surface" }, text: { it: "Tane scavate nella terra e laghi dove si tuffano anatre rarissime.", en: "Burrows dug in the earth, and lakes where very rare ducks dive." } }
    ],
    marks: [
      { d: 0, text: { it: "La terra è rossa perché è ricca di ferro: per questo il Madagascar è chiamato l’Isola Rossa", en: "The soil is red because it is rich in iron: that’s why Madagascar is called the Red Island" } }
    ],
    endTitle: { it: "Un’isola unica al mondo", en: "An island like no other" },
    endText: { it: "Il Madagascar si è staccato dall’India circa 88 milioni di anni fa, e da allora le sue creature si sono evolute da sole: circa il 90% delle sue specie vive solo qui. Molte delle sue foreste però sono state tagliate, e quasi tutti gli animali che hai incontrato sono in pericolo.", en: "Madagascar broke away from India about 88 million years ago, and its creatures have evolved on their own ever since: about 90% of its species live only here. But many of its forests have been cut down, and almost every animal you have met is endangered." },
    creatures: [
      { id: "indri", d: -27, h: 110, name: { it: "Indri", en: "Indri" }, sci: "Indri indri",
        range: { it: "chioma della foresta pluviale dell’est", en: "eastern rainforest canopy" }, size: { it: "64–72 cm, quasi senza coda", en: "64–72 cm, almost tailless" },
        text: { it: "Il lemure più grande che esista oggi: pesa fino a 9 kg, ha il pelo bianco e nero e una coda così corta che quasi non si vede. Vive in famiglia sugli alberi più alti e si sposta con salti enormi da un tronco all’altro, restando aggrappato in verticale.", en: "The largest living lemur: it weighs up to 9 kg, has black-and-white fur and a tail so short you can barely see it. It lives in family groups in the tallest trees and moves with huge leaps from trunk to trunk, clinging upright." },
        fact: { it: "Gli indri cantano in coro, e nel 2021 uno studio italiano ha scoperto che i loro canti hanno un ritmo simile a quello della musica umana. È il primo mammifero, oltre a noi, in cui è stato trovato.", en: "Indris sing in chorus, and in 2021 an Italian study found that their songs share a rhythm with human music. It is the first mammal besides us in which this has been found." },
        prompt: "Photorealistic wildlife photograph of an indri (Indri indri), the largest living lemur, clinging vertically to a tree trunk high in the eastern Madagascar rainforest canopy: its thick silky fur is MOSTLY BLACK (black head, shoulders, back and upper arms) with white or pale grey patches only on the crown, the sides of the neck, the forearms, the legs and the lower back; bare black face, large green eyes, round fluffy black ears, long powerful legs, and almost no tail at all, only a tiny stub hidden in the fur. Misty green rainforest in soft morning light.", style: "forest" },
      { id: "ayeaye", d: -21, h: 30, name: { it: "Aye-aye", en: "Aye-aye" }, sci: "Daubentonia madagascariensis",
        range: { it: "chioma, di notte", en: "the canopy, at night" }, size: { it: "corpo 30–37 cm, coda fino a 50 cm", en: "body 30–37 cm, tail up to 50 cm" },
        text: { it: "Il primate notturno più grande del mondo, con occhi enormi, orecchie da pipistrello e un dito medio lunghissimo e sottile. Di notte bussa sui tronchi con quel dito e ascolta l’eco: quando sente il vuoto di una galleria scavata da una larva, rosicchia il legno e la tira fuori.", en: "The world’s largest nocturnal primate, with huge eyes, bat-like ears and a very long, thin middle finger. At night it taps on tree trunks with that finger and listens to the echo: when it hears the hollow of a grub’s tunnel, it gnaws the wood and hooks the grub out." },
        fact: { it: "Nel 2022 alcuni scienziati l’hanno filmato mentre si infilava nel naso il dito lungo, e poi lo leccava. Le scansioni dicono che quel dito può arrivare fino alla gola!", en: "In 2022 scientists filmed one pushing its long finger up its nose, then licking it. Scans suggest that finger can reach all the way to its throat!" },
        prompt: "Photorealistic night wildlife photograph of an aye-aye (Daubentonia madagascariensis) on a branch in the Madagascar rainforest canopy: shaggy dark grey-brown coarse fur with pale guard hairs, very large round orange-yellow eyes, big leathery bat-like ears, a long bushy tail, one hand raised showing the extremely long, thin, skeletal middle finger tapping the bark, softly lit.", style: "forest" },
      { id: "fossa", d: -13, h: 22, name: { it: "Fossa", en: "Fossa" }, sci: "Cryptoprocta ferox",
        range: { it: "dagli alberi al suolo, in tutta l’isola", en: "from treetops to ground, across the island" }, size: { it: "fino a 1,5 m con la coda", en: "up to 1.5 m with its tail" },
        text: { it: "Il predatore più grande del Madagascar. Sembra un incrocio tra un gatto e un puma, ma è parente delle manguste. Caccia sia di giorno sia di notte, sugli alberi e a terra, e più di metà di ciò che mangia sono lemuri.", en: "Madagascar’s largest predator. It looks like a cross between a cat and a puma, but it is related to mongooses. It hunts by day and by night, in the trees and on the ground, and more than half of what it eats is lemurs." },
        fact: { it: "Ha caviglie così flessibili che può scendere dagli alberi a testa in giù, come uno scoiattolo, e saltare da un ramo all’altro usando la lunga coda per restare in equilibrio.", en: "Its ankles are so flexible that it can climb down trees head-first, like a squirrel, and leap from branch to branch using its long tail for balance." },
        prompt: "Photorealistic wildlife photograph of a fossa (Cryptoprocta ferox) climbing head-first down a thick tree trunk in a Madagascar forest: slender muscular cat-like body, short dense reddish-brown fur, small rounded ears, dark eyes, a very long tail almost as long as its body, strong curved claws gripping the bark.", style: "forest" },
      { id: "helmetvanga", d: -8, h: 215, name: { it: "Vanga elmo", en: "Helmet vanga" }, sci: "Euryceros prevostii",
        range: { it: "foresta pluviale del nord-est", en: "north-eastern rainforest" }, size: { it: "28–31 cm", en: "28–31 cm" },
        text: { it: "Un uccello nero e rossiccio con un becco enorme, curvo e azzurro brillante, lungo circa 5 cm. Vive solo nelle foreste pluviali del nord-est, dove caccia grossi insetti, piccole lucertole e rane tra i rami del sottobosco.", en: "A black and rufous bird with a huge, hooked, bright-blue bill about 5 cm long. It lives only in the north-eastern rainforests, where it hunts big insects, small lizards and frogs among the understory branches." },
        fact: { it: "Maschio e femmina costruiscono insieme il nido, una coppetta di muschio e fibre a 2–4 metri da terra. Gli ornitologi arrivano da tutto il mondo per vederlo.", en: "Male and female build their nest together, a little cup of moss and fibres 2–4 metres above the ground. Birdwatchers travel from all over the world to see it." },
        prompt: "Photorealistic wildlife photograph of a helmet vanga (Euryceros prevostii) perched on a branch in the north-eastern Madagascar rainforest understory: its head, throat, breast and belly are entirely BLACK with no white anywhere on the underparts; its back, wings and long tail are rich rufous-chestnut; it has an enormous, deep, arched, bright cobalt-blue bill (the colour is on the bill itself, there is no crest or casque on top of the head) and pale eyes. Lush green background.", style: "forest" },
      { id: "mouselemur", d: -5, h: 35, name: { it: "Microcebo di Madame Berthe", en: "Madame Berthe’s mouse lemur" }, sci: "Microcebus berthae",
        range: { it: "foresta secca dell’ovest (Kirindy)", en: "western dry forest (Kirindy)" }, size: { it: "circa 9 cm, 30 grammi", en: "about 9 cm, 30 grams" },
        text: { it: "Il primate più piccolo del mondo: pesa circa 30 grammi e il suo corpo sta in un palmo. Vive quasi solo nella foresta secca di Kirindy, nell’ovest dell’isola, dove di notte cerca insetti e le gocce dolci prodotte da piccole larve sui rami.", en: "The world’s smallest primate: it weighs about 30 grams and its body fits in your palm. It lives almost only in the Kirindy dry forest in the west of the island, where at night it hunts insects and the sweet droplets made by tiny larvae on the branches." },
        fact: { it: "Fu trovato nel 1992, ma all’inizio lo scambiarono per un’altra specie. Solo nel 2000 gli scienziati capirono che era una specie nuova e lo dedicarono a Berthe Rakotosamimanana, una primatologa del Madagascar.", en: "It was found in 1992 but at first mistaken for another species. Only in 2000 did scientists realise it was new, naming it after Berthe Rakotosamimanana, a Malagasy primatologist." },
        prompt: "Photorealistic night wildlife macro photograph of Madame Berthe's mouse lemur (Microcebus berthae), the world's smallest primate, about 9 cm long, sitting on a thin twig in a dry deciduous forest in western Madagascar: tiny body with soft cinnamon-orange to rufous fur, paler belly, a faint pale stripe between the eyes, enormous round reflective dark eyes, thin long tail, delicate hands gripping the twig.", style: "forest" },
      { id: "paragehyra", d: -1.2, h: 30, name: { it: "Geco di Tsaranoro", en: "Tsaranoro gecko" }, sci: "Paragehyra tsaranoro",
        range: { it: "rocce nei boschi sacri della valle di Tsaranoro", en: "rocks in the sacred forests of the Tsaranoro valley" }, size: { it: "pochi centimetri", en: "a few centimetres" },
        text: { it: "Un geco notturno scoperto nel 2025, con la pelle marrone a macchie che si confonde con la roccia. Vive solo in pochi piccoli boschi a ovest del massiccio dell’Andringitra, nel sud-est dell’isola, tra rocce e tronchi.", en: "A nocturnal gecko described in 2025, with mottled brown skin that blends into the rock. It lives only in a few small forests west of the Andringitra massif, in the south-east of the island, among rocks and trunks." },
        fact: { it: "Quei boschi esistono ancora perché le comunità del posto li considerano sacri: lì si svolgono i riti funebri, e regole tradizionali chiamate ‘fady’ vietano di rovinarli. Senza quei divieti, il geco forse sarebbe già scomparso.", en: "Those forests survive because the local communities hold them sacred: funeral rites take place there, and traditional rules called ‘fady’ forbid harming them. Without those taboos, the gecko might already be gone." },
        prompt: "Photorealistic night wildlife macro photograph of a Paragehyra gecko (Paragehyra tsaranoro, described 2025) clinging to a granite boulder in a small montane forest fragment in south-eastern Madagascar: slender gecko with mottled brown, grey and cream skin that camouflages against the rock, large eyes with vertical pupils, slender toes, lit by a soft flashlight.", style: "forest" },
      { id: "mesite", d: -0.4, h: 25, name: { it: "Mesite pettobianco", en: "White-breasted mesite" }, sci: "Mesitornis variegatus",
        range: { it: "foreste secche del nord e dell’ovest", en: "dry forests of the north and west" }, size: { it: "circa 30 cm", en: "about 30 cm" },
        text: { it: "Un uccello che vive quasi sempre a terra, in piccoli gruppi di 2–4. Cammina lentamente tra le foglie secche e le sposta col becco per trovare scarafaggi, millepiedi, ragni e semi. Ha ali corte e arrotondate e vola solo per pochi metri, quando è spaventato.", en: "A bird that lives almost always on the ground, in small groups of 2–4. It walks slowly through the dry leaves, flicking them aside with its bill to find beetles, centipedes, spiders and seeds. It has short, rounded wings and flies only a few metres when startled." },
        fact: { it: "I mesiti sono una famiglia di uccelli antichissima che esiste solo in Madagascar: in tutto il mondo ce ne sono solo tre specie.", en: "Mesites are an ancient bird family found only in Madagascar: there are just three species in the whole world." },
        prompt: "Photorealistic wildlife photograph of a white-breasted mesite (Mesitornis variegatus) walking on dry leaf litter on the floor of a deciduous forest in western Madagascar: a rail-like ground bird about 30 cm long with a small head, a plump body and a fairly long, broad tail; plain rufous-brown upperparts with no spots or streaks; white face with a bold white stripe above the eye and dark stripes below it; white throat; a tawny-orange band across the chest; white belly and flanks barred with black crescent marks; a short, dark, straight bill; short rounded wings.", style: "forest" },
      { id: "brookesia", d: -0.15, h: 95, name: { it: "Camaleonte nano", en: "Nano-chameleon" }, sci: "Brookesia nana",
        range: { it: "lettiera della foresta di montagna del nord", en: "leaf litter of the northern montane forest" }, size: { it: "maschio 2,2 cm con la coda", en: "male 2.2 cm including tail" },
        text: { it: "Forse il rettile più piccolo del mondo: il maschio, coda compresa, è lungo circa 2,2 cm e sta comodamente sulla punta di un dito. È stato scoperto nel 2021 nella foresta del massiccio di Sorata, nel nord del Madagascar. Di giorno cerca minuscoli insetti tra le foglie, di notte dorme su rametti bassi.", en: "Possibly the world’s smallest reptile: the male, tail included, is about 2.2 cm long and fits easily on a fingertip. It was described in 2021 from the forest of the Sorata massif in northern Madagascar. By day it hunts tiny insects in the leaf litter; at night it sleeps on low twigs." },
        fact: { it: "A differenza di molti camaleonti, non cambia colore. E le femmine sono più grandi dei maschi, circa 2,9 cm, per avere spazio per le uova.", en: "Unlike many chameleons, it doesn’t change colour. And females are bigger than males, about 2.9 cm, to make room for their eggs." },
        prompt: "Photorealistic extreme macro photograph of a male nano-chameleon (Brookesia nana), one of the smallest reptiles on Earth, only about 2 cm long including its tail, so tiny that it covers less than half of a human fingertip it is sitting on: plain brown and beige body with slightly rough skin and small bumps along the back, a short straight tapering tail that does NOT curl, large eyes in turret-like sockets, a small head without a crest. Very shallow depth of field, leaf litter of a Madagascar montane rainforest blurred behind.", style: "forest" },
      { id: "pochard", d: 0.6, h: 30, at: { it: "Sott’acqua, in un lago", en: "Underwater, in a lake" }, name: { it: "Moriglione del Madagascar", en: "Madagascar pochard" }, sci: "Aythya innotata",
        range: { it: "Lago Sofia, nord del Madagascar", en: "Lake Sofia, northern Madagascar" }, size: { it: "circa 45 cm", en: "about 45 cm" },
        text: { it: "Una piccola anatra tuffatrice marrone, con gli occhi bianchi nei maschi. Si immerge sott’acqua per cercare cibo. Nel 2004 era stata dichiarata estinta, ma nel 2006 ne furono ritrovate 25 su un lago remoto del nord: probabilmente quel lago era troppo profondo perché gli anatroccoli riuscissero a nutrirsi.", en: "A small brown diving duck; the males have white eyes. It dives underwater to find food. In 2004 it was declared extinct, but in 2006 a flock of 25 was found on a remote northern lake, probably too deep for the ducklings to feed." },
        fact: { it: "Gli scienziati hanno allevato i piccoli e nel 2018 li hanno liberati sul Lago Sofia, usando gabbie galleggianti inventate apposta. Oggi su quel lago ce ne sono circa 70: è una delle anatre più rare del mondo.", en: "Scientists raised ducklings and in 2018 released them on Lake Sofia, using specially invented floating aviaries. Today about 70 live on that lake: it is one of the rarest ducks in the world." },
        prompt: "Photorealistic wildlife photograph of a Madagascar pochard (Aythya innotata), a small dark chestnut-brown diving duck, male with striking white eyes and a white patch under the tail, swimming low on a calm shallow lake fringed with reeds and water lilies in northern Madagascar, soft daylight.", style: "forest" },
      { id: "giantrat", d: 1.3, h: 25, name: { it: "Ratto gigante del Madagascar", en: "Malagasy giant rat" }, sci: "Hypogeomys antimena",
        range: { it: "foresta secca del Menabe, a nord di Morondava", en: "Menabe dry forest, north of Morondava" }, size: { it: "corpo 33 cm, 1,2 kg", en: "body 33 cm, 1.2 kg" },
        text: { it: "Un roditore grande come un coniglio, con orecchie lunghe e zampe posteriori forti: può saltare fino a quasi un metro d’altezza. Vive in tane larghe fino a 5 metri, con fino a sei ingressi che tiene chiusi con terra e foglie per tenere lontani i predatori. Esiste solo in una zona di circa 200 km² nell’ovest dell’isola.", en: "A rodent the size of a rabbit, with long ears and strong hind legs: it can leap almost a metre high. It lives in burrows up to 5 metres wide, with up to six entrances that it plugs with soil and leaves to keep predators out. It survives only in an area of about 200 km² in the west of the island." },
        fact: { it: "Le coppie restano insieme per tutta la vita e crescono i piccoli in due. I papà sono molto protettivi: difendono il cucciolo dai predatori, anche dai serpenti.", en: "Pairs stay together for life and raise their young together. Fathers are very protective: they defend their pup from predators, even snakes." },
        prompt: "Photorealistic night wildlife photograph of a Malagasy giant jumping rat (Hypogeomys antimena) at the entrance of its burrow in dry deciduous forest in western Madagascar: rabbit-sized rodent with coarse grey-brown fur, pale underside, long upright ears, large dark eyes, long whiskers, strong hind legs, a dark tail, red-brown soil and dry leaves around the burrow.", style: "forest" }
    ]
  },
  himalaya: {

    where: { it: "Himalaya · il tetto del mondo", en: "Himalayas · the roof of the world" },
