      p: { it: "Gli esseri viventi assorbono carbonio dall’aria e dal cibo, e una piccola parte è carbonio-14, radioattivo. Quando un organismo muore smette di assorbirlo, e il carbonio-14 rimasto si dimezza ogni 5.730 anni. Misurando quanto ne resta in un osso o in un pezzo di legno, gli scienziati capiscono quando è morto, fino a circa 50.000 anni fa. Per le rocce si usano atomi più lenti, come l’uranio: così sappiamo che la Terra ha 4,5 miliardi di anni.", en: "Living things take in carbon from the air and from food, and a tiny part of it is carbon-14, which is radioactive. When an organism dies it stops taking it in, and the carbon-14 left halves every 5,730 years. By measuring how much remains in a bone or a piece of wood, scientists work out when it died, back to about 50,000 years ago. For rocks they use slower atoms, such as uranium: that is how we know the Earth is 4.5 billion years old." } }
  ],
  try: { it: "Gioca al dimezzamento con 20 monete: lanciale tutte, togli quelle uscite croce, rilancia le altre. Conta quante ne restano a ogni giro. Più o meno metà ogni volta: hai appena simulato atomi radioattivi.", en: "Play the half-life game with 20 coins: toss them all, remove the ones that land tails, toss the rest again. Count how many are left each round. About half every time: you have just simulated radioactive atoms." },
  fact: { it: "Le banane sono un pochino radioattive, perché contengono potassio e una minima parte del potassio naturale è radioattiva. Niente paura: anche il tuo corpo lo è, per lo stesso motivo, e la dose è innocua.", en: "Bananas are slightly radioactive, because they contain potassium and a tiny fraction of natural potassium is radioactive. Don’t worry: your body is too, for the same reason, and the dose is harmless." } }
);
LESSONS.push(
{ id: "luce", s: "fisica", fig: "spectrum",
  t: { it: "La luce e i colori che non vediamo", en: "Light and the colours we cannot see" },
  k: { it: "La luce che vedono i nostri occhi è solo una fettina sottilissima di qualcosa di molto più grande.", en: "The light our eyes can see is just a very thin slice of something much bigger." },
  b: [
    { h: { it: "Un’onda di elettricità e magnetismo", en: "A wave of electricity and magnetism" },
      p: { it: "La luce è un’onda elettromagnetica: un’onda fatta di campo elettrico e campo magnetico che si inseguono e viaggiano nel vuoto a 300.000 chilometri al secondo. La distanza tra una cresta e l’altra, la lunghezza d’onda, decide il colore. Il rosso ha onde più lunghe, il viola più corte. Ma la stessa famiglia di onde continua ben oltre i colori, da una parte e dall’altra.", en: "Light is an electromagnetic wave: a wave of electric and magnetic fields chasing each other and travelling through empty space at 300,000 kilometres per second. The distance from one crest to the next, the wavelength, decides the colour. Red has longer waves, violet shorter ones. But the same family of waves carries on far beyond the colours, in both directions." } },
    { h: { it: "Lo spettro intero", en: "The whole spectrum" },
      p: { it: "Con onde lunghe come case o montagne ci sono le onde radio, che portano musica e Wi-Fi. Poi le microonde, che scaldano il cibo, e l’infrarosso, che sentiamo come calore. Dopo i colori visibili arrivano l’ultravioletto, che ci abbronza e scotta, i raggi X, che attraversano la pelle ma non le ossa, e i raggi gamma, i più energetici, prodotti dalle esplosioni di stelle. La luce visibile, quella dei colori, è solo una fettina minuscola in mezzo a tutto questo.", en: "With waves as long as houses or mountains there are radio waves, which carry music and Wi-Fi. Then microwaves, which heat food, and infrared, which we feel as warmth. After the visible colours come ultraviolet, which tans and burns us, X-rays, which pass through skin but not bone, and gamma rays, the most energetic, produced by exploding stars. Visible light, the light of colours, is just a tiny slice in the middle of it all." } },
    { h: { it: "Occhi diversi, mondi diversi", en: "Different eyes, different worlds" },
      p: { it: "Altri animali vedono pezzi di spettro che noi non vediamo. Le api vedono l’ultravioletto: molti fiori hanno disegni ultravioletti, come piste di atterraggio che indicano dove sta il nettare. Alcuni serpenti, come i crotali, hanno organi che sentono l’infrarosso e «vedono» il calore delle prede al buio. I telescopi fanno lo stesso per noi: il James Webb guarda l’universo nell’infrarosso, e così vede galassie nascoste dalla polvere.", en: "Other animals see pieces of the spectrum we cannot. Bees see ultraviolet: many flowers have ultraviolet patterns, like landing strips showing where the nectar is. Some snakes, such as rattlesnakes, have organs that sense infrared and “see” the warmth of prey in the dark. Telescopes do the same for us: James Webb looks at the universe in infrared, which lets it see galaxies hidden by dust." } }
  ],
  try: { it: "Punta il telecomando della TV verso la fotocamera del telefono (spesso funziona meglio quella frontale) e premi un tasto: sullo schermo vedrai lampeggiare la lucina infrarossa, che i tuoi occhi non vedono.", en: "Point the TV remote at your phone’s camera (the front one often works best) and press a button: on the screen you will see the infrared light blinking, invisible to your eyes." },
  fact: { it: "Nel 1800 l’astronomo William Herschel scoprì l’infrarosso con un prisma e dei termometri: quello messo appena oltre il rosso, dove non si vedeva nessuna luce, si scaldava più di tutti.", en: "In 1800 the astronomer William Herschel discovered infrared with a prism and some thermometers: the one placed just beyond the red, where no light could be seen, warmed up more than any other." } },

{ id: "cielo-blu", s: "fisica",
  t: { it: "Perché il cielo è blu e il tramonto rosso", en: "Why the sky is blue and sunsets are red" },
  k: { it: "La risposta sta nelle molecole dell’aria, che giocano a flipper con la luce del Sole.", en: "The answer lies in the molecules of the air, which play pinball with sunlight." },
  b: [
    { h: { it: "La luce bianca è un miscuglio", en: "White light is a mixture" },
      p: { it: "La luce del Sole sembra bianca, ma contiene tutti i colori, come mostra l’arcobaleno. Quando attraversa l’atmosfera incontra miliardi di molecole di azoto e ossigeno, molto più piccole delle onde della luce. Queste molecole deviano un po’ di luce in tutte le direzioni: si chiama diffusione. E non trattano tutti i colori allo stesso modo.", en: "Sunlight looks white, but it contains every colour, as a rainbow shows. As it crosses the atmosphere it meets billions of nitrogen and oxygen molecules, much smaller than the waves of light. These molecules scatter a little of the light in every direction. And they don’t treat all colours the same way." } },
    { h: { it: "Il blu rimbalza di più", en: "Blue bounces more" },
      p: { it: "Le onde corte, il blu e il viola, vengono diffuse molto di più di quelle lunghe, il rosso: circa sei volte di più. Così, ovunque guardi nel cielo, ti arriva luce blu rimbalzata dalle molecole, e il cielo appare blu. Perché non viola? Il Sole emette meno viola, una parte viene assorbita in alto, e i nostri occhi sono poco sensibili al viola. Le nuvole invece sono bianche: le loro goccioline sono grandi e diffondono tutti i colori allo stesso modo.", en: "Short waves, blue and violet, are scattered much more than long ones such as red: about six times more. So wherever you look in the sky, blue light bounced off molecules reaches you, and the sky looks blue. Why not violet? The Sun gives out less violet, some is absorbed high up, and our eyes are not very sensitive to it. Clouds, on the other hand, are white: their droplets are large and scatter all colours equally." } },
    { h: { it: "Il viaggio lungo del tramonto", en: "The long journey of sunset" },
      p: { it: "Al tramonto il Sole è basso e la sua luce attraversa molta più aria per arrivare fino a te. Lungo la strada quasi tutto il blu viene diffuso via, e restano l’arancione e il rosso. Su Marte succede il contrario: l’aria è sottile e piena di polvere finissima, così il cielo di giorno è color caramello e i tramonti sono azzurri. Il rover Curiosity li ha fotografati.", en: "At sunset the Sun is low and its light crosses much more air to reach you. Along the way almost all the blue is scattered away, leaving orange and red. On Mars it is the other way round: the air is thin and full of very fine dust, so the daytime sky is butterscotch and sunsets are blue. The Curiosity rover has photographed them." } }
  ],
  try: { it: "Al buio, riempi un bicchiere trasparente d’acqua e aggiungi qualche goccia di latte. Illumina il bicchiere di lato con una torcia: guardato di fianco l’acqua è azzurrina, guardando la torcia attraverso il bicchiere la luce è arancione. Hai fatto un cielo e un tramonto.", en: "In the dark, fill a clear glass with water and add a few drops of milk. Light the glass from the side with a torch: seen from the side the water looks bluish, while looking at the torch through the glass the light is orange. You have made a sky and a sunset." },
  fact: { it: "Dalla Luna, senza atmosfera, il cielo è nero anche a mezzogiorno, con il Sole che brilla accanto alle stelle.", en: "On the Moon, with no atmosphere, the sky is black even at noon, with the Sun shining next to the stars." } },

{ id: "velocita-luce", s: "fisica", w: "light",
  t: { it: "La velocità della luce e il passato che vediamo", en: "The speed of light and the past we see" },
  k: { it: "Niente va più veloce della luce. Ma su scala cosmica anche lei è lenta, e ci fa guardare indietro nel tempo.", en: "Nothing goes faster than light. But on a cosmic scale even light is slow, and it makes us look back in time." },
  b: [
    { h: { it: "Sette giri della Terra in un secondo", en: "Seven laps of the Earth in a second" },
      p: { it: "La luce nel vuoto viaggia a 299.792 chilometri al secondo: in un secondo farebbe più di sette volte il giro della Terra. È il limite di velocità dell’universo: nessun oggetto, segnale o informazione può superarlo. Nel 1676 l’astronomo Ole Rømer capì che la luce non è istantanea osservando le lune di Giove, che sembravano in ritardo quando Giove era più lontano.", en: "In empty space, light travels at 299,792 kilometres per second: in one second it could circle the Earth more than seven times. It is the universe’s speed limit: no object, signal or piece of information can beat it. In 1676 the astronomer Ole Rømer realised light is not instantaneous by watching Jupiter’s moons, which seemed late when Jupiter was farther away." } },
    { h: { it: "Messaggi lenti nello spazio", en: "Slow messages in space" },
      p: { it: "Un segnale radio va alla Luna in circa 1,3 secondi, ma per raggiungere Marte servono da 3 a 22 minuti, secondo dove si trovano i pianeti. Per questo i rover su Marte non si guidano col joystick: ricevono gli ordini e si muovono da soli. La sonda Voyager 1, la più lontana mai costruita, è così distante che i suoi messaggi impiegano quasi un giorno intero per arrivare. Prova qui sotto a mandare un messaggio.", en: "A radio signal reaches the Moon in about 1.3 seconds, but getting to Mars takes from 3 to 22 minutes, depending on where the planets are. That is why rovers on Mars are not driven with a joystick: they receive orders and move on their own. The Voyager 1 probe, the farthest ever built, is so distant that its messages take almost a whole day to arrive. Try sending a message below." } },
    { h: { it: "Guardare lontano è guardare indietro", en: "Looking far is looking back" },
      p: { it: "La luce del Sole che vedi è partita 8 minuti e 20 secondi fa: vedi il Sole com’era allora. La stella più vicina, Proxima Centauri, la vediamo com’era più di 4 anni fa. La Galassia di Andromeda, com’era 2,5 milioni di anni fa, quando sulla Terra comparivano i primi esseri umani del genere Homo. Il telescopio James Webb vede galassie la cui luce è partita oltre 13 miliardi di anni fa: fotografie dell’universo bambino.", en: "The sunlight you see left the Sun 8 minutes and 20 seconds ago: you see the Sun as it was then. The nearest star, Proxima Centauri, we see as it was over 4 years ago. The Andromeda Galaxy, as it was 2.5 million years ago, when the first humans of the genus Homo were appearing on Earth. The James Webb telescope sees galaxies whose light set off more than 13 billion years ago: photographs of the infant universe." } }
  ],
  try: { it: "La prossima volta che c’è un temporale, conta i secondi tra il lampo e il tuono e dividi per 3: ottieni i chilometri di distanza del fulmine. La luce arriva quasi subito, il suono va a «soli» 343 metri al secondo.", en: "Next time there is a thunderstorm, count the seconds between the flash and the thunder and divide by 3: that gives the lightning’s distance in kilometres. Light arrives almost instantly; sound travels at “only” 343 metres per second." },
  fact: { it: "La luce non è sempre così veloce: nell’acqua va a circa tre quarti della sua velocità, nel diamante a meno della metà. Nel 1999 la fisica Lene Hau l’ha rallentata fino a 17 metri al secondo, la velocità di una bicicletta, in una nuvola di atomi ultrafreddi.", en: "Light is not always that fast: in water it travels at about three quarters of its speed, in diamond at less than half. In 1999 the physicist Lene Hau slowed it to 17 metres per second, bicycle speed, in a cloud of ultracold atoms." } },

{ id: "relativita", s: "fisica",
  t: { it: "Il tempo è elastico: la relatività", en: "Time is stretchy: relativity" },
  k: { it: "Il tempo non scorre uguale per tutti. Dipende da quanto vai veloce e da quanta gravità hai intorno. Il tuo telefono lo sa.", en: "Time does not flow the same for everyone. It depends on how fast you move and how much gravity is around you. Your phone knows it." },
  b: [
    { h: { it: "L’idea di Einstein", en: "Einstein’s idea" },
      p: { it: "Nel 1905 Albert Einstein partì da due regole: le leggi della fisica sono uguali per chiunque si muova a velocità costante, e la luce va sempre alla stessa velocità per tutti. Per far quadrare entrambe le regole, qualcosa doveva cedere: il tempo e lo spazio. Per chi ti vede passare velocissimo, il tuo orologio va più piano. Non è un’illusione: il tempo stesso rallenta.", en: "In 1905 Albert Einstein started from two rules: the laws of physics are the same for anyone moving at constant speed, and light always travels at the same speed for everyone. To make both rules work, something had to give: time and space. For someone who sees you rushing past, your clock runs slower. It is not an illusion: time itself slows down." } },
    { h: { it: "Anche la gravità rallenta il tempo", en: "Gravity slows time too" },
      p: { it: "Dieci anni dopo, con la relatività generale, Einstein scoprì che anche la gravità rallenta il tempo: più sei vicino a una massa grande, più il tuo tempo scorre piano. Ai piedi di un grattacielo il tempo passa un pochino più lentamente che in cima. La differenza è minuscola, ma gli orologi atomici moderni la misurano anche su un dislivello di pochi centimetri.", en: "Ten years later, with general relativity, Einstein found that gravity slows time too: the closer you are to a large mass, the slower your time runs. At the foot of a skyscraper time passes a tiny bit more slowly than at the top. The difference is minute, but modern atomic clocks can measure it across a height difference of just a few centimetres." } },
    { h: { it: "Il GPS non funzionerebbe senza", en: "GPS would not work without it" },
      p: { it: "I satelliti GPS volano a 20.000 chilometri d’altezza a circa 14.000 chilometri all’ora. La velocità rallenta i loro orologi di 7 milionesimi di secondo al giorno, ma la gravità più debole li accelera di 45: in totale guadagnano 38 milionesimi di secondo al giorno. Sembra niente, ma il GPS calcola la posizione con i tempi dei segnali radio: senza correggere, sbaglierebbe di circa 10 chilometri al giorno. Ogni mappa sul telefono usa la relatività.", en: "GPS satellites fly 20,000 kilometres up at about 14,000 kilometres per hour. Their speed slows their clocks by 7 millionths of a second a day, but the weaker gravity speeds them up by 45: overall they gain 38 millionths of a second a day. It sounds like nothing, but GPS works out positions from the timing of radio signals: without the correction it would drift by about 10 kilometres a day. Every map on your phone uses relativity." } }
  ],
  try: { it: "Pensa ai gemelli: uno parte su un razzo velocissimo e torna dopo qualche anno, l’altro resta a casa. Chi è più vecchio al ritorno? (Risposta: quello rimasto a casa. È il famoso paradosso dei gemelli, ed è stato verificato con orologi atomici portati in aereo intorno al mondo.)", en: "Think about twins: one leaves on a very fast rocket and comes back after a few years, the other stays at home. Who is older when they meet again? (Answer: the one who stayed home. It is the famous twin paradox, and it has been confirmed with atomic clocks flown around the world on aeroplanes.)" },
  fact: { it: "I muoni, particelle create dai raggi cosmici a 15 chilometri d’altezza, vivono così poco che non dovrebbero arrivare a terra. Ci arrivano perché vanno quasi alla velocità della luce e il loro tempo rallenta.", en: "Muons, particles created by cosmic rays 15 kilometres up, live so briefly that they should never reach the ground. They do, because they travel at almost the speed of light and their time slows down." } },

{ id: "gravita", s: "fisica", w: "drop",
  t: { it: "Gravità: tutti cadono allo stesso modo", en: "Gravity: everything falls the same way" },
  k: { it: "Un martello e una piuma, lasciati cadere insieme, toccano terra nello stesso istante. Sulla Luna lo hanno provato davvero.", en: "A hammer and a feather, dropped together, hit the ground at the same instant. On the Moon, someone really tried it." },
  b: [
    { h: { it: "L’intuizione di Galileo", en: "Galileo’s insight" },
      p: { it: "Per duemila anni si è pensato che gli oggetti pesanti cadessero più in fretta di quelli leggeri. Galileo Galilei, intorno al 1600, mostrò con esperimenti e ragionamenti che non è così: senza aria, tutti gli oggetti cadono con la stessa accelerazione. Sulla Terra la piuma cade lenta solo perché l’aria la frena. Una pietra grande e una piccola, invece, arrivano insieme.", en: "For two thousand years people believed heavy objects fall faster than light ones. Around 1600 Galileo Galilei showed, with experiments and reasoning, that this is wrong: without air, all objects fall with the same acceleration. On Earth a feather falls slowly only because the air holds it back. A big stone and a small one, on the other hand, land together." } },
    { h: { it: "Il martello e la piuma sulla Luna", en: "The hammer and the feather on the Moon" },
      p: { it: "Il 2 agosto 1971, durante la missione Apollo 15, l’astronauta David Scott lasciò cadere sulla Luna, dove non c’è aria, un martello e una piuma di falco. Toccarono il suolo nello stesso istante, davanti alle telecamere. «Il signor Galileo aveva ragione», disse Scott. Sulla Luna però si cade più piano che sulla Terra, perché la sua gravità è circa un sesto della nostra.", en: "On 2 August 1971, during the Apollo 15 mission, astronaut David Scott dropped a hammer and a falcon feather on the Moon, where there is no air. They hit the ground at the same instant, in front of the cameras. “Mr Galileo was correct,” Scott said. On the Moon, though, things fall more slowly than on Earth, because its gravity is about one sixth of ours." } },
    { h: { it: "Ogni mondo ha la sua gravità", en: "Every world has its own gravity" },
      p: { it: "La gravità di un pianeta dipende dalla sua massa e dalla sua grandezza. Su Marte peseresti poco più di un terzo che sulla Terra e salteresti quasi tre volte più in alto. Su Giove, alla quota delle nuvole, peseresti due volte e mezza di più. E gli astronauti sulla Stazione spaziale non galleggiano perché lì non c’è gravità (ce n’è circa il 90% di quella a terra): galleggiano perché cadono continuamente intorno alla Terra, insieme alla stazione. Prova qui sotto a far cadere una palla su mondi diversi.", en: "A planet’s gravity depends on its mass and its size. On Mars you would weigh a little over a third of what you weigh on Earth and jump almost three times as high. On Jupiter, at cloud level, you would weigh two and a half times more. And astronauts on the Space Station do not float because there is no gravity there (about 90% of the ground value remains): they float because they are constantly falling around the Earth, together with the station. Try dropping a ball on different worlds below." } }
  ],
  try: { it: "Lascia cadere insieme, dalla stessa altezza, un libro e un foglio di carta: arriva prima il libro. Ora appoggia il foglio sopra il libro e lasciali cadere: il foglio resta attaccato, perché il libro gli toglie l’aria davanti. Senza aria, cadono uguali.", en: "Drop a book and a sheet of paper together from the same height: the book lands first. Now lay the sheet on top of the book and drop them: the paper stays on, because the book clears the air out of its way. Without air, they fall the same." },
  fact: { it: "Su una cometa come la 67P, visitata dalla sonda Rosetta, la gravità è così debole che con un salto potresti allontanarti per sempre nello spazio.", en: "On a comet like 67P, visited by the Rosetta probe, gravity is so weak that a single jump could send you off into space for ever." } },

{ id: "entropia", s: "fisica", w: "entropy",
  t: { it: "Entropia: perché non si torna indietro", en: "Entropy: why there is no going back" },
  k: { it: "Il latte si mescola al caffè ma non si separa mai da solo. Dietro c’è una delle leggi più profonde dell’universo.", en: "Milk mixes into coffee but never unmixes on its own. Behind it lies one of the deepest laws of the universe." },
  b: [
    { h: { it: "Più modi per essere in disordine", en: "More ways to be messy" },
      p: { it: "Pensa alla tua camera: c’è un solo modo, o pochissimi, per averla perfettamente in ordine, e moltissimi modi per averla in disordine. Se le cose si spostano a caso, è quasi sicuro che finiranno in uno dei tanti stati disordinati. Gli atomi fanno esattamente così: si muovono e si urtano di continuo, e finiscono quasi sempre nelle disposizioni più numerose. L’entropia misura proprio quanti modi diversi ci sono di disporre le cose.", en: "Think about your bedroom: there is only one way, or very few, for it to be perfectly tidy, and a huge number of ways for it to be a mess. If things move about at random, they will almost certainly end up in one of the many messy states. Atoms do exactly that: they move and collide constantly, and almost always end up in the most numerous arrangements. Entropy measures exactly how many different ways there are to arrange things." } },
    { h: { it: "La seconda legge", en: "The second law" },
      p: { it: "La seconda legge della termodinamica dice che in un sistema chiuso l’entropia tende ad aumentare. Per questo il calore passa dal caffè caldo all’aria fredda e mai il contrario, un profumo si sparge in tutta la stanza, un cubetto di ghiaccio si scioglie in un bicchiere tiepido. Non è proibito che le molecole tornino da sole in ordine: è solo così improbabile che non succede mai. Guarda il gas qui sotto: parte tutto da una parte e si sparge, ma non torna indietro.", en: "The second law of thermodynamics says that in a closed system entropy tends to increase. That is why heat flows from hot coffee into cold air and never the other way, why a perfume spreads through the whole room, why an ice cube melts in a lukewarm glass. It is not forbidden for molecules to get back into order by themselves: it is just so unlikely that it never happens. Watch the gas below: it starts on one side and spreads out, but it does not go back." } },
    { h: { it: "La freccia del tempo", en: "The arrow of time" },
      p: { it: "Molte leggi della fisica funzionano allo stesso modo avanti e indietro nel tempo. Allora perché ricordiamo il passato e non il futuro? Molti fisici pensano che la risposta sia l’entropia: l’universo è partito, col Big Bang, in uno stato molto ordinato, e da allora il disordine cresce. È questa crescita a dare una direzione al tempo. Gli esseri viventi creano ordine al loro interno, ma lo pagano disperdendo calore e aumentando il disordine intorno.", en: "Many laws of physics work the same forwards and backwards in time. So why do we remember the past and not the future? Many physicists think the answer is entropy: the universe began, at the Big Bang, in a very orderly state, and disorder has been growing ever since. That growth is what gives time a direction. Living things create order inside themselves, but they pay for it by giving off heat and increasing the disorder around them." } }
  ],
  try: { it: "Metti una goccia di colorante alimentare in un bicchiere d’acqua calda e una in un bicchiere d’acqua fredda, senza mescolare. Nell’acqua calda si sparge molto più in fretta: le molecole si muovono più veloci.", en: "Put a drop of food colouring into a glass of hot water and one into a glass of cold water, without stirring. In the hot water it spreads much faster: the molecules move more quickly." },
  fact: { it: "Un mazzo di 52 carte si può ordinare in circa 8 seguito da 67 zeri modi diversi. Ogni volta che mescoli bene un mazzo, quasi certamente stai creando un ordine che nessuno ha mai visto nella storia dell’umanità.", en: "A deck of 52 cards can be arranged in about 8 followed by 67 zeros different ways. Every time you shuffle a deck properly, you are almost certainly creating an order that nobody in human history has ever seen." } }
);
LESSONS.push(
{ id: "tavola-periodica", s: "chimica", fig: "table",
  t: { it: "La tavola periodica: la mappa della materia", en: "The periodic table: the map of matter" },
  k: { it: "118 elementi in una sola tabella. E un chimico russo che riuscì a prevedere elementi che nessuno aveva ancora mai visto.", en: "118 elements in a single table. And a Russian chemist who managed to predict elements nobody had ever seen." },
  b: [
    { h: { it: "Gli ingredienti di tutto", en: "The ingredients of everything" },
      p: { it: "Un elemento è un tipo di atomo, deciso dal numero di protoni nel nucleo: 1 protone è idrogeno, 6 carbonio, 8 ossigeno, 79 oro. Oggi ne conosciamo 118. Circa 90 si trovano in natura, gli altri sono stati creati in laboratorio e spesso durano una frazione di secondo. Tutto ciò che esiste, dalle stelle ai biscotti, è fatto di combinazioni di questi elementi.", en: "An element is a type of atom, set by the number of protons in its nucleus: 1 proton is hydrogen, 6 is carbon, 8 is oxygen, 79 is gold. Today we know 118 of them. About 90 occur in nature; the rest were made in laboratories and often last a fraction of a second. Everything that exists, from stars to biscuits, is made of combinations of these elements." } },
    { h: { it: "La scommessa di Mendeleev", en: "Mendeleev’s bet" },
      p: { it: "Nel 1869 il chimico russo Dmitrij Mendeleev mise in fila gli elementi conosciuti per peso e si accorse che le loro proprietà si ripetevano a intervalli regolari, come le note di una scala musicale. Li dispose in righe e colonne, ma alcune caselle restavano vuote. Ebbe il coraggio di dire: lì ci sono elementi che non abbiamo ancora scoperto, e ne descrisse peso e proprietà. Nel 1875 fu trovato il gallio e nel 1886 il germanio: erano proprio come li aveva previsti.", en: "In 1869 the Russian chemist Dmitri Mendeleev lined up the known elements by weight and noticed that their properties repeated at regular intervals, like the notes of a musical scale. He arranged them in rows and columns, but some boxes stayed empty. He dared to say: there are elements there that we have not yet discovered, and he described their weight and properties. Gallium was found in 1875 and germanium in 1886: they were just as he had predicted." } },
    { h: { it: "Come si legge", en: "How to read it" },
      p: { it: "Ogni riga corrisponde a un nuovo «strato» di elettroni intorno al nucleo. Gli elementi nella stessa colonna hanno lo stesso numero di elettroni nello strato più esterno, e per questo si comportano in modo simile. A sinistra ci sono i metalli che reagiscono violentemente, come il sodio. A destra, in fondo, i gas nobili come il neon, che non vogliono legarsi con nessuno. In mezzo, il grande blocco dei metalli come ferro, rame e oro.", en: "Each row corresponds to a new “shell” of electrons around the nucleus. Elements in the same column have the same number of electrons in their outermost shell, which is why they behave alike. On the left are the metals that react violently, such as sodium. On the far right are the noble gases such as neon, which refuse to bond with anyone. In between lies the big block of metals such as iron, copper and gold." } }
  ],
  try: { it: "Cerca in casa cinque elementi: alluminio (la carta stagnola), carbonio (la mina della matita, che è grafite), rame (dentro i fili elettrici), ferro (un chiodo) ed elio, se hai un palloncino che vola.", en: "Look for five elements at home: aluminium (kitchen foil), carbon (pencil lead, which is graphite), copper (inside electric wires), iron (a nail) and helium, if you have a balloon that floats." },
  fact: { it: "Un piccolo villaggio svedese, Ytterby, ha dato il nome a quattro elementi: ittrio, itterbio, terbio ed erbio. Nella sua miniera si trovarono minerali rarissimi che ne contenevano tanti insieme.", en: "A small Swedish village, Ytterby, gave its name to four elements: yttrium, ytterbium, terbium and erbium. Its mine yielded rare minerals that contained many of them together." } },

{ id: "legami", s: "chimica",
  t: { it: "Il legame chimico: atomi che si danno la mano", en: "The chemical bond: atoms holding hands" },
  k: { it: "Il sodio esplode nell’acqua, il cloro è un gas velenoso. Insieme fanno il sale da cucina.", en: "Sodium explodes in water, chlorine is a poisonous gas. Together they make table salt." },
  b: [
    { h: { it: "Il desiderio di uno strato pieno", en: "The wish for a full shell" },
      p: { it: "Gli atomi sono più tranquilli quando il loro strato più esterno di elettroni è completo, come quello dei gas nobili. Per arrivarci hanno due strade: cedere o prendere elettroni da un altro atomo, oppure metterli in comune. Questi scambi e queste condivisioni sono i legami chimici, e sono loro a trasformare un centinaio di elementi in milioni di sostanze diverse.", en: "Atoms are most settled when their outer shell of electrons is complete, like that of the noble gases. They have two ways to get there: give or take electrons from another atom, or share them. These exchanges and shares are chemical bonds, and they turn about a hundred elements into millions of different substances." } },
    { h: { it: "Dare e prendere: il sale", en: "Giving and taking: salt" },
      p: { it: "Il sodio ha un elettrone di troppo, il cloro uno di meno. Quando si incontrano, il sodio lo regala al cloro: il sodio diventa positivo, il cloro negativo, e si attraggono fortissimo. Miliardi di questi ioni si incastrano in un reticolo a cubetti: è il cloruro di sodio, il sale da cucina. Guarda dei granelli di sale con una lente: hanno davvero la forma di piccoli cubi, perché riflettono come sono ordinati gli atomi dentro.", en: "Sodium has one electron too many, chlorine one too few. When they meet, sodium hands its electron to chlorine: sodium becomes positive, chlorine negative, and they attract each other very strongly. Billions of these ions lock into a cube-shaped lattice: sodium chloride, table salt. Look at grains of salt through a magnifying glass: they really are little cubes, because they mirror how the atoms inside are arranged." } },
    { h: { it: "Mettere in comune: l’acqua e la vita", en: "Sharing: water and life" },
      p: { it: "Nell’acqua, invece, l’ossigeno e i due idrogeni si mettono d’accordo e condividono coppie di elettroni: è un legame covalente. Così sono fatte quasi tutte le molecole della vita, dagli zuccheri al DNA, con lunghe catene di carbonio. Nei metalli succede una terza cosa: gli elettroni esterni diventano un «mare» comune che scorre tra gli atomi. Per questo i metalli conducono l’elettricità e luccicano.", en: "In water, on the other hand, the oxygen and the two hydrogens come to an agreement and share pairs of electrons: this is a covalent bond. Almost all the molecules of life are built this way, from sugars to DNA, with long chains of carbon. In metals a third thing happens: the outer electrons become a shared “sea” flowing between the atoms. That is why metals conduct electricity and shine." } }
  ],
  try: { it: "Sciogli un cucchiaino di sale in poca acqua calda in un piattino e lascialo al sole per qualche giorno. Quando l’acqua evapora, guarda i cristalli con una lente: vedrai cubetti perfetti.", en: "Dissolve a teaspoon of salt in a little warm water on a saucer and leave it in the sun for a few days. When the water evaporates, look at the crystals with a magnifying glass: you will see perfect little cubes." },
  fact: { it: "Il diamante e la grafite della matita sono fatti dello stesso identico elemento, il carbonio. Cambia solo come sono legati gli atomi: nel diamante in una rete rigidissima, nella grafite in fogli che scivolano uno sull’altro.", en: "Diamond and the graphite in your pencil are made of exactly the same element, carbon. Only the way the atoms are bonded changes: in diamond a rigid network, in graphite sheets that slide over each other." } },

{ id: "acqua", s: "chimica", fig: "water",
  t: { it: "L’acqua, la molecola più strana", en: "Water, the strangest molecule" },
  k: { it: "Il ghiaccio galleggia, l’acqua sale su per i fili d’erba e trattiene il calore: tutte stranezze che rendono possibile la vita.", en: "Ice floats, water climbs up blades of grass and holds on to heat: oddities that make life possible." },
  b: [
    { h: { it: "Una molecola a forma di V", en: "A V-shaped molecule" },
      p: { it: "Una molecola d’acqua è fatta di un atomo di ossigeno e due di idrogeno, disposti a V con un angolo di circa 104,5 gradi. L’ossigeno tira gli elettroni verso di sé, così diventa un po’ negativo, mentre gli idrogeni restano un po’ positivi. Le molecole d’acqua si attirano tra loro come piccole calamite, formando i legami a idrogeno: deboli uno per uno, fortissimi tutti insieme.", en: "A water molecule is made of one oxygen atom and two hydrogen atoms, arranged in a V at an angle of about 104.5 degrees. Oxygen pulls the electrons towards itself, so it becomes slightly negative while the hydrogens stay slightly positive. Water molecules attract one another like tiny magnets, forming hydrogen bonds: weak one by one, very strong all together." } },
    { h: { it: "Il ghiaccio che galleggia", en: "Ice that floats" },
      p: { it: "Quasi tutte le sostanze, quando diventano solide, si stringono e affondano nel proprio liquido. L’acqua no: congelando, i legami a idrogeno la costringono in un reticolo pieno di spazi vuoti, e il ghiaccio occupa circa il 9% di spazio in più. Per questo galleggia. Ed è una fortuna: d’inverno laghi e mari gelano in superficie, il ghiaccio fa da coperta e sotto pesci e altri animali sopravvivono.", en: "Almost every substance shrinks when it turns solid and sinks in its own liquid. Not water: as it freezes, hydrogen bonds force it into a lattice full of empty space, and ice takes up about 9% more room. That is why it floats. And it is lucky: in winter, lakes and seas freeze at the surface, the ice acts as a blanket, and fish and other animals survive underneath." } },
    { h: { it: "Altre magie dell’acqua", en: "More water magic" },
      p: { it: "Grazie ai legami a idrogeno la superficie dell’acqua è tesa come una pellicola: alcuni insetti ci camminano sopra. L’acqua sale da sola in tubicini sottilissimi, ed è così che arriva dalle radici fino alle foglie. Serve tanta energia per scaldarla: per questo il mare d’estate resta fresco e d’inverno tiepido, e le città sul mare hanno un clima più mite. E scioglie più sostanze di qualunque altro liquido comune.", en: "Thanks to hydrogen bonds, the surface of water is stretched like a film: some insects walk on it. Water climbs by itself up very thin tubes, which is how it travels from roots all the way to leaves. It takes a lot of energy to warm it: that is why the sea stays cool in summer and mild in winter, and seaside cities have gentler climates. And it dissolves more substances than any other common liquid." } }
  ],
  try: { it: "Riempi un bicchiere d’acqua fino all’orlo e aggiungi monetine una alla volta, piano piano. L’acqua si gonfia sopra il bordo senza traboccare: è la tensione superficiale che la tiene insieme. Quante monete riesci a mettere?", en: "Fill a glass with water right to the brim and add coins one at a time, very gently. The water bulges above the rim without spilling: surface tension is holding it together. How many coins can you add?" },
  fact: { it: "Un bicchiere d’acqua contiene più molecole di quanti bicchieri d’acqua ci sono in tutti gli oceani. Per questo è quasi certo che nel tuo prossimo sorso ci siano molecole che sono passate per un dinosauro.", en: "A glass of water holds more molecules than there are glasses of water in all the oceans. That is why it is almost certain that your next sip contains molecules that once passed through a dinosaur." } },

{ id: "fuoco", s: "chimica",
  t: { it: "Che cos’è davvero una fiamma", en: "What a flame really is" },
  k: { it: "Non è una cosa, è una reazione che succede sotto i tuoi occhi. E nello spazio ha una forma diversa.", en: "It is not a thing but a reaction happening before your eyes. And in space it has a different shape." },
  b: [
    { h: { it: "Il triangolo del fuoco", en: "The fire triangle" },
      p: { it: "Per avere un fuoco servono tre cose: un combustibile, come legno, cera o gas, l’ossigeno dell’aria e calore per far partire la reazione. Il combustibile si combina con l’ossigeno e libera energia sotto forma di calore e luce, producendo soprattutto anidride carbonica e vapore acqueo. Se togli uno dei tre lati del triangolo, il fuoco si spegne: per questo una coperta lo soffoca e l’acqua lo raffredda.", en: "A fire needs three things: fuel, such as wood, wax or gas, oxygen from the air, and heat to start the reaction. The fuel combines with oxygen and releases energy as heat and light, producing mostly carbon dioxide and water vapour. Take away any side of the triangle and the fire goes out: that is why a blanket smothers it and water cools it." } },
    { h: { it: "Cosa brucia in una candela", en: "What burns in a candle" },
      p: { it: "In una candela non brucia la cera solida, e nemmeno quella liquida. Il calore scioglie la cera, lo stoppino la fa salire, e lì diventa vapore: è il vapore di cera che brucia. Il giallo della fiamma viene da minuscole particelle di carbonio, la fuliggine, così calde da brillare come il filamento di una lampadina. La parte blu in basso, invece, è luce emessa da molecole eccitate dove la combustione è più completa.", en: "In a candle, it is not the solid wax that burns, nor the liquid wax. The heat melts the wax, the wick draws it up, and there it turns into vapour: it is the wax vapour that burns. The yellow of the flame comes from tiny specks of carbon, soot, so hot that they glow like the filament of a light bulb. The blue part at the bottom is light given off by excited molecules where combustion is more complete." } },
    { h: { it: "Le fiamme sferiche dello spazio", en: "The round flames of space" },
      p: { it: "Sulla Terra la fiamma ha la forma di una goccia allungata verso l’alto perché l’aria calda è leggera e sale, portando via i gas bruciati e richiamando aria fresca dal basso. Sulla Stazione spaziale, dove non c’è «alto» né «basso», l’aria calda non sale: le fiamme diventano piccole sfere azzurre, più deboli e lente. Gli scienziati le studiano per capire meglio la combustione e la sicurezza a bordo.", en: "On Earth a flame is shaped like a drop stretched upwards because hot air is light and rises, carrying away burnt gases and drawing fresh air in from below. On the Space Station, where there is no “up” or “down”, hot air does not rise: flames become small blue spheres, weaker and slower. Scientists study them to understand combustion and safety on board." } }
  ],
  try: { it: "Solo con un adulto: spegni una candela soffiando e avvicina subito un fiammifero acceso al filo di fumo bianco, a un paio di centimetri dallo stoppino. La fiamma salta giù lungo il fumo e riaccende la candela: quel fumo è vapore di cera.", en: "Only with an adult: blow out a candle and immediately bring a lit match to the thread of white smoke, a couple of centimetres above the wick. The flame jumps down the smoke and relights the candle: that smoke is wax vapour." },
  fact: { it: "I fuochi d’artificio prendono i colori dai metalli: lo stronzio fa il rosso, il bario il verde, il rame il blu, il sodio il giallo. Ogni elemento, scaldato, emette la sua «firma» di colori.", en: "Fireworks get their colours from metals: strontium makes red, barium green, copper blue, sodium yellow. Every element, when heated, gives off its own “signature” of colours." } },

{ id: "acidi-basi", s: "chimica", fig: "ph",
  t: { it: "Acidi e basi: il cavolo che cambia colore", en: "Acids and bases: the colour-changing cabbage" },
  k: { it: "Limone, sapone, aceto, bicarbonato: in cucina c’è un laboratorio di chimica. E il cavolo rosso fa da indicatore.", en: "Lemon, soap, vinegar, baking soda: your kitchen is a chemistry lab. And red cabbage is the indicator." },
  b: [
    { h: { it: "La scala del pH", en: "The pH scale" },
      p: { it: "Gli acidi sono sostanze che liberano in acqua ioni idrogeno; le basi li catturano. Per misurare quanto è acida o basica una soluzione si usa il pH, una scala da 0 a 14. L’acqua pura sta a 7, neutra. Sotto ci sono gli acidi: il succo di limone a circa 2, l’aceto a circa 3. Sopra le basi: il bicarbonato verso 8 o 9, il sapone verso 10, la candeggina oltre 12.", en: "Acids are substances that release hydrogen ions into water; bases capture them. To measure how acidic or basic a solution is we use pH, a scale from 0 to 14. Pure water sits at 7, neutral. Below are the acids: lemon juice at about 2, vinegar at about 3. Above are the bases: baking soda around 8 or 9, soap around 10, bleach over 12." } },
    { h: { it: "Ogni numero vale dieci volte", en: "Each step is ten times" },
      p: { it: "La scala del pH ha un trucco: ogni passo vale dieci volte. Una soluzione a pH 3 è dieci volte più acida di una a pH 4, e cento volte più di una a pH 5. Il nostro stomaco è fortemente acido, tra 1,5 e 3,5: l’acido aiuta a digerire e uccide molti microbi. Il sangue invece deve restare sempre intorno a 7,4, e il corpo lavora continuamente per tenerlo lì.", en: "The pH scale has a trick: each step is worth ten times. A solution at pH 3 is ten times more acidic than one at pH 4, and a hundred times more than one at pH 5. Our stomach is strongly acidic, between 1.5 and 3.5: the acid helps digestion and kills many microbes. Blood, however, must always stay around 7.4, and the body works constantly to keep it there." } },
    { h: { it: "Il cavolo rosso e le ortensie", en: "Red cabbage and hydrangeas" },
      p: { it: "Il cavolo rosso contiene pigmenti chiamati antociani che cambiano colore con il pH: diventano rossi negli acidi, viola nel neutro, blu e verdi nelle basi, gialli nelle basi fortissime. Sono gli stessi pigmenti di mirtilli e ciliegie. Anche le ortensie fanno qualcosa di simile: in un terreno acido i loro fiori diventano blu, in uno basico rosa, perché il pH cambia quanto alluminio la pianta riesce ad assorbire.", en: "Red cabbage contains pigments called anthocyanins that change colour with pH: red in acids, purple when neutral, blue and green in bases, yellow in very strong bases. They are the same pigments found in blueberries and cherries. Hydrangeas do something similar: in acidic soil their flowers turn blue, in basic soil pink, because pH changes how much aluminium the plant can take up." } }
  ],
  try: { it: "Con un adulto: fai bollire per 10 minuti qualche foglia di cavolo rosso tagliata, filtra l’acqua viola e versala in tre bicchieri. Nel primo aggiungi aceto, nel secondo niente, nel terzo un cucchiaino di bicarbonato. Rosa, viola, blu-verde: hai costruito un misuratore di pH.", en: "With an adult: boil a few chopped red cabbage leaves for 10 minutes, strain the purple water and pour it into three glasses. Add vinegar to the first, nothing to the second, a teaspoon of baking soda to the third. Pink, purple, blue-green: you have built a pH meter." },
  fact: { it: "Le formiche si difendono spruzzando acido formico, che prende il nome proprio da loro: in latino formica si dice «formica». Le punture delle ortiche contengono lo stesso acido.", en: "Ants defend themselves by spraying formic acid, which is named after them: in Latin, ant is “formica”. Nettle stings contain the same acid." } },

{ id: "polvere-stelle", s: "chimica", go: { v: "galaxies", id: "mw" },
  t: { it: "Siamo fatti di polvere di stelle", en: "We are made of stardust" },
  k: { it: "Il ferro nel tuo sangue, il calcio nelle ossa, l’oro di un anello: sono nati dentro stelle che non esistono più.", en: "The iron in your blood, the calcium in your bones, the gold in a ring: all born inside stars that no longer exist." },
  b: [
    { h: { it: "All’inizio solo idrogeno ed elio", en: "At first, only hydrogen and helium" },
      p: { it: "Subito dopo il Big Bang l’universo conteneva quasi solo i due elementi più leggeri, idrogeno ed elio, più una spruzzata di litio. Niente carbonio, niente ossigeno, niente ferro: non c’erano gli ingredienti per pianeti rocciosi o per la vita. Tutti gli altri elementi sono stati costruiti dopo, nelle fornaci più potenti dell’universo: le stelle.", en: "Just after the Big Bang the universe contained almost nothing but the two lightest elements, hydrogen and helium, plus a sprinkle of lithium. No carbon, no oxygen, no iron: none of the ingredients for rocky planets or for life. Every other element was built later, in the universe’s most powerful furnaces: the stars." } },
    { h: { it: "Le fornaci delle stelle", en: "The furnaces of stars" },
      p: { it: "Nel cuore di una stella la pressione e il calore fondono i nuclei leggeri in nuclei più pesanti: idrogeno in elio, poi elio in carbonio e ossigeno. Le stelle grandi vanno avanti fino al ferro, dove la catena si ferma perché fondere il ferro costa energia invece di produrla. Quando le stelle muoiono, soffiando via i loro strati esterni o esplodendo come supernove, spargono questi elementi nello spazio. Da quelle nubi arricchite nascono nuove stelle e nuovi pianeti.", en: "In the heart of a star, pressure and heat fuse light nuclei into heavier ones: hydrogen into helium, then helium into carbon and oxygen. Big stars carry on up to iron, where the chain stops because fusing iron uses up energy instead of releasing it. When stars die, blowing off their outer layers or exploding as supernovae, they scatter these elements into space. From those enriched clouds new stars and new planets are born." } },
    { h: { it: "L’oro delle stelle di neutroni", en: "The gold of neutron stars" },
      p: { it: "Gli elementi più pesanti del ferro, come l’oro, il platino e l’uranio, hanno bisogno di eventi ancora più estremi. Nel 2017 i rivelatori di onde gravitazionali hanno «sentito» lo scontro tra due stelle di neutroni, e i telescopi hanno visto la luce dell’esplosione: conteneva le tracce di elementi pesanti appena creati. Probabilmente gran parte dell’oro sulla Terra è nata così, miliardi di anni prima che esistesse il Sistema solare.", en: "Elements heavier than iron, such as gold, platinum and uranium, need even more extreme events. In 2017 gravitational-wave detectors “heard” a collision between two neutron stars, and telescopes saw the light of the blast: it carried the traces of freshly made heavy elements. Much of the gold on Earth was probably born this way, billions of years before the Solar System existed." } }
  ],
  try: { it: "Fai la lista degli elementi del tuo corpo: ossigeno (il 65% del peso), carbonio, idrogeno, azoto, calcio, fosforo, potassio, ferro… Tranne l’idrogeno, che viene dal Big Bang, sono stati tutti fatti dentro stelle.", en: "List the elements in your body: oxygen (65% of your weight), carbon, hydrogen, nitrogen, calcium, phosphorus, potassium, iron… Apart from hydrogen, which comes from the Big Bang, every one was made inside stars." },
  fact: { it: "L’astronomo Carl Sagan lo disse così: «Siamo un modo in cui il cosmo conosce se stesso». Gli atomi che ora formano i tuoi occhi sono stati dentro stelle prima di guardare le stelle.", en: "The astronomer Carl Sagan put it this way: “We are a way for the cosmos to know itself.” The atoms that now form your eyes were inside stars before they looked at the stars." } }
);
LESSONS.push(
{ id: "cellula", s: "vita",
  t: { it: "La cellula, la fabbrica più piccola", en: "The cell, the smallest factory" },
  k: { it: "Sei fatto di circa 30.000 miliardi di cellule, e ognuna è una città in miniatura che non si ferma mai.", en: "You are made of about 30 trillion cells, and each one is a miniature city that never stops." },
  b: [
    { h: { it: "Il mattone della vita", en: "The building block of life" },
      p: { it: "Ogni essere vivente è fatto di cellule: un batterio è una cellula sola, tu ne hai circa 30.000 miliardi. La maggior parte è troppo piccola per essere vista a occhio nudo, tra un centesimo e un decimo di millimetro. Le prime le vide Robert Hooke nel 1665, guardando un pezzo di sughero al microscopio: le chiamò «cellule» perché gli ricordavano le stanzette dei monaci.", en: "Every living thing is made of cells: a bacterium is a single cell, you have about 30 trillion. Most are too small to see with the naked eye, between a hundredth and a tenth of a millimetre. Robert Hooke saw the first ones in 1665, looking at a piece of cork under a microscope: he called them “cells” because they reminded him of monks’ little rooms." } },
    { h: { it: "Una città in miniatura", en: "A miniature city" },
      p: { it: "Dentro una cellula c’è un mondo organizzato. Il nucleo custodisce il DNA, il libro delle istruzioni. I ribosomi sono le officine che leggono le istruzioni e costruiscono le proteine. I mitocondri sono le centrali elettriche che trasformano il cibo in energia. La membrana è il confine, con porte che decidono cosa entra e cosa esce. E tutto è attraversato da binari su cui minuscoli «motori» trasportano carichi da una parte all’altra.", en: "Inside a cell there is an organised world. The nucleus keeps the DNA, the instruction book. Ribosomes are the workshops that read the instructions and build proteins. Mitochondria are the power stations that turn food into energy. The membrane is the border, with gates deciding what comes in and what goes out. And the whole thing is criss-crossed by tracks along which tiny “motors” carry loads from one place to another." } },
    { h: { it: "Un antico ospite", en: "An ancient guest" },
      p: { it: "I mitocondri hanno un segreto: un loro piccolo DNA personale, diverso da quello del nucleo. Il motivo è sorprendente: circa due miliardi di anni fa erano batteri liberi, inghiottiti da un’altra cellula. Invece di essere digeriti, rimasero dentro e cominciarono a lavorare insieme. Questa alleanza ha reso possibili tutte le piante, i funghi e gli animali. La biologa Lynn Margulis difese questa idea quando quasi nessuno ci credeva.", en: "Mitochondria hold a secret: a small DNA of their own, different from the one in the nucleus. The reason is surprising: about two billion years ago they were free-living bacteria, swallowed by another cell. Instead of being digested, they stayed inside and started working together. That alliance made all plants, fungi and animals possible. The biologist Lynn Margulis defended this idea when almost nobody believed it." } }
  ],
  try: { it: "Se hai una lente d’ingrandimento, guarda la pellicina trasparente che sta tra gli strati di una cipolla: con un piccolo microscopio, anche giocattolo, si vedono le cellule allineate come mattoncini.", en: "If you have a magnifying glass, look at the thin transparent skin between the layers of an onion: with a small microscope, even a toy one, you can see the cells lined up like little bricks." },
  fact: { it: "Ogni secondo il tuo midollo osseo produce circa due milioni e mezzo di globuli rossi nuovi. Mentre leggi questa frase ne hai fatti più di dieci milioni.", en: "Every second, your bone marrow makes about two and a half million new red blood cells. While you were reading this sentence you made more than ten million." } },

{ id: "dna", s: "vita", fig: "dna",
  t: { it: "Il DNA, il libro di istruzioni", en: "DNA, the instruction book" },
  k: { it: "Quattro lettere, tre miliardi di volte. In ogni tua cellula c’è un libro che descrive come costruirti.", en: "Four letters, three billion times over. In every one of your cells there is a book describing how to build you." },
  b: [
    { h: { it: "Un alfabeto di quattro lettere", en: "A four-letter alphabet" },
      p: { it: "Il DNA è una molecola lunghissima, fatta di due filamenti avvolti a spirale come una scala a chiocciola. I gradini sono coppie di quattro basi chimiche, indicate con A, T, C e G, e si accoppiano sempre allo stesso modo: A con T, C con G. L’ordine delle lettere è il messaggio. Il DNA umano ne contiene circa tre miliardi, e una parte di queste sequenze, i geni, dice alla cellula come costruire le proteine.", en: "DNA is an extremely long molecule made of two strands twisted into a spiral like a spiral staircase. The steps are pairs of four chemical bases, written A, T, C and G, and they always pair the same way: A with T, C with G. The order of the letters is the message. Human DNA contains about three billion of them, and some of these sequences, the genes, tell the cell how to build proteins." } },
    { h: { it: "Due metri in ogni cellula", en: "Two metres in every cell" },
      p: { it: "Se srotolassi il DNA di una sola delle tue cellule, sarebbe lungo circa due metri. Eppure sta in un nucleo di pochi millesimi di millimetro, avvolto con un ordine incredibile intorno a rocchetti di proteine. Mettendo in fila il DNA di tutte le cellule del tuo corpo che lo contengono, potresti andare più o meno fino a Plutone e tornare indietro. Ogni volta che una cellula si divide, copia tutto, con pochissimi errori.", en: "If you unwound the DNA of just one of your cells, it would be about two metres long. Yet it fits inside a nucleus a few thousandths of a millimetre across, wound with incredible order around spools of protein. Lining up the DNA of all the cells in your body that contain it, you could travel roughly to Pluto and back. Every time a cell divides it copies the whole thing, with very few mistakes." } },
    { h: { it: "La foto 51", en: "Photo 51" },
      p: { it: "Nel 1953 James Watson e Francis Crick capirono che il DNA è una doppia elica. Ma la prova decisiva veniva da un’immagine ai raggi X, la «foto 51», ottenuta nel laboratorio di Rosalind Franklin, una chimica bravissima, dal suo studente Raymond Gosling. Watson la vide senza che lei lo sapesse. Franklin morì giovane, nel 1958, e non ricevette il Nobel; oggi è ricordata come una delle grandi scienziate del Novecento.", en: "In 1953 James Watson and Francis Crick worked out that DNA is a double helix. But the decisive evidence came from an X-ray image, “Photo 51”, taken in the laboratory of Rosalind Franklin, a brilliant chemist, by her student Raymond Gosling. Watson saw it without her knowing. Franklin died young, in 1958, and did not receive the Nobel Prize; today she is remembered as one of the great scientists of the twentieth century." } }
  ],
  try: { it: "Scrivi un filamento di DNA inventato, per esempio ATTGCAC, e prova a scrivere sotto il filamento compagno seguendo le regole A-T e C-G. È esattamente quello che fa la cellula quando copia il DNA.", en: "Write a made-up strand of DNA, for example ATTGCAC, and try writing its partner strand underneath, following the A-T and C-G rules. That is exactly what a cell does when it copies DNA." },
  fact: { it: "Due esseri umani qualsiasi hanno il DNA uguale per circa il 99,9%. Tutte le differenze tra le persone, dal colore degli occhi all’altezza, stanno in quel piccolo 0,1%, insieme all’ambiente e alla vita di ciascuno.", en: "Any two human beings share about 99.9% of their DNA. All the differences between people, from eye colour to height, lie in that tiny 0.1%, together with each person’s environment and life." } },

{ id: "evoluzione", s: "vita",
  t: { it: "L’evoluzione: come cambiano le specie", en: "Evolution: how species change" },
  k: { it: "Nessuno progetta le giraffe o i colibrì. Bastano differenze, eredità e tantissimo tempo.", en: "Nobody designs giraffes or hummingbirds. Differences, inheritance and an enormous amount of time are enough." },
  b: [
    { h: { it: "L’idea di Darwin", en: "Darwin’s idea" },
      p: { it: "Nel 1859 Charles Darwin pubblicò L’origine delle specie. L’idea è semplice e potentissima. Gli individui di una specie non sono tutti uguali; molte differenze si ereditano dai genitori; nascono più piccoli di quanti ne possano sopravvivere. Chi ha caratteristiche un po’ più adatte all’ambiente ha più probabilità di sopravvivere e avere figli. Generazione dopo generazione, quelle caratteristiche diventano più comuni. Si chiama selezione naturale.", en: "In 1859 Charles Darwin published On the Origin of Species. The idea is simple and very powerful. Individuals of a species are not all the same; many differences are inherited from parents; more young are born than can survive. Those with features slightly better suited to their environment are more likely to survive and have offspring. Generation after generation, those features become more common. This is called natural selection." } },
    { h: { it: "L’evoluzione si può vedere", en: "You can watch evolution happen" },
      p: { it: "Alle Galápagos i biologi Peter e Rosemary Grant hanno studiato i fringuelli per decenni. Dopo la siccità del 1977 restavano solo semi grossi e duri: sopravvissero soprattutto gli uccelli con il becco più robusto, e già la generazione successiva aveva becchi più grandi in media. Lo vediamo anche nei batteri: usando male gli antibiotici selezioniamo quelli resistenti, che poi si moltiplicano. È uno dei problemi più seri della medicina di oggi.", en: "In the Galápagos, biologists Peter and Rosemary Grant studied finches for decades. After the 1977 drought only large, hard seeds were left: mostly the birds with sturdier beaks survived, and the very next generation had bigger beaks on average. We see it in bacteria too: by misusing antibiotics we select the resistant ones, which then multiply. It is one of the most serious problems in medicine today." } },
    { h: { it: "Le balene che camminavano", en: "The whales that walked" },
      p: { it: "Con milioni di anni, tanti piccoli cambiamenti producono differenze enormi. I fossili raccontano che gli antenati delle balene, circa 50 milioni di anni fa, erano mammiferi a quattro zampe che vivevano sulla terraferma e andavano a caccia vicino all’acqua. Alcune balene di oggi hanno ancora dentro il corpo piccole ossa del bacino, un ricordo delle zampe perdute. E tutti i viventi, dai funghi a noi, condividono lo stesso codice genetico: siamo tutti lontani parenti.", en: "Over millions of years, many small changes add up to enormous differences. Fossils show that the ancestors of whales, about 50 million years ago, were four-legged mammals living on land and hunting near the water. Some whales today still have small pelvic bones inside their bodies, a reminder of the lost legs. And all living things, from fungi to us, share the same genetic code: we are all distant relatives." } }
  ],
  try: { it: "Gioca con i fagioli: spargi su un tappeto colorato fagioli di due colori, uno che si mimetizza e uno che si vede. Un amico ne raccoglie velocemente dieci, come un uccello affamato. Quali restano di più? Ripeti «riproducendo» i sopravvissuti: hai simulato la selezione naturale.", en: "Play with beans: scatter beans of two colours on a patterned rug, one that blends in and one that stands out. A friend quickly picks up ten, like a hungry bird. Which ones are left? Repeat, “breeding” the survivors: you have simulated natural selection." },
  fact: { it: "Darwin aspettò più di vent’anni prima di pubblicare la sua teoria. Si decise quando scoprì che un altro naturalista, Alfred Russel Wallace, era arrivato da solo alla stessa idea: nel 1858 presentarono i loro lavori insieme.", en: "Darwin waited more than twenty years before publishing his theory. He made up his mind when he learned that another naturalist, Alfred Russel Wallace, had reached the same idea on his own: in 1858 they presented their work together." } },

{ id: "microbi", s: "vita",
  t: { it: "Il mondo invisibile dentro di noi", en: "The invisible world inside us" },
  k: { it: "Dentro e sopra di te vivono più batteri di quante cellule hai. E quasi tutti lavorano per te.", en: "More bacteria live in and on you than you have cells. And almost all of them work for you." },
  b: [
    { h: { it: "Un ecosistema che cammina", en: "A walking ecosystem" },
      p: { it: "Il tuo corpo ospita circa 38.000 miliardi di batteri, più o meno quanti sono le tue cellule. Sono molto più piccoli, e in tutto pesano circa due etti. Vivono soprattutto nell’intestino, ma anche sulla pelle, in bocca e nel naso, insieme a funghi e virus. Questo insieme si chiama microbiota, e ogni persona ha il suo, diverso da quello di chiunque altro.", en: "Your body hosts about 38 trillion bacteria, roughly as many as your own cells. They are much smaller, and together they weigh about 200 grams. They live mostly in the gut, but also on your skin, in your mouth and nose, along with fungi and viruses. This community is called the microbiota, and every person has their own, different from anyone else’s." } },
    { h: { it: "Lavorano per noi", en: "They work for us" },
      p: { it: "I batteri dell’intestino digeriscono fibre che noi da soli non riusciremmo a scomporre e producono vitamine come la K e alcune del gruppo B. Occupano lo spazio e il cibo che servirebbero ai microbi pericolosi, tenendoli lontani. Allenano il sistema immunitario a riconoscere amici e nemici. Gli scienziati stanno scoprendo legami tra il microbiota e molte cose, dalla digestione all’umore.", en: "Gut bacteria digest fibres we could not break down on our own and make vitamins such as K and some B vitamins. They take up the space and food that dangerous microbes would need, keeping them away. They train the immune system to recognise friends and enemies. Scientists are discovering links between the microbiota and many things, from digestion to mood." } },
    { h: { it: "Chi li ha visti per primo", en: "Who saw them first" },
      p: { it: "Il primo a vedere i batteri fu un commerciante di stoffe olandese, Antoni van Leeuwenhoek, verso il 1676. Costruiva da solo minuscoli microscopi con una sola lente, più potenti di tutti quelli dell’epoca. In acqua stagnante e, qualche anno dopo, nella placca dei suoi denti vide «animaletti» che si muovevano, e ne scrisse alla Royal Society di Londra. Due secoli dopo Louis Pasteur e Robert Koch dimostrarono che alcuni microbi causano malattie, e la medicina cambiò per sempre.", en: "The first person to see bacteria was a Dutch cloth merchant, Antonie van Leeuwenhoek, around 1676. He built tiny single-lens microscopes himself, more powerful than any others of the time. In stagnant water and, a few years later, in the plaque on his teeth he saw moving “little animals”, and wrote about them to the Royal Society in London. Two centuries later Louis Pasteur and Robert Koch showed that some microbes cause diseases, and medicine changed for ever." } }
  ],
  try: { it: "Esperimento del pane: con un adulto, metti una fetta di pane in un sacchetto chiuso dopo averla toccata con le mani non lavate, e un’altra dopo esserti lavato bene le mani. Lasciale una settimana e guarda dove cresce più muffa. Poi butta i sacchetti senza aprirli.", en: "The bread experiment: with an adult, put one slice of bread into a sealed bag after touching it with unwashed hands, and another after washing your hands well. Leave them for a week and see where more mould grows. Then throw the bags away without opening them." },
  fact: { it: "Nella tua bocca vivono circa 700 specie diverse di batteri. Una persona può portare nell’intestino centinaia di specie, e la loro composizione cambia con quello che mangia.", en: "About 700 different species of bacteria live in your mouth. A person can carry hundreds of species in the gut, and their mix changes with what that person eats." } },

{ id: "fotosintesi", s: "vita",
  t: { it: "La fotosintesi: mangiare la luce", en: "Photosynthesis: eating light" },
  k: { it: "Un albero è fatto soprattutto di aria. Sembra impossibile, ma è così.", en: "A tree is made mostly of air. It sounds impossible, but it is true." },
  b: [
    { h: { it: "La ricetta delle foglie", en: "The recipe of leaves" },
      p: { it: "Le piante fanno una cosa che noi non sappiamo fare: costruiscono il proprio cibo dalla luce. Nelle foglie, la clorofilla cattura la luce del Sole e usa la sua energia per combinare l’anidride carbonica dell’aria con l’acqua presa dalle radici. Il risultato è zucchero, che dà energia e materiale per crescere, e ossigeno, che esce dalle foglie. Quasi tutta la vita sulla Terra dipende da questa ricetta.", en: "Plants do something we cannot: they make their own food from light. In leaves, chlorophyll captures sunlight and uses its energy to combine carbon dioxide from the air with water drawn up by the roots. The result is sugar, which provides energy and material for growth, and oxygen, which leaves through the leaves. Almost all life on Earth depends on this recipe." } },
    { h: { it: "Perché le foglie sono verdi", en: "Why leaves are green" },
      p: { it: "La clorofilla assorbe soprattutto la luce rossa e quella blu e ne usa l’energia. La luce verde invece la usa poco e in gran parte la rimanda indietro: per questo vediamo le foglie verdi. In autunno, quando molti alberi smettono di produrre clorofilla, emergono altri pigmenti che c’erano già, gialli e arancioni, e se ne formano di rossi. Ecco i colori dell’autunno.", en: "Chlorophyll absorbs mostly red and blue light and uses its energy. Green light, on the other hand, it uses little and largely sends back: that is why we see leaves as green. In autumn, when many trees stop making chlorophyll, other pigments that were already there show through, yellow and orange, and red ones are made. Those are the colours of autumn." } },
    { h: { it: "Il salice di van Helmont", en: "Van Helmont’s willow" },
      p: { it: "Nel Seicento il medico Jan Baptist van Helmont piantò un salicino in un vaso con terra pesata e per cinque anni lo innaffiò soltanto. Il salice crebbe di oltre 70 chili, ma la terra era calata solo di una sessantina di grammi. Lui concluse che il legno veniva dall’acqua. Aveva quasi ragione: oggi sappiamo che la maggior parte della massa di una pianta viene dal carbonio dell’anidride carbonica dell’aria. Il legno è aria solidificata dalla luce.", en: "In the 1600s the physician Jan Baptist van Helmont planted a willow sapling in a pot of weighed soil and for five years gave it nothing but water. The willow gained over 70 kilos, but the soil had lost only about sixty grams. He concluded that the wood came from the water. He was nearly right: today we know most of a plant’s mass comes from the carbon in the air’s carbon dioxide. Wood is air turned solid by light." } }
  ],
  try: { it: "Metti una foglia appena staccata in un bicchiere d’acqua al sole, per qualche ora. Guarda bene: sulla foglia compariranno minuscole bollicine. Sono ossigeno prodotto dalla fotosintesi.", en: "Put a freshly picked leaf in a glass of water in the sun for a few hours. Look closely: tiny bubbles will appear on the leaf. That is oxygen made by photosynthesis." },
  fact: { it: "Circa metà dell’ossigeno che respiriamo non viene dalle foreste ma dal mare, prodotto da alghe microscopiche chiamate fitoplancton.", en: "About half the oxygen we breathe comes not from forests but from the sea, made by microscopic algae called phytoplankton." } },

{ id: "cervello", s: "vita",
  t: { it: "Il cervello: 86 miliardi di neuroni", en: "The brain: 86 billion neurons" },
  k: { it: "Pesa circa un chilo e trecento grammi e consuma un quinto della tua energia. E ogni volta che impari qualcosa, cambia forma.", en: "It weighs about one point three kilos and uses a fifth of your energy. And every time you learn something, it changes shape." },
  b: [
    { h: { it: "Una rete gigantesca", en: "A gigantic network" },
      p: { it: "Il cervello umano contiene circa 86 miliardi di neuroni, cellule specializzate nel trasmettere segnali. Ogni neurone si collega a migliaia di altri attraverso le sinapsi: in tutto sono forse centomila miliardi di collegamenti. I segnali corrono lungo i neuroni come impulsi elettrici, fino a oltre 100 metri al secondo, e passano da un neurone all’altro con messaggeri chimici.", en: "The human brain contains about 86 billion neurons, cells specialised in carrying signals. Each neuron connects to thousands of others through synapses: perhaps a hundred trillion connections in all. Signals race along neurons as electrical pulses, at over 100 metres per second, and pass from one neuron to the next by means of chemical messengers." } },
    { h: { it: "Affamato di energia", en: "Hungry for energy" },
      p: { it: "Il cervello è circa il 2% del peso del corpo ma usa circa il 20% della sua energia, anche quando dormi. Non sta mai spento: di notte, durante il sonno, riordina i ricordi della giornata, rafforza quelli importanti e fa pulizia. Per questo dormire bene aiuta davvero a studiare: dopo una notte di sonno si ricorda meglio quello che si è imparato il giorno prima.", en: "The brain is about 2% of your body weight but uses about 20% of its energy, even while you sleep. It is never switched off: at night, during sleep, it sorts the day’s memories, strengthens the important ones and does some cleaning. That is why good sleep really does help studying: after a night’s sleep you remember better what you learned the day before." } },
    { h: { it: "Un organo che si rimodella", en: "An organ that reshapes itself" },
      p: { it: "Ogni volta che impari qualcosa, alcune sinapsi si rafforzano e altre si indeboliscono: il cervello cambia fisicamente. Si chiama plasticità. I tassisti di Londra, che devono imparare a memoria migliaia di strade, hanno mostrato cambiamenti nell’ippocampo, una zona legata alla memoria dei luoghi. Lo stesso vale per chi impara uno strumento o una lingua. Il cervello non è una cosa fissa: è un allenamento continuo.", en: "Every time you learn something, some synapses get stronger and others weaker: the brain physically changes. This is called plasticity. London taxi drivers, who must learn thousands of streets by heart, showed changes in the hippocampus, an area linked to memory for places. The same goes for anyone learning an instrument or a language. The brain is not fixed: it is continuous training." } }
  ],
  try: { it: "Prova l’effetto Stroop: scrivi i nomi dei colori con pennarelli del colore sbagliato (la parola ROSSO in blu, VERDE in giallo…) e prova a dire ad alta voce il colore dell’inchiostro, non la parola. È difficile, perché il cervello legge in automatico.", en: "Try the Stroop effect: write colour names with felt pens of the wrong colour (the word RED in blue, GREEN in yellow…) and try to say out loud the colour of the ink, not the word. It is hard, because your brain reads automatically." },
  fact: { it: "Il cervello non ha recettori del dolore al suo interno. Per questo, in certi interventi, i chirurghi operano con il paziente sveglio e gli chiedono di parlare o muoversi, per non toccare le zone importanti.", en: "The brain has no pain receptors of its own. That is why, in some operations, surgeons work with the patient awake and ask them to talk or move, so as to avoid important areas." } },

{ id: "tardigradi", s: "vita",
  t: { it: "Tardigradi, gli animali indistruttibili", en: "Tardigrades, the indestructible animals" },
  k: { it: "Mezzo millimetro, otto zampette e il record di resistenza: sopravvivono al vuoto dello spazio.", en: "Half a millimetre, eight stubby legs and a record for toughness: they survive the vacuum of space." },
  b: [
    { h: { it: "Gli orsetti d’acqua", en: "Water bears" },
      p: { it: "I tardigradi sono animali minuscoli, di solito meno di un millimetro, con un corpo paffuto e otto zampe con piccoli artigli. Camminano lentamente, da cui il nome che vuol dire «passo lento», e in inglese li chiamano «orsetti d’acqua». Ne esistono più di mille specie e vivono quasi ovunque: nel muschio dei muri, nei licheni, nei fondali marini, sulle montagne himalayane e in Antartide.", en: "Tardigrades are tiny animals, usually less than a millimetre long, with a chubby body and eight legs ending in little claws. They walk slowly, hence their name, meaning “slow stepper”, and in English they are called “water bears”. There are more than a thousand species and they live almost everywhere: in the moss on walls, in lichens, on the sea floor, on Himalayan mountains and in Antarctica." } },
    { h: { it: "Il trucco del barilotto", en: "The barrel trick" },
      p: { it: "Quando l’ambiente diventa troppo secco, un tardigrado ritira le zampe, perde quasi tutta l’acqua e si accartoccia in un barilotto chiamato «tun». Il suo metabolismo quasi si ferma, e speciali proteine proteggono le cellule come un vetro. In questo stato può resistere per anni. Ha sopportato temperature vicine allo zero assoluto, un freddo di quasi −272 °C, e per pochi minuti un caldo di oltre 150 °C, radiazioni centinaia di volte più forti di quelle mortali per noi e pressioni sei volte più alte di quelle degli abissi.", en: "When its surroundings get too dry, a tardigrade pulls in its legs, loses almost all its water and curls into a little barrel called a “tun”. Its metabolism nearly stops, and special proteins protect its cells like glass. In this state it can last for years. It has survived temperatures close to absolute zero, a cold of almost −272 °C, and for a few minutes a heat of over 150 °C, radiation hundreds of times stronger than the lethal dose for us, and pressures six times higher than those of the deepest ocean." } },
    { h: { it: "Astronauti a otto zampe", en: "Eight-legged astronauts" },
      p: { it: "Nel 2007 alcuni tardigradi secchi furono portati in orbita sul satellite europeo FOTON-M3 e lasciati per dieci giorni esposti al vuoto e alle radiazioni dello spazio. Riportati a terra e bagnati, molti tornarono a muoversi e alcuni fecero perfino le uova. Sono stati i primi animali a sopravvivere all’esposizione diretta allo spazio. Non sono immortali, però: da svegli sono delicati come qualunque animaletto.", en: "In 2007 some dried tardigrades were taken into orbit on the European satellite FOTON-M3 and left exposed to the vacuum and radiation of space for ten days. Brought back and wetted, many started moving again and some even laid eggs. They were the first animals to survive direct exposure to space. They are not immortal, though: when active they are as delicate as any little creature." } }
  ],
  try: { it: "Raccogli un ciuffo di muschio secco da un muro, mettilo in un piattino con un po’ d’acqua per una notte, poi strizzalo in un altro piattino. Con un microscopio, anche semplice, e un po’ di pazienza, potresti vedere un tardigrado che cammina.", en: "Collect a clump of dry moss from a wall, soak it in a saucer of water overnight, then squeeze it into another saucer. With a microscope, even a simple one, and some patience, you might spot a tardigrade walking." },
  fact: { it: "Nel 2019 il lander israeliano Beresheet, che trasportava anche tardigradi disidratati, si è schiantato sulla Luna. Probabilmente sono ancora lì, nel loro barilotto, anche se senz’acqua non potranno mai risvegliarsi.", en: "In 2019 the Israeli lander Beresheet, which was also carrying dehydrated tardigrades, crashed on the Moon. They are probably still there in their barrels, though without water they can never wake up." } }
);
LESSONS.push(
{ id: "stelle", s: "spazio", fig: "stars", go: { v: "solar", id: "sun" },
  t: { it: "Vita e morte di una stella", en: "The life and death of a star" },
  k: { it: "Le stelle nascono, vivono miliardi di anni e muoiono. Come finiscono dipende da una cosa sola: quanto sono grandi.", en: "Stars are born, live for billions of years and die. How they end depends on one thing only: how big they are." },
  b: [
    { h: { it: "Nascere da una nuvola", en: "Born from a cloud" },
      p: { it: "Una stella nasce in una nube di gas e polvere, una nebulosa. Se una zona della nube diventa abbastanza densa, la gravità la fa collassare: il gas si stringe, si scalda, e al centro la temperatura sale a milioni di gradi. Quando l’idrogeno comincia a fondersi in elio, la stella si accende. Per gran parte della sua vita resterà in equilibrio: la gravità che schiaccia verso l’interno e l’energia delle fusioni che spinge verso l’esterno.", en: "A star is born in a cloud of gas and dust, a nebula. If one region of the cloud becomes dense enough, gravity makes it collapse: the gas squeezes together, heats up, and at the centre the temperature climbs to millions of degrees. When hydrogen starts fusing into helium, the star switches on. For most of its life it stays in balance: gravity squeezing inwards and the energy from fusion pushing outwards." } },
    { h: { it: "Il destino del Sole", en: "The Sun’s fate" },
      p: { it: "Il Sole ha circa 4,6 miliardi di anni ed è più o meno a metà della sua vita. Tra circa 5 miliardi di anni avrà consumato l’idrogeno del centro e si gonfierà in una gigante rossa, così grande da inghiottire probabilmente Mercurio e Venere. Poi soffierà via i suoi strati esterni in una nebulosa colorata e al centro resterà una nana bianca: un nucleo caldissimo grande come la Terra, che si raffredderà lentamente per miliardi di anni.", en: "The Sun is about 4.6 billion years old and roughly halfway through its life. In about 5 billion years it will have used up the hydrogen at its centre and will swell into a red giant, big enough probably to swallow Mercury and Venus. Then it will blow away its outer layers into a colourful nebula, leaving a white dwarf at the centre: an extremely hot core the size of the Earth, cooling slowly for billions of years." } },
    { h: { it: "Le stelle giganti muoiono esplodendo", en: "Giant stars die in explosions" },
