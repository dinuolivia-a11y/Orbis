      p: { it: "Le stelle con più di circa otto volte la massa del Sole vivono molto più in fretta: poche decine di milioni di anni, o anche meno. Alla fine il loro nucleo crolla in un istante e la stella esplode come supernova, brillando per settimane più di un’intera galassia. Al centro resta una stella di neutroni, una palla di 20 chilometri così densa che un cucchiaino del suo materiale peserebbe miliardi di tonnellate. Se la stella era enorme, resta un buco nero.", en: "Stars with more than about eight times the Sun’s mass live much faster: a few tens of millions of years, or even less. In the end their core collapses in an instant and the star explodes as a supernova, outshining an entire galaxy for weeks. Left at the centre is a neutron star, a ball 20 kilometres across so dense that a teaspoon of its material would weigh billions of tonnes. If the star was enormous, a black hole is left instead." } }
  ],
  try: { it: "In una notte serena guarda la costellazione di Orione: la stella rossa in alto a sinistra è Betelgeuse, una supergigante rossa vicina alla fine. Prima o poi esploderà, forse tra centomila anni, e per qualche settimana si vedrà anche di giorno.", en: "On a clear night, look at the constellation of Orion: the red star at the top left is Betelgeuse, a red supergiant near the end of its life. One day it will explode, perhaps within a hundred thousand years, and for a few weeks it will be visible even by day." },
  fact: { it: "Nel 1054 astronomi cinesi videro una «stella ospite» così luminosa da essere visibile di giorno per 23 giorni. Era una supernova: i suoi resti sono la Nebulosa del Granchio, con una stella di neutroni al centro che gira su se stessa 30 volte al secondo.", en: "In 1054 Chinese astronomers saw a “guest star” so bright it was visible in daylight for 23 days. It was a supernova: its remains are the Crab Nebula, with a neutron star at its centre spinning 30 times a second." } },

{ id: "buchi-neri", s: "spazio", go: { v: "galaxies", id: "m87" },
  t: { it: "I buchi neri", en: "Black holes" },
  k: { it: "Un posto dove la gravità è così forte che nemmeno la luce può uscire. E nel 2019 ne abbiamo visto l’ombra.", en: "A place where gravity is so strong that not even light can escape. And in 2019 we saw its shadow." },
  b: [
    { h: { it: "Troppa massa in troppo poco spazio", en: "Too much mass in too little space" },
      p: { it: "Per lasciare la Terra un razzo deve andare a più di 11 chilometri al secondo. Più un oggetto è massiccio e compatto, più questa velocità di fuga aumenta. Se schiacci abbastanza massa in uno spazio abbastanza piccolo, la velocità di fuga supera quella della luce: nulla può più uscire. È un buco nero. Il suo confine, oltre il quale non si torna indietro, si chiama orizzonte degli eventi.", en: "To leave the Earth, a rocket must travel at more than 11 kilometres per second. The more massive and compact an object is, the higher this escape speed. Squeeze enough mass into a small enough space and the escape speed exceeds the speed of light: nothing can get out any more. That is a black hole. Its boundary, beyond which there is no return, is called the event horizon." } },
    { h: { it: "Vicino a un buco nero", en: "Near a black hole" },
      p: { it: "Vicino a un buco nero succedono cose strane. Il tempo rallenta: chi ti guarda da lontano ti vedrebbe muovere sempre più piano mentre ti avvicini all’orizzonte. La gravità tira molto più forte i piedi della testa, e un oggetto che cade viene stirato come uno spaghetto: gli scienziati lo chiamano davvero «spaghettificazione». Il gas che ci gira intorno si scalda a milioni di gradi e brilla: per questo molti buchi neri sono, paradossalmente, tra gli oggetti più luminosi dell’universo.", en: "Strange things happen near a black hole. Time slows down: someone watching from far away would see you move ever more slowly as you neared the horizon. Gravity pulls much harder on your feet than on your head, and a falling object gets stretched like a strand of spaghetti: scientists really do call it “spaghettification”. Gas swirling around it heats up to millions of degrees and glows: that is why many black holes are, paradoxically, among the brightest objects in the universe." } },
    { h: { it: "La prima foto", en: "The first picture" },
      p: { it: "Nel 2019 l’Event Horizon Telescope, una rete di radiotelescopi sparsi per il pianeta che funzionano come un unico telescopio grande quanto la Terra, ha mostrato la prima immagine di un buco nero: quello al centro della galassia M87, con una massa di 6,5 miliardi di Soli. Si vede un anello di luce intorno a un’ombra scura. Nel 2022 è arrivata la foto di Sagittarius A*, il buco nero al centro della nostra Via Lattea, di circa 4 milioni di masse solari.", en: "In 2019 the Event Horizon Telescope, a network of radio telescopes spread across the planet working as a single telescope the size of the Earth, revealed the first image of a black hole: the one at the centre of the galaxy M87, with a mass of 6.5 billion Suns. It shows a ring of light around a dark shadow. In 2022 came the picture of Sagittarius A*, the black hole at the centre of our Milky Way, about 4 million solar masses." } }
  ],
  try: { it: "Apri M87 in Orbis e guarda la foto vera dell’anello. Pensa: quella luce è partita 55 milioni di anni fa, circa dieci milioni di anni dopo la scomparsa dei dinosauri.", en: "Open M87 in Orbis and look at the real photo of the ring. Think: that light set off 55 million years ago, about ten million years after the dinosaurs disappeared." },
  fact: { it: "Se il Sole diventasse un buco nero con la stessa massa (non succederà, è troppo piccolo), sarebbe largo solo 6 chilometri, e la Terra continuerebbe a girargli intorno esattamente come oggi. Solo, al buio.", en: "If the Sun became a black hole with the same mass (it won’t, it is too small), it would be only 6 kilometres across, and the Earth would keep orbiting it exactly as it does today. Just in the dark." } },

{ id: "big-bang", s: "spazio",
  t: { it: "Il Big Bang e l’universo che si allarga", en: "The Big Bang and the expanding universe" },
  k: { it: "Non fu un’esplosione nello spazio: fu lo spazio stesso che cominciò ad allargarsi, 13,8 miliardi di anni fa.", en: "It was not an explosion in space: it was space itself beginning to stretch, 13.8 billion years ago." },
  b: [
    { h: { it: "Le galassie si allontanano", en: "Galaxies are moving apart" },
      p: { it: "Negli anni Venti del Novecento Georges Lemaître ed Edwin Hubble scoprirono che le galassie lontane si allontanano da noi, e più sono lontane più vanno veloci. Non perché noi siamo al centro: è lo spazio tra le galassie che si allarga. Immagina un panettone con l’uvetta che lievita: ogni uvetta vede tutte le altre allontanarsi, e quelle lontane si allontanano più in fretta.", en: "In the 1920s Georges Lemaître and Edwin Hubble discovered that distant galaxies are moving away from us, and the farther they are, the faster they go. Not because we are at the centre: it is the space between galaxies that is stretching. Picture a raisin loaf rising in the oven: every raisin sees all the others moving away, and the distant ones move away faster." } },
    { h: { it: "Tornare indietro nel tempo", en: "Running the film backwards" },
      p: { it: "Se l’universo si allarga, in passato era più piccolo, più denso e più caldo. Riavvolgendo il film si arriva a un istante, circa 13,8 miliardi di anni fa, in cui tutto era compresso in uno stato caldissimo: è il Big Bang. Nei primi minuti si formarono i nuclei di idrogeno ed elio. Ci vollero centinaia di milioni di anni perché nascessero le prime stelle e galassie.", en: "If the universe is expanding, in the past it was smaller, denser and hotter. Rewinding the film takes you to a moment, about 13.8 billion years ago, when everything was squeezed into an extremely hot state: the Big Bang. In the first few minutes the nuclei of hydrogen and helium formed. It took hundreds of millions of years for the first stars and galaxies to be born." } },
    { h: { it: "L’eco del Big Bang", en: "The echo of the Big Bang" },
      p: { it: "Circa 380.000 anni dopo l’inizio, l’universo si raffreddò abbastanza da diventare trasparente, e la luce di quel momento viaggia ancora ovunque. Con l’espansione si è stirata fino a diventare microonde deboli: la radiazione cosmica di fondo. La scoprirono per caso nel 1965 Arno Penzias e Robert Wilson, che sentivano un fruscio nella loro antenna e pensarono fosse colpa dei piccioni che ci facevano il nido. Era l’eco del Big Bang, e vinsero il Nobel.", en: "About 380,000 years after the beginning, the universe cooled enough to become transparent, and the light from that moment still travels everywhere. As space expanded it was stretched into faint microwaves: the cosmic microwave background. Arno Penzias and Robert Wilson found it by accident in 1965, when they heard a hiss in their antenna and blamed the pigeons nesting in it. It was the echo of the Big Bang, and they won the Nobel Prize." } }
  ],
  try: { it: "Disegna dei puntini su un palloncino sgonfio, poi gonfialo piano. Ogni puntino si allontana da tutti gli altri, e nessuno è al centro: è così che si espande l’universo (solo che lui non ha un «fuori»).", en: "Draw dots on a deflated balloon, then blow it up slowly. Every dot moves away from all the others, and none is at the centre: that is how the universe expands (except it has no “outside”)." },
  fact: { it: "Georges Lemaître, che per primo propose l’idea di un universo nato da un «atomo primitivo», era un prete cattolico belga oltre che un fisico. Einstein all’inizio non era convinto, poi cambiò idea.", en: "Georges Lemaître, the first to propose a universe born from a “primeval atom”, was a Belgian Catholic priest as well as a physicist. Einstein was not convinced at first, but later changed his mind." } },

{ id: "materia-oscura", s: "spazio",
  t: { it: "Materia oscura ed energia oscura", en: "Dark matter and dark energy" },
  k: { it: "Tutto quello che vediamo, stelle, pianeti, persone, è appena il 5% dell’universo. Il resto è un mistero.", en: "Everything we can see, stars, planets, people, is just 5% of the universe. The rest is a mystery." },
  b: [
    { h: { it: "Galassie che girano troppo in fretta", en: "Galaxies spinning too fast" },
      p: { it: "Negli anni Settanta l’astronoma Vera Rubin misurò quanto velocemente girano le stelle ai bordi delle galassie. Secondo la gravità della materia visibile, avrebbero dovuto andare più piano e anzi volare via, come i bambini su una giostra troppo veloce. Invece giravano veloci quanto quelle interne. L’unica spiegazione era che ci fosse molta più massa, invisibile: la materia oscura. Già nel 1933 Fritz Zwicky aveva notato qualcosa di simile negli ammassi di galassie.", en: "In the 1970s the astronomer Vera Rubin measured how fast stars orbit at the edges of galaxies. According to the gravity of the visible matter, they should have moved more slowly, and indeed flown off, like children on a merry-go-round spinning too fast. Instead they moved as fast as the inner ones. The only explanation was that there must be much more mass, invisible: dark matter. As early as 1933 Fritz Zwicky had noticed something similar in clusters of galaxies." } },
    { h: { it: "Che cos’è? Non lo sappiamo", en: "What is it? We don’t know" },
      p: { it: "La materia oscura non brilla, non assorbe la luce e non urta la materia normale: si fa sentire solo con la gravità. Piega la luce delle galassie lontane come una lente, e senza di lei le galassie non avrebbero avuto abbastanza «colla» per formarsi. Probabilmente è fatta di particelle che non conosciamo ancora. Gli scienziati le cercano con rivelatori sotto le montagne, come ai Laboratori del Gran Sasso, e negli acceleratori, ma finora senza trovarle.", en: "Dark matter does not shine, does not absorb light and does not collide with ordinary matter: it makes itself felt only through gravity. It bends the light of distant galaxies like a lens, and without it galaxies would not have had enough “glue” to form. It is probably made of particles we do not yet know. Scientists hunt for them with detectors deep under mountains, as at Italy’s Gran Sasso Laboratories, and in particle accelerators, but so far without finding them." } },
    { h: { it: "L’energia oscura", en: "Dark energy" },
      p: { it: "Nel 1998 due gruppi di astronomi, studiando supernove lontane, scoprirono che l’espansione dell’universo non sta rallentando, come tutti si aspettavano, ma accelerando. Qualcosa spinge lo spazio ad allargarsi sempre più in fretta: lo chiamiamo energia oscura. Facendo i conti, l’universo è circa il 68% energia oscura, il 27% materia oscura e solo il 5% materia normale. Il 95% del cosmo è ancora da capire.", en: "In 1998 two teams of astronomers studying distant supernovae discovered that the expansion of the universe is not slowing down, as everyone expected, but speeding up. Something is pushing space to stretch ever faster: we call it dark energy. Adding it all up, the universe is about 68% dark energy, 27% dark matter and only 5% ordinary matter. Ninety-five per cent of the cosmos is still to be understood." } }
  ],
  try: { it: "Fai girare un secchiello con un po’ d’acqua tenendolo per il manico: più giri veloce, più forte devi tenerlo. Le galassie fanno lo stesso: per tenere insieme stelle così veloci serve molta più «presa», cioè gravità, di quella della materia che vediamo.", en: "Swing a small bucket with a little water in it by the handle: the faster you swing, the harder you must hold on. Galaxies are the same: holding together such fast stars needs far more “grip”, meaning gravity, than the visible matter provides." },
  fact: { it: "In Cile c’è un grande telescopio intitolato a Vera Rubin, l’Osservatorio Vera C. Rubin, che dal 2025 fotografa tutto il cielo australe ogni poche notti per una decina d’anni.", en: "In Chile there is a large telescope named after Vera Rubin, the Vera C. Rubin Observatory, which since 2025 has been photographing the whole southern sky every few nights, for a decade-long survey." } },

{ id: "stagioni", s: "spazio", fig: "seasons", go: { v: "solar", id: "earth" },
  t: { it: "Perché ci sono le stagioni", en: "Why there are seasons" },
  k: { it: "Molti pensano che d’estate la Terra sia più vicina al Sole. Invece ci è più vicina a gennaio.", en: "Many people think the Earth is closer to the Sun in summer. In fact it is closest in January." },
  b: [
    { h: { it: "Un’idea sbagliata molto diffusa", en: "A very common mistake" },
      p: { it: "L’orbita della Terra è quasi un cerchio: la distanza dal Sole cambia solo del 3% durante l’anno. E il punto più vicino lo raggiungiamo all’inizio di gennaio, in pieno inverno per noi. Se le stagioni dipendessero dalla distanza, poi, sarebbe estate nello stesso momento in tutto il pianeta. Invece quando in Italia è estate, in Australia e in Argentina è inverno. La vera causa è un’altra.", en: "The Earth’s orbit is almost a circle: the distance from the Sun changes by only 3% during the year. And we reach the closest point in early January, in the middle of winter for us. Besides, if seasons depended on distance, it would be summer at the same time all over the planet. Yet when it is summer in Italy, it is winter in Australia and Argentina. The real cause lies elsewhere." } },
    { h: { it: "La Terra è inclinata", en: "The Earth is tilted" },
      p: { it: "L’asse della Terra, la linea immaginaria intorno a cui gira, è inclinato di circa 23,4 gradi e punta sempre nella stessa direzione dello spazio, verso la Stella Polare. Così, mentre giriamo intorno al Sole, per metà anno è più rivolto verso il Sole l’emisfero nord e per l’altra metà l’emisfero sud. Chi è rivolto verso il Sole ha l’estate: il Sole sale più alto nel cielo e le giornate sono più lunghe.", en: "The Earth’s axis, the imaginary line it spins around, is tilted by about 23.4 degrees and always points in the same direction in space, towards the North Star. So, as we travel around the Sun, for half the year the northern hemisphere leans towards the Sun and for the other half the southern one. Whichever leans towards the Sun has summer: the Sun climbs higher in the sky and days are longer." } },
    { h: { it: "Luce dritta e luce di sbieco", en: "Straight light and slanting light" },
      p: { it: "Quando il Sole è alto, la sua luce arriva quasi dritta e concentra l’energia su una piccola area, che si scalda molto. Quando è basso, la stessa luce arriva di sbieco e si spalma su un’area più grande, scaldandola meno. Le giornate lunghe aggiungono ore di riscaldamento. Vicino ai poli l’effetto è estremo: d’estate il Sole non tramonta mai, d’inverno può non sorgere per mesi.", en: "When the Sun is high, its light arrives almost straight down and concentrates its energy on a small area, which heats up a lot. When it is low, the same light comes in at a slant and spreads over a bigger area, warming it less. Long days add hours of heating. Near the poles the effect is extreme: in summer the Sun never sets, and in winter it may not rise for months." } }
  ],
  try: { it: "Al buio, punta una torcia dritta su un foglio: fa un cerchio piccolo e luminoso. Ora inclinala: la luce si allarga in un’ovale più grande e più debole. È la differenza tra la luce dell’estate e quella dell’inverno.", en: "In the dark, point a torch straight down at a sheet of paper: it makes a small, bright circle. Now tilt it: the light spreads into a bigger, dimmer oval. That is the difference between summer light and winter light." },
  fact: { it: "Urano è inclinato di quasi 98 gradi: gira «sdraiato» sul fianco. Ogni polo ha 42 anni di luce continua seguiti da 42 anni di buio.", en: "Uranus is tilted by almost 98 degrees: it spins lying on its side. Each pole gets 42 years of continuous daylight followed by 42 years of darkness." } },

{ id: "esopianeti", s: "spazio", w: "transit", go: { v: "exo" },
  t: { it: "Come si trovano i pianeti di altre stelle", en: "How we find planets around other stars" },
  k: { it: "Sono troppo lontani e deboli per vederli. Allora li scopriamo dalle piccole cose che fanno alla loro stella.", en: "They are too far away and too faint to see. So we discover them from the small things they do to their star." },
  b: [
    { h: { it: "Un problema di luce", en: "A problem of light" },
      p: { it: "Un pianeta non brilla di luce propria e sta vicinissimo a una stella miliardi di volte più luminosa: è come cercare di vedere una lucciola accanto a un faro, da migliaia di chilometri. Per questo il primo pianeta intorno a una stella simile al Sole è stato scoperto solo nel 1995, da Michel Mayor e Didier Queloz: 51 Pegasi b. Oggi ne conosciamo più di seimila, quasi tutti trovati con metodi indiretti.", en: "A planet does not shine by itself and sits extremely close to a star billions of times brighter: it is like trying to spot a firefly next to a lighthouse from thousands of kilometres away. That is why the first planet around a Sun-like star was found only in 1995, by Michel Mayor and Didier Queloz: 51 Pegasi b. Today we know more than six thousand, almost all found by indirect methods." } },
    { h: { it: "Il metodo dei transiti", en: "The transit method" },
      p: { it: "Se un pianeta, girando, passa davanti alla sua stella, ne copre una piccola parte e la luce cala un pochino, sempre allo stesso intervallo. Un pianeta grande come Giove davanti a una stella come il Sole la fa calare di circa l’1%, uno come la Terra di meno dello 0,01%. Dal calo si capisce quanto è grande il pianeta, dal ritmo quanto dura il suo anno. I telescopi spaziali Kepler e TESS hanno trovato così migliaia di pianeti. Provalo qui sotto.", en: "If a planet, as it orbits, passes in front of its star, it covers a small part of it and the light dips slightly, always at the same interval. A Jupiter-sized planet in front of a Sun-like star dims it by about 1%, an Earth-sized one by less than 0.01%. The size of the dip tells you how big the planet is, its rhythm how long its year lasts. The Kepler and TESS space telescopes found thousands of planets this way. Try it below." } },
    { h: { it: "La stella che dondola", en: "The wobbling star" },
      p: { it: "Un pianeta non gira esattamente intorno alla stella: tutti e due girano intorno a un centro comune. Così la stella dondola un pochino, avvicinandosi e allontanandosi da noi. Quando si avvicina la sua luce diventa un po’ più blu, quando si allontana un po’ più rossa, come il suono di un’ambulanza che cambia mentre passa. Misurando questo dondolio si scopre il pianeta e si calcola la sua massa. Così è stato trovato 51 Pegasi b.", en: "A planet does not orbit exactly around its star: both circle a shared centre. So the star wobbles slightly, moving towards us and away. When it approaches, its light becomes a little bluer; when it recedes, a little redder, like the siren of an ambulance changing as it passes. Measuring this wobble reveals the planet and its mass. That is how 51 Pegasi b was found." } }
  ],
  try: { it: "Al buio accendi una lampada e passa una pallina davanti alla lampadina, guardando da lontano: vedrai la luce calare un attimo a ogni passaggio. Con una pallina più grande cala di più. È quello che vedono i telescopi.", en: "In the dark, switch on a lamp and pass a ball in front of the bulb while watching from a distance: you will see the light dip for a moment with each pass. A bigger ball dims it more. That is what telescopes see." },
  fact: { it: "Alcuni pianeti girano intorno a due stelle, come Kepler-16 b, scoperto nel 2011. In Orbis, tra gli esopianeti, puoi vedere il suo sistema con i due soli.", en: "Some planets orbit two stars, like Kepler-16 b, discovered in 2011. In Orbis, among the exoplanets, you can see its system with its two suns." } },

{ id: "luna", s: "spazio", go: { v: "solar", id: "earth" },
  t: { it: "La Luna ci mostra sempre la stessa faccia", en: "The Moon always shows us the same face" },
  k: { it: "Dalla Terra nessuno ha mai visto il lato nascosto della Luna. Il motivo è una danza durata milioni di anni.", en: "Nobody on Earth has ever seen the far side of the Moon. The reason is a dance that lasted millions of years." },
  b: [
    { h: { it: "Gira, ma a tempo", en: "It spins, but in time" },
      p: { it: "Si potrebbe pensare che la Luna non giri su se stessa. Invece gira: compie un giro su se stessa esattamente nello stesso tempo in cui fa un giro intorno alla Terra, circa 27 giorni. Per questo ci mostra sempre la stessa faccia, come un ballerino che gira intorno al compagno guardandolo sempre negli occhi. Si chiama rotazione sincrona.", en: "You might think the Moon does not spin. It does: it turns once on its axis in exactly the same time it takes to go once around the Earth, about 27 days. That is why it always shows us the same face, like a dancer circling a partner while always looking them in the eye. This is called synchronous rotation." } },
    { h: { it: "Il freno delle maree", en: "The brake of the tides" },
      p: { it: "All’inizio la Luna girava su se stessa più in fretta. Ma la gravità della Terra la deformava un pochino, tirandola in un leggero ovale. Questa «gobba» faceva da freno, e in milioni di anni la rotazione della Luna rallentò finché non si agganciò al suo giro intorno alla Terra. Succede a moltissime lune del Sistema solare. E la Luna fa lo stesso con noi: le maree stanno rallentando lentamente anche la Terra, allungando i giorni di circa due millesimi di secondo ogni secolo.", en: "At first the Moon spun faster. But the Earth’s gravity deformed it slightly, pulling it into a gentle oval. This “bulge” acted as a brake, and over millions of years the Moon’s rotation slowed until it locked onto its trip around the Earth. It has happened to a great many moons in the Solar System. And the Moon does the same to us: the tides are slowly braking the Earth too, lengthening the day by about two thousandths of a second each century." } },
    { h: { it: "La Luna si allontana", en: "The Moon is moving away" },
      p: { it: "C’è un’altra conseguenza: la Luna si allontana dalla Terra di circa 3,8 centimetri all’anno, più o meno quanto crescono le unghie. Lo sappiamo grazie agli specchi lasciati sulla Luna dagli astronauti delle missioni Apollo: dalla Terra si sparano impulsi laser, che rimbalzano sugli specchi e tornano indietro, e misurando il tempo del viaggio si calcola la distanza con precisione di millimetri. Il lato nascosto lo abbiamo visto per la prima volta nel 1959, grazie alla sonda sovietica Luna 3.", en: "There is another consequence: the Moon is moving away from the Earth by about 3.8 centimetres a year, roughly as fast as fingernails grow. We know thanks to the mirrors left on the Moon by Apollo astronauts: laser pulses are fired from Earth, bounce off the mirrors and come back, and timing the trip gives the distance to within millimetres. We first saw the far side in 1959, thanks to the Soviet probe Luna 3." } }
  ],
  try: { it: "Metti una sedia al centro della stanza e girale intorno guardandola sempre. Quando hai fatto un giro completo, hai visto tutte e quattro le pareti: vuol dire che anche tu hai fatto un giro su te stesso, proprio come la Luna.", en: "Place a chair in the middle of the room and walk around it while always facing it. When you have gone all the way round, you have seen all four walls: that means you have also turned once on the spot, just like the Moon." },
  fact: { it: "Il lato nascosto della Luna non è il «lato oscuro»: riceve tanta luce del Sole quanto quello visibile. Nel 2019 la sonda cinese Chang’e 4 è stata la prima ad atterrarci.", en: "The far side of the Moon is not the “dark side”: it gets as much sunlight as the near side. In 2019 the Chinese probe Chang’e 4 became the first to land there." } }
);
LESSONS.push(
{ id: "placche", s: "terra", go: { v: "dive", id: "himalaya" },
  t: { it: "I continenti che si muovono", en: "The continents that move" },
  k: { it: "Il suolo sotto i tuoi piedi viaggia: pochi centimetri all’anno, quanto crescono le unghie. Ma in milioni di anni costruisce montagne.", en: "The ground under your feet is travelling: a few centimetres a year, as fast as fingernails grow. But over millions of years it builds mountains." },
  b: [
    { h: { it: "Il puzzle di Wegener", en: "Wegener’s puzzle" },
      p: { it: "Guardando una carta geografica si nota che la costa dell’Africa e quella del Sud America si incastrano come due pezzi di puzzle. Nel 1912 il meteorologo tedesco Alfred Wegener propose che un tempo i continenti fossero uniti in un unico supercontinente, la Pangea, e poi si fossero separati. Aveva prove: fossili uguali e rocce uguali su continenti lontani. Ma non sapeva spiegare cosa li muovesse, e per decenni quasi nessuno gli credette.", en: "Looking at a map, you notice that the coasts of Africa and South America fit together like two jigsaw pieces. In 1912 the German meteorologist Alfred Wegener proposed that the continents were once joined in a single supercontinent, Pangaea, and later drifted apart. He had evidence: identical fossils and identical rocks on distant continents. But he could not explain what moved them, and for decades almost nobody believed him." } },
    { h: { it: "Placche che galleggiano", en: "Floating plates" },
      p: { it: "Negli anni Sessanta, studiando il fondo degli oceani, i geologi trovarono la risposta. Il guscio esterno della Terra è diviso in una quindicina di grandi placche rigide che scivolano lentamente sopra uno strato di roccia caldissima che si deforma come una pasta densissima. In mezzo all’Atlantico, lungo una catena di vulcani sottomarini, nasce nuovo fondale e le placche si allontanano; altrove una placca si infila sotto l’altra e sprofonda. I terremoti e i vulcani si concentrano proprio ai bordi delle placche.", en: "In the 1960s, studying the ocean floor, geologists found the answer. The Earth’s outer shell is split into about fifteen large rigid plates that slide slowly over a layer of extremely hot rock that deforms like a very thick dough. In the middle of the Atlantic, along a chain of undersea volcanoes, new sea floor is born and the plates move apart; elsewhere one plate dives beneath another and sinks. Earthquakes and volcanoes cluster precisely along plate edges." } },
    { h: { it: "Come è nato l’Himalaya", en: "How the Himalayas were born" },
      p: { it: "Circa 50 milioni di anni fa l’India, che era un’isola, viaggiò verso nord e si scontrò con l’Asia. Le due placche si accartocciarono come il cofano di due auto in un incidente al rallentatore, e sollevarono l’Himalaya, le montagne più alte del mondo. Lo scontro continua ancora oggi: l’India spinge verso nord di circa 4-5 centimetri all’anno e le montagne salgono ancora di qualche millimetro ogni anno.", en: "About 50 million years ago India, which was an island, travelled north and collided with Asia. The two plates crumpled like the bonnets of two cars in a slow-motion crash, and pushed up the Himalayas, the highest mountains in the world. The collision is still going on: India pushes north by about 4 to 5 centimetres a year, and the mountains are still rising by a few millimetres every year." } }
  ],
  try: { it: "Metti due asciugamani piatti sul tavolo, uno di fronte all’altro, e spingili lentamente uno contro l’altro: si sollevano in pieghe e creste. È così che nascono le catene montuose.", en: "Lay two towels flat on a table, facing each other, and slowly push them together: they rise into folds and ridges. That is how mountain ranges are born." },
  fact: { it: "Sulla cima dell’Everest, a quasi 9.000 metri, ci sono rocce calcaree piene di fossili di animali marini: un tempo erano sul fondo di un antico oceano, chiamato Tetide.", en: "At the top of Everest, almost 9,000 metres up, there are limestone rocks full of fossils of sea creatures: they once lay on the floor of an ancient ocean called the Tethys." } },

{ id: "nuvole", s: "terra",
  t: { it: "Il viaggio dell’acqua e il peso delle nuvole", en: "The journey of water and the weight of clouds" },
  k: { it: "Una nuvola come le altre pesa quanto un centinaio di elefanti. Eppure galleggia nel cielo.", en: "An ordinary cloud weighs as much as about a hundred elephants. And yet it floats in the sky." },
  b: [
    { h: { it: "Un giro senza fine", en: "An endless loop" },
      p: { it: "L’acqua della Terra non si consuma: gira. Il Sole scalda mari, laghi e foglie e una parte dell’acqua evapora, diventando vapore invisibile. Salendo, l’aria si raffredda e il vapore si condensa in goccioline: nascono le nuvole. Quando le gocce si uniscono e diventano troppo pesanti cadono come pioggia o neve, scorrono nei fiumi o filtrano sotto terra e tornano al mare. L’acqua che bevi oggi ha fatto questo giro miliardi di volte.", en: "The Earth’s water is not used up: it goes round. The Sun warms seas, lakes and leaves, and some water evaporates into invisible vapour. As the air rises it cools, and the vapour condenses into droplets: clouds are born. When drops merge and become too heavy they fall as rain or snow, run through rivers or seep underground, and return to the sea. The water you drink today has made this trip billions of times." } },
    { h: { it: "Quanto pesa una nuvola", en: "How much a cloud weighs" },
      p: { it: "In un metro cubo di nuvola c’è circa mezzo grammo d’acqua: pochissimo. Ma una nuvola bianca e soffice da bel tempo può occupare un chilometro cubo, cioè un miliardo di metri cubi. Il conto fa circa 500 tonnellate d’acqua sospese sopra di te. Perché non cadono? Perché sono divise in miliardi di goccioline di un centesimo di millimetro, che scendono lentissime e sono tenute su dalle correnti d’aria che salgono.", en: "One cubic metre of cloud holds about half a gram of water: very little. But a white, fluffy fair-weather cloud can fill a cubic kilometre, which is a billion cubic metres. That works out at about 500 tonnes of water hanging above you. Why doesn’t it fall? Because it is split into billions of droplets a hundredth of a millimetre across, which sink extremely slowly and are held up by rising air currents." } },
    { h: { it: "Da goccioline a pioggia", en: "From droplets to rain" },
      p: { it: "Per fare una goccia di pioggia servono circa un milione di goccioline di nuvola. Il vapore poi ha bisogno di un appoggio per condensarsi: granelli di polvere, sale marino, polline. Ogni goccia di pioggia e ogni fiocco di neve, quindi, ha un piccolo «seme» al centro. E i fiocchi di neve sono cristalli a sei punte perché le molecole d’acqua, congelando, si incastrano in un reticolo esagonale.", en: "It takes about a million cloud droplets to make one raindrop. The vapour also needs something to condense on: specks of dust, sea salt, pollen. So every raindrop and every snowflake has a tiny “seed” at its centre. And snowflakes are six-pointed crystals because water molecules, as they freeze, lock into a hexagonal lattice." } }
  ],
  try: { it: "Fai una nuvola in barattolo, con un adulto: metti un po’ d’acqua molto calda in un barattolo di vetro, appoggia sopra il coperchio capovolto con dei cubetti di ghiaccio, e dopo un po’ accendi e spegni un fiammifero dentro (il fumo fa da «seme»). Vedrai formarsi una nuvoletta.", en: "Make a cloud in a jar, with an adult: pour some very hot water into a glass jar, rest the upside-down lid with ice cubes on top, then light and blow out a match inside (the smoke acts as a “seed”). You will see a little cloud form." },
  fact: { it: "Una molecola d’acqua resta nell’atmosfera in media solo nove giorni circa prima di tornare giù come pioggia o neve. Nell’oceano invece può restare migliaia di anni.", en: "A water molecule stays in the atmosphere for only about nine days on average before coming back down as rain or snow. In the ocean, though, it can stay for thousands of years." } },

{ id: "effetto-serra", s: "terra",
  t: { it: "L’effetto serra e il clima che cambia", en: "The greenhouse effect and a changing climate" },
  k: { it: "Senza effetto serra la Terra sarebbe una palla di ghiaccio. Con troppo, diventa sempre più calda.", en: "Without the greenhouse effect the Earth would be a ball of ice. With too much, it keeps getting warmer." },
  b: [
    { h: { it: "Una coperta di gas", en: "A blanket of gas" },
      p: { it: "La luce del Sole attraversa l’atmosfera e scalda il suolo e il mare. La Terra a sua volta rimanda energia verso lo spazio sotto forma di infrarosso, la radiazione del calore. Alcuni gas dell’aria, come il vapore acqueo, l’anidride carbonica e il metano, assorbono una parte di questo infrarosso e lo rimandano in tutte le direzioni, anche verso il basso. È come una coperta: senza, la temperatura media della Terra sarebbe di circa −18 °C invece di +15 °C.", en: "Sunlight passes through the atmosphere and warms the ground and the sea. The Earth in turn sends energy back towards space as infrared, the radiation of heat. Some gases in the air, such as water vapour, carbon dioxide and methane, absorb part of this infrared and send it back out in every direction, including downwards. It works like a blanket: without it, the Earth’s average temperature would be about −18 °C instead of +15 °C." } },
    { h: { it: "La coperta si sta ispessendo", en: "The blanket is getting thicker" },
      p: { it: "Bruciando carbone, petrolio e gas, l’umanità libera l’anidride carbonica che quei combustibili avevano tenuto chiusa sotto terra per milioni di anni. Prima della rivoluzione industriale nell’aria ce n’erano circa 280 parti per milione; oggi siamo oltre 420, un livello che non c’era da milioni di anni. Più spessa è la coperta, più calore resta: dalla fine dell’Ottocento la temperatura media è salita di oltre un grado, e i ghiacciai di tutto il mondo si stanno ritirando.", en: "By burning coal, oil and gas, humanity releases carbon dioxide that those fuels had kept locked underground for millions of years. Before the industrial revolution the air held about 280 parts per million; today we are above 420, a level not seen for millions of years. The thicker the blanket, the more heat stays in: since the late 1800s the average temperature has risen by more than a degree, and glaciers all over the world are retreating." } },
    { h: { it: "Lo scoprì una donna nel 1856", en: "A woman discovered it in 1856" },
      p: { it: "La scienziata americana Eunice Foote, nel 1856, riempì dei cilindri di vetro con gas diversi e li mise al sole: quello con anidride carbonica si scaldava di più e restava caldo più a lungo. Scrisse che un’atmosfera con più anidride carbonica avrebbe reso la Terra più calda. Tre anni dopo l’irlandese John Tyndall misurò con precisione l’assorbimento dell’infrarosso. Per oltre un secolo il contributo di Foote fu dimenticato.", en: "In 1856 the American scientist Eunice Foote filled glass cylinders with different gases and put them in the sun: the one with carbon dioxide warmed up the most and stayed warm the longest. She wrote that an atmosphere with more carbon dioxide would make the Earth warmer. Three years later the Irish physicist John Tyndall precisely measured the absorption of infrared. For over a century Foote’s contribution was forgotten." } }
  ],
  try: { it: "In una giornata di sole lascia per un’ora due termometri al sole, uno libero e uno dentro un barattolo di vetro chiuso. Quello nel barattolo segnerà di più: il vetro fa entrare la luce e trattiene il calore, un po’ come una serra.", en: "On a sunny day, leave two thermometers in the sun for an hour, one in the open and one inside a closed glass jar. The one in the jar will read higher: the glass lets light in and keeps heat in, a bit like a greenhouse." },
  fact: { it: "Venere ha un’atmosfera quasi tutta di anidride carbonica, novanta volte più densa della nostra. Il suo effetto serra è così forte che la superficie arriva a circa 465 °C: più calda di Mercurio, che è più vicino al Sole.", en: "Venus has an atmosphere made almost entirely of carbon dioxide, ninety times denser than ours. Its greenhouse effect is so strong that the surface reaches about 465 °C: hotter than Mercury, which is closer to the Sun." } },

{ id: "aurore", s: "terra", go: { v: "dive", id: "tundra" },
  t: { it: "Il campo magnetico e le aurore", en: "The magnetic field and the auroras" },
  k: { it: "La Terra è una calamita gigante. Ci protegge dal vento del Sole e, ai poli, lo trasforma in luci danzanti.", en: "The Earth is a giant magnet. It shields us from the Sun’s wind and, near the poles, turns it into dancing lights." },
  b: [
    { h: { it: "Una dinamo di ferro liquido", en: "A dynamo of liquid iron" },
      p: { it: "A circa 3.000 chilometri sotto i nostri piedi c’è il nucleo esterno della Terra, un oceano di ferro e nichel fuso a migliaia di gradi. Questo metallo liquido si muove continuamente, spinto dal calore e dalla rotazione del pianeta, e il suo movimento genera correnti elettriche che a loro volta creano un campo magnetico. È una dinamo naturale, e la bussola funziona grazie a lei.", en: "About 3,000 kilometres beneath our feet lies the Earth’s outer core, an ocean of molten iron and nickel at thousands of degrees. This liquid metal is always moving, driven by heat and by the planet’s rotation, and its motion generates electric currents that in turn create a magnetic field. It is a natural dynamo, and it is why a compass works." } },
    { h: { it: "Uno scudo invisibile", en: "An invisible shield" },
      p: { it: "Il Sole soffia continuamente nello spazio un flusso di particelle cariche, il vento solare. Il campo magnetico terrestre le devia, come uno scudo, proteggendo l’atmosfera e la vita. Marte, che ha perso il suo campo magnetico miliardi di anni fa, ha visto il vento solare strappargli via gran parte dell’atmosfera. Anche molti animali usano il campo magnetico: uccelli migratori, tartarughe marine e salmoni lo sentono e lo usano per orientarsi.", en: "The Sun constantly blows a stream of charged particles into space, the solar wind. The Earth’s magnetic field deflects them like a shield, protecting the atmosphere and life. Mars, which lost its magnetic field billions of years ago, has had much of its atmosphere stripped away by the solar wind. Many animals use the magnetic field too: migrating birds, sea turtles and salmon sense it and use it to find their way." } },
    { h: { it: "Come nasce un’aurora", en: "How an aurora is born" },
      p: { it: "Vicino ai poli le linee del campo magnetico scendono verso terra, e una parte delle particelle del vento solare le segue fino all’alta atmosfera, tra 100 e 300 chilometri d’altezza. Lì urtano atomi di ossigeno e azoto e li fanno brillare: l’ossigeno dà il verde e il rosso, l’azoto il blu e il viola. Quando il Sole ha una grande tempesta, le aurore scendono molto più a sud: nel maggio 2024 si sono viste anche in Italia.", en: "Near the poles the magnetic field lines dip towards the ground, and some of the solar-wind particles follow them down into the upper atmosphere, 100 to 300 kilometres up. There they strike oxygen and nitrogen atoms and make them glow: oxygen gives green and red, nitrogen blue and purple. When the Sun has a big storm, auroras reach much farther south: in May 2024 they were seen even in Italy." } }
  ],
  try: { it: "Strofina un ago da cucito sempre nello stesso verso su una calamita una ventina di volte, poi appoggialo su un pezzetto di sughero o una foglia che galleggia in una ciotola d’acqua. Lentamente l’ago si girerà verso nord: hai costruito una bussola.", en: "Stroke a sewing needle about twenty times in the same direction along a magnet, then lay it on a bit of cork or a leaf floating in a bowl of water. Slowly the needle will turn to point north: you have built a compass." },
  fact: { it: "Il polo nord magnetico si sposta: negli ultimi decenni si è mosso dal Canada verso la Siberia di decine di chilometri all’anno. E ogni tanto il campo si inverte del tutto: l’ultima volta è successo circa 780.000 anni fa.", en: "The magnetic north pole moves: in recent decades it has travelled from Canada towards Siberia at tens of kilometres a year. And every so often the field flips completely: the last time was about 780,000 years ago." } },

{ id: "mare-salato", s: "terra", go: { v: "dive", id: "ocean" },
  t: { it: "Perché il mare è salato", en: "Why the sea is salty" },
  k: { it: "I fiumi portano acqua dolce al mare da miliardi di anni. Eppure il mare è salato. Il trucco sta nella pioggia e nelle rocce.", en: "Rivers have been carrying fresh water to the sea for billions of years. Yet the sea is salty. The trick lies in rain and rocks." },
  b: [
    { h: { it: "La pioggia che scioglie le rocce", en: "Rain that dissolves rocks" },
      p: { it: "La pioggia è leggermente acida, perché scioglie un po’ di anidride carbonica dell’aria. Cadendo sulle rocce, molto lentamente le consuma e porta via piccole quantità di minerali disciolti, come sodio, calcio e magnesio. I fiumi trasportano questi minerali fino al mare: in un bicchiere d’acqua di fiume sono pochissimi e non si sentono, ma il loro viaggio dura da miliardi di anni.", en: "Rain is slightly acidic, because it dissolves a little carbon dioxide from the air. Falling on rocks, it wears them away very slowly and carries off small amounts of dissolved minerals, such as sodium, calcium and magnesium. Rivers carry these minerals down to the sea: in a glass of river water there are so few you cannot taste them, but their journey has been going on for billions of years." } },
    { h: { it: "L’acqua se ne va, il sale resta", en: "The water leaves, the salt stays" },
      p: { it: "Dal mare l’acqua evapora di continuo, ma il sale non evapora: resta lì. Così, goccia dopo goccia, i minerali si sono accumulati. Altro sale arriva dal fondo, dalle sorgenti calde dei vulcani sottomarini. Il risultato è che l’acqua del mare contiene in media circa 35 grammi di sali per litro, soprattutto cloruro di sodio, il sale da cucina. Se si stendesse sulla terraferma tutto il sale degli oceani, formerebbe uno strato alto più di 150 metri.", en: "Water is constantly evaporating from the sea, but salt does not evaporate: it stays behind. So, drop by drop, the minerals have built up. More salt comes from below, from the hot springs of undersea volcanoes. The result is that seawater holds on average about 35 grams of salts per litre, mostly sodium chloride, table salt. If all the salt in the oceans were spread over the land, it would make a layer more than 150 metres thick." } },
    { h: { it: "Mari più salati, mari meno salati", en: "Saltier seas, less salty seas" },
      p: { it: "Non tutti i mari sono salati allo stesso modo. Il Mar Baltico, dove arrivano tanti fiumi e fa freddo, è poco salato. Il Mediterraneo, caldo e quasi chiuso, evapora molto ed è più salato dell’oceano. Il Mar Morto, un lago senza uscita in una zona torridissima, ha circa dieci volte il sale dell’oceano: l’acqua è così densa che ci si galleggia sopra come su un materassino, senza fare niente.", en: "Not all seas are equally salty. The Baltic Sea, fed by many rivers and cold, is only slightly salty. The Mediterranean, warm and almost enclosed, evaporates a lot and is saltier than the ocean. The Dead Sea, a lake with no outlet in a scorching region, has about ten times as much salt as the ocean: the water is so dense that you float on it like a lilo, without doing anything." } }
  ],
  try: { it: "Metti un uovo crudo in un bicchiere d’acqua del rubinetto: affonda. Ora aggiungi cucchiai di sale mescolando: a un certo punto l’uovo comincerà a salire e galleggerà. È il motivo per cui nel Mar Morto si galleggia.", en: "Put a raw egg into a glass of tap water: it sinks. Now add spoonfuls of salt, stirring: at some point the egg will start to rise and float. That is why you float in the Dead Sea." },
  fact: { it: "Anche il nostro sangue è salato, e la sua miscela di sali somiglia un po’ a quella del mare. Secondo un’idea affascinante, ma ancora discussa, potrebbe essere un ricordo del fatto che la vita è nata nell’oceano.", en: "Our blood is salty too, and its mix of salts somewhat resembles that of the sea. According to a fascinating but still debated idea, it may be a reminder that life began in the ocean." } }
);
LESSONS.push(
{ id: "esponenziale", s: "numeri", w: "doubling",
  t: { it: "Il potere del raddoppio", en: "The power of doubling" },
  k: { it: "Piega un foglio 42 volte e arrivi alla Luna. Il nostro cervello non è fatto per capire la crescita esponenziale.", en: "Fold a sheet of paper 42 times and you reach the Moon. Our brains are not built to grasp exponential growth." },
  b: [
    { h: { it: "La leggenda della scacchiera", en: "The legend of the chessboard" },
      p: { it: "Una leggenda racconta che l’inventore degli scacchi chiese al re come premio un chicco di riso sulla prima casella della scacchiera, due sulla seconda, quattro sulla terza, e così via raddoppiando. Il re rise per la richiesta così modesta. Ma sull’ultima casella, la sessantaquattresima, servivano più di nove miliardi di miliardi di chicchi: in tutto, più riso di quanto il mondo intero ne abbia prodotto in tutta la sua storia.", en: "A legend tells that the inventor of chess asked the king for a reward: one grain of rice on the first square of the board, two on the second, four on the third, and so on, doubling each time. The king laughed at such a modest request. But the last square, the sixty-fourth, needed more than nine billion billion grains: in total, more rice than the whole world has produced in all of history." } },
    { h: { it: "Lenta, lenta, poi improvvisa", en: "Slow, slow, then sudden" },
      p: { it: "Quando una cosa raddoppia a ogni passo, all’inizio sembra non succedere niente: 1, 2, 4, 8, 16. Poi, all’improvviso, esplode. Un foglio di carta è spesso un decimo di millimetro: piegato 10 volte è spesso 10 centimetri, piegato 20 volte 100 metri, piegato 42 volte supererebbe la distanza della Luna. Nella realtà non si riesce a piegarlo più di 7 o 8 volte, ma la matematica non mente. Prova qui sotto a raddoppiare.", en: "When something doubles at every step, at first nothing seems to happen: 1, 2, 4, 8, 16. Then suddenly it explodes. A sheet of paper is a tenth of a millimetre thick: folded 10 times it is 10 centimetres thick, 20 times 100 metres, and 42 times it would pass the distance to the Moon. In real life you cannot fold it more than 7 or 8 times, but the maths doesn’t lie. Try doubling below." } },
    { h: { it: "Batteri, ninfee e interessi", en: "Bacteria, water lilies and interest" },
      p: { it: "In condizioni ideali alcuni batteri si dividono ogni 20 minuti: un solo batterio in un giorno potrebbe diventare miliardi di miliardi, se non finissero spazio e cibo. Un indovinello: una ninfea raddoppia ogni giorno e copre tutto lo stagno in 30 giorni. Quando ne copriva metà? Al ventinovesimo giorno. Capire l’esponenziale aiuta a capire le epidemie, i risparmi che crescono con gli interessi, e anche perché i computer sono diventati così potenti così in fretta.", en: "In ideal conditions some bacteria divide every 20 minutes: a single bacterium could become billions of billions in a day, if space and food did not run out. A riddle: a water lily doubles every day and covers the whole pond in 30 days. When did it cover half? On day twenty-nine. Understanding exponentials helps you understand epidemics, savings growing with interest, and even why computers became so powerful so quickly." } }
  ],
  try: { it: "Prendi un foglio A4 e prova a piegarlo a metà quante più volte puoi. Probabilmente ti fermerai a 7: a ogni piega lo spessore raddoppia e la superficie si dimezza. Nel 2002 una studentessa americana, Britney Gallivan, riuscì a piegare 12 volte un foglio lunghissimo, dopo aver calcolato la formula giusta.", en: "Take a sheet of A4 paper and try folding it in half as many times as you can. You will probably stop at 7: each fold doubles the thickness and halves the area. In 2002 an American student, Britney Gallivan, managed to fold a very long sheet 12 times, after working out the right formula." },
  fact: { it: "Se raddoppi un centesimo ogni giorno per un mese di 31 giorni, l’ultimo giorno avresti più di dieci milioni di euro.", en: "If you doubled one cent every day for a 31-day month, on the last day you would have more than ten million euros." } },

{ id: "infinito", s: "numeri",
  t: { it: "Infiniti più grandi di altri infiniti", en: "Infinities bigger than other infinities" },
  k: { it: "Ci sono tanti numeri pari quanti numeri interi. Ma i numeri con la virgola sono di più. Benvenuti nel mondo di Cantor.", en: "There are as many even numbers as whole numbers. But numbers with decimals are more. Welcome to Cantor’s world." },
  b: [
    { h: { it: "Contare con le coppie", en: "Counting by pairing" },
      p: { it: "Come fai a sapere se in una stanza ci sono tante sedie quante persone, senza contare? Fai sedere tutti: se nessuno resta in piedi e nessuna sedia resta vuota, sono lo stesso numero. Alla fine dell’Ottocento il matematico Georg Cantor usò proprio questa idea per confrontare insiemi infiniti. Prendi i numeri interi 1, 2, 3, 4… e i numeri pari 2, 4, 6, 8…: puoi accoppiare ogni numero con il suo doppio, senza lasciarne fuori nessuno. Quindi sono tanti quanti, anche se i pari sembrano la metà.", en: "How can you tell whether a room has as many chairs as people, without counting? Ask everyone to sit: if nobody is left standing and no chair is empty, the numbers are the same. In the late 1800s the mathematician Georg Cantor used exactly this idea to compare infinite sets. Take the whole numbers 1, 2, 3, 4… and the even numbers 2, 4, 6, 8…: you can pair each number with its double, leaving none out. So there are just as many, even though the even numbers look like half." } },
    { h: { it: "L’hotel di Hilbert", en: "Hilbert’s Hotel" },
      p: { it: "Il matematico David Hilbert immaginò un albergo con infinite stanze, tutte occupate. Arriva un nuovo ospite: c’è posto? Sì! Basta chiedere a ogni ospite di spostarsi nella stanza col numero successivo: chi era nella 1 va nella 2, chi era nella 2 va nella 3… e la stanza 1 si libera. Arrivano infiniti nuovi ospiti? Ognuno si sposta nella stanza col numero doppio, e si liberano tutte le stanze dispari. Con l’infinito, il buon senso non funziona più.", en: "The mathematician David Hilbert imagined a hotel with infinitely many rooms, all occupied. A new guest arrives: is there room? Yes! Just ask every guest to move into the next room: whoever was in 1 goes to 2, whoever was in 2 goes to 3… and room 1 is free. Infinitely many new guests arrive? Everyone moves to the room with double their number, and all the odd rooms become free. With infinity, common sense stops working." } },
    { h: { it: "L’infinito più grande", en: "The bigger infinity" },
      p: { it: "Allora tutti gli infiniti sono uguali? No, e questa fu la scoperta più sorprendente di Cantor. Provò a mettere in fila tutti i numeri con la virgola tra 0 e 1, e dimostrò che qualunque lista se ne dimentica sempre qualcuno: basta costruire un numero che differisce dal primo della lista nella prima cifra, dal secondo nella seconda, e così via. Quel numero non è nella lista. Quindi i numeri reali sono «più infiniti» dei numeri interi. Molti matematici dell’epoca non accettarono queste idee; oggi sono alla base della matematica.", en: "So are all infinities equal? No, and this was Cantor’s most surprising discovery. He tried to list all the decimal numbers between 0 and 1, and proved that any list always misses some: just build a number that differs from the first on the list in its first digit, from the second in its second digit, and so on. That number is not on the list. So the real numbers are “more infinite” than the whole numbers. Many mathematicians of the time rejected these ideas; today they are a foundation of mathematics." } }
  ],
  try: { it: "Scrivi quattro numeri con la virgola uno sotto l’altro, per esempio 0,1234 / 0,5555 / 0,9081 / 0,3333. Ora costruisci un numero nuovo cambiando la prima cifra del primo, la seconda del secondo, la terza del terzo, la quarta del quarto. Sarà diverso da tutti: è il «trucco della diagonale» di Cantor.", en: "Write four decimal numbers one under the other, for example 0.1234 / 0.5555 / 0.9081 / 0.3333. Now build a new number by changing the first digit of the first, the second of the second, the third of the third, the fourth of the fourth. It will differ from all of them: that is Cantor’s “diagonal trick”." },
  fact: { it: "Il simbolo dell’infinito, ∞, fu introdotto nel 1655 dal matematico inglese John Wallis. Cantor invece usò la lettera ebraica aleph, ℵ, per dare un nome ai diversi infiniti.", en: "The infinity symbol, ∞, was introduced in 1655 by the English mathematician John Wallis. Cantor used the Hebrew letter aleph, ℵ, to name the different infinities." } },

{ id: "metodo-scientifico", s: "numeri",
  t: { it: "Come fa la scienza a sapere le cose", en: "How science knows things" },
  k: { it: "Più di 2.200 anni fa un uomo misurò la Terra con un bastone, un pozzo e un po’ di geometria. Ecco come funziona la scienza.", en: "More than 2,200 years ago a man measured the Earth with a stick, a well and some geometry. Here is how science works." },
  b: [
    { h: { it: "L’ombra di Eratostene", en: "Eratosthenes’ shadow" },
      p: { it: "Eratostene era il bibliotecario di Alessandria d’Egitto. Sapeva che a Siene, più a sud, a mezzogiorno del giorno più lungo il Sole illuminava il fondo dei pozzi: era esattamente sopra la testa. Lo stesso giorno ad Alessandria un bastone verticale faceva un’ombra, con un angolo di circa 7 gradi, cioè un cinquantesimo di cerchio. Se la Terra è una sfera, pensò, allora la sua circonferenza è 50 volte la distanza tra le due città. Ottenne un valore molto vicino a quello vero, circa 40.000 chilometri.", en: "Eratosthenes was the librarian of Alexandria in Egypt. He knew that at Syene, farther south, at noon on the longest day the Sun lit up the bottom of wells: it was directly overhead. On the same day in Alexandria an upright stick cast a shadow at an angle of about 7 degrees, a fiftieth of a circle. If the Earth is a sphere, he reasoned, its circumference must be 50 times the distance between the two cities. He got a value very close to the real one, about 40,000 kilometres." } },
    { h: { it: "Ipotesi, previsioni, prove", en: "Hypotheses, predictions, tests" },
      p: { it: "Il cuore della scienza è semplice: si propone un’idea che spieghi qualcosa, se ne ricava una previsione che si possa controllare, e si fa l’esperimento. Se la previsione fallisce, l’idea va corretta o buttata. Se funziona, si ripete, magari in altri laboratori. Un’idea scientifica deve poter essere smentita: «domani pioverà o non pioverà» non è scienza, perché non può mai sbagliare.", en: "The heart of science is simple: you propose an idea that explains something, you work out a prediction that can be checked, and you run the experiment. If the prediction fails, the idea must be fixed or thrown away. If it works, you repeat it, perhaps in other labs. A scientific idea must be able to be proved wrong: “tomorrow it will rain or it won’t” is not science, because it can never be wrong." } },
    { h: { it: "Le mani di Semmelweis", en: "Semmelweis’s hands" },
      p: { it: "Nel 1847, a Vienna, il medico Ignaz Semmelweis notò che in un reparto di maternità morivano molte più mamme che in un altro. Nel primo lavoravano medici che arrivavano dalle autopsie. Ipotizzò che portassero sulle mani qualcosa di invisibile e impose di lavarle con una soluzione di cloro: le morti crollarono. All’epoca molti colleghi lo derisero, perché i microbi non erano ancora stati scoperti. La scienza a volte fatica ad accettare le prove, ma alla fine le prove vincono.", en: "In 1847, in Vienna, the physician Ignaz Semmelweis noticed that far more mothers died in one maternity ward than in another. The first was staffed by doctors who came straight from autopsies. He suggested they carried something invisible on their hands and ordered them to wash with a chlorine solution: deaths plummeted. At the time many colleagues mocked him, because microbes had not yet been discovered. Science sometimes struggles to accept evidence, but in the end the evidence wins." } }
  ],
  try: { it: "Fai un vero esperimento: la fetta di pane imburrata cade davvero sempre dal lato del burro? Scrivi la previsione, poi fai cadere 20 volte dal tavolo una fetta di pane (magari con la marmellata finta, disegnata su un cartoncino!) e conta. Nel 1995 un fisico, Robert Matthews, ha studiato davvero questa domanda.", en: "Run a real experiment: does buttered toast really always land butter-side down? Write down your prediction, then drop a slice 20 times from the table (perhaps with pretend jam drawn on a piece of card!) and count. In 1995 a physicist, Robert Matthews, actually studied this question." },
  fact: { it: "Il fisico Richard Feynman diceva: «Il primo principio è che non devi ingannare te stesso, e tu sei la persona più facile da ingannare». Per questo gli scienziati fanno controllare il loro lavoro da altri.", en: "The physicist Richard Feynman said: “The first principle is that you must not fool yourself, and you are the easiest person to fool.” That is why scientists have their work checked by others." } },

{ id: "compleanno", s: "numeri", w: "birthday",
  t: { it: "Il paradosso del compleanno", en: "The birthday paradox" },
  k: { it: "In una classe di 23 persone c’è più di una possibilità su due che due festeggino il compleanno lo stesso giorno. Non ci credi? Provalo.", en: "In a class of 23 people there is a better than even chance that two share a birthday. Don’t believe it? Try it." },
  b: [
    { h: { it: "Un risultato che sembra sbagliato", en: "A result that seems wrong" },
      p: { it: "Un anno ha 365 giorni. Quante persone servono perché sia probabile, più di una volta su due, che due di loro siano nate lo stesso giorno? Quasi tutti rispondono «circa 180». La risposta vera è 23. Con 50 persone la probabilità sale al 97%, con 70 supera il 99,9%. Non è un vero paradosso, ma è un risultato così contrario all’intuito che lo chiamano così.", en: "A year has 365 days. How many people do you need for it to be likely, more than half the time, that two of them were born on the same day? Almost everyone answers “about 180”. The real answer is 23. With 50 people the probability rises to 97%; with 70 it is over 99.9%. It is not a true paradox, but the result is so counter-intuitive that it is called one." } },
    { h: { it: "Il segreto sono le coppie", en: "The secret is pairs" },
      p: { it: "L’errore sta nel pensare al proprio compleanno. Non cerchiamo qualcuno nato il tuo stesso giorno, ma una coppia qualsiasi con lo stesso compleanno. E in un gruppo di 23 persone le coppie possibili sono tantissime: 253. Ognuna ha una piccola probabilità di coincidere, ma messe tutte insieme diventa più probabile trovarne una che non trovarne nessuna. Prova qui sotto a creare gruppi di persone a caso.", en: "The mistake is thinking about your own birthday. We are not looking for someone born on your day, but for any pair with the same birthday. And in a group of 23 people there are a great many possible pairs: 253. Each has a small chance of matching, but all together it becomes more likely to find one than to find none. Try creating random groups of people below." } },
    { h: { it: "Perché serve davvero", en: "Why it really matters" },
      p: { it: "Questo ragionamento ha usi seri. Gli informatici lo usano per capire quanto è facile che due file diversi producano la stessa «impronta digitale» nei sistemi di sicurezza, un tipo di attacco che si chiama proprio «attacco del compleanno». In generale ci insegna una cosa importante: le coincidenze sono molto più frequenti di quanto pensiamo, perché ci sono tantissimi modi diversi in cui possono capitare.", en: "This reasoning has serious uses. Computer scientists use it to work out how easily two different files could produce the same “fingerprint” in security systems, a kind of attack that is actually called a “birthday attack”. More generally it teaches something important: coincidences are much more common than we think, because there are so many different ways for them to happen." } }
  ],
  try: { it: "Se a scuola siete almeno 23 in classe, chiedete a tutti la data di compleanno e scrivetela alla lavagna. Avete trovato una coppia? Più della metà delle classi da 23 la trova.", en: "If there are at least 23 of you in your class, ask everyone’s birthday and write them on the board. Did you find a pair? More than half of all classes of 23 do." },
  fact: { it: "Nelle squadre dei Mondiali di calcio i giocatori convocati sono 23 o 26: in molte squadre ci sono due compagni nati lo stesso giorno, proprio come prevede il paradosso.", en: "At the football World Cup, squads have 23 or 26 players: many teams include two teammates born on the same day, just as the paradox predicts." } },

{ id: "potenze-di-dieci", s: "numeri", w: "scale",
  t: { it: "Le potenze di dieci: dal quark all’universo", en: "Powers of ten: from quark to universe" },
  k: { it: "Dal nucleo di un atomo ai confini dell’universo osservabile ci sono più di 40 «zeri». Fai il viaggio con un dito.", en: "From an atomic nucleus to the edge of the observable universe there are more than 40 “zeros”. Make the journey with one finger." },
  b: [
    { h: { it: "Contare gli zeri", en: "Counting zeros" },
      p: { it: "I numeri della scienza sono così grandi o così piccoli che scriverli per intero sarebbe scomodo. Si usano allora le potenze di dieci: 10³ vuol dire 1 seguito da 3 zeri, cioè 1.000; 10⁻³ vuol dire un millesimo. Ogni passo moltiplica o divide per dieci. Così un metro diventa 10⁰, la distanza dalla Terra al Sole circa 10¹¹ metri, e il nucleo di un atomo circa 10⁻¹⁵ metri.", en: "Science’s numbers are so large or so small that writing them out in full would be awkward. So we use powers of ten: 10³ means 1 followed by 3 zeros, that is 1,000; 10⁻³ means a thousandth. Each step multiplies or divides by ten. So one metre becomes 10⁰, the distance from the Earth to the Sun about 10¹¹ metres, and an atomic nucleus about 10⁻¹⁵ metres." } },
    { h: { it: "Noi stiamo a metà", en: "We sit in the middle" },
      p: { it: "Mettendo in fila le grandezze dell’universo succede una cosa curiosa. Dal nucleo di un atomo, 10⁻¹⁵ metri, alla grandezza di un essere umano, circa 1 metro, ci sono 15 passi da dieci. Da noi alle galassie più lontane che vediamo, circa 10²⁶ metri, ce ne sono 26. Un essere umano è circa dieci miliardi di volte più grande di un atomo, e la Terra è quasi dieci milioni di volte più grande di un essere umano: stiamo molto più vicini al mezzo di quanto si pensi.", en: "Lining up the sizes in the universe reveals something curious. From an atomic nucleus, 10⁻¹⁵ metres, to the size of a human being, about 1 metre, there are 15 steps of ten. From us to the farthest galaxies we can see, about 10²⁶ metres, there are 26. A human being is about ten billion times bigger than an atom, and the Earth is almost ten million times bigger than a human being: we sit much nearer the middle than you might think." } },
    { h: { it: "Il viaggio del 1977", en: "The 1977 journey" },
      p: { it: "Nel 1977 i designer americani Charles e Ray Eames realizzarono un cortometraggio famosissimo, Powers of Ten: parte da una coppia che fa un picnic in un parco di Chicago e allarga l’inquadratura di dieci volte ogni dieci secondi, fino ai confini dell’universo; poi torna indietro e rimpicciolisce fino dentro un atomo della mano dell’uomo. Ha insegnato a milioni di persone a sentire la scala delle cose. Qui sotto puoi fare un viaggio simile.", en: "In 1977 the American designers Charles and Ray Eames made a famous short film, Powers of Ten: it starts with a couple picnicking in a Chicago park and widens the view tenfold every ten seconds, out to the edge of the universe; then it comes back and zooms down into an atom in the man’s hand. It taught millions of people to feel the scale of things. Below you can take a similar journey." } }
  ],
  try: { it: "Con un metro da sarta misura la tua mano (circa 10⁻¹ metri, un decimo di metro), la tua stanza (circa 10¹) e la distanza da casa a scuola (forse 10³). Ogni volta hai fatto uno o due salti di potenza di dieci.", en: "With a tape measure, measure your hand (about 10⁻¹ metres, a tenth of a metre), your room (about 10¹) and the distance from home to school (perhaps 10³). Each time you jumped one or two powers of ten." },
  fact: { it: "Un googol è 1 seguito da cento zeri, 10¹⁰⁰: è più del numero di atomi in tutto l’universo osservabile, che è circa 10⁸⁰. Il nome Google viene proprio da googol, scritto sbagliato.", en: "A googol is 1 followed by a hundred zeros, 10¹⁰⁰: more than the number of atoms in the whole observable universe, which is about 10⁸⁰. The name Google comes from googol, misspelt." } }
);

/* =========================================================
   MINI-LESSONS OF SCIENCE
   A fifth section: a scrollable library of short lessons, each with a drawing or a small
   experiment to touch. Lessons live in LESSONS (lessons/*.js), added a few at a time:
   give a new one an `added: "YYYY-MM-DD"` date and it shows the "New" badge for two weeks.
   ========================================================= */
const SUBJ = {
  quanti: { it: "Particelle e quanti", en: "Particles & quanta", c: "#b9a4ff" },
  fisica: { it: "Fisica", en: "Physics", c: "#7cbcff" },
  chimica: { it: "Chimica", en: "Chemistry", c: "#ffb45e" },
  vita: { it: "Vita", en: "Life", c: "#86dc93" },
  spazio: { it: "Spazio", en: "Space", c: "#ffd479" },
  terra: { it: "Terra", en: "Earth", c: "#5fd3c6" },
  numeri: { it: "Numeri e idee", en: "Numbers & ideas", c: "#ff92b4" }
};
const LESSONS_LAUNCH = "2026-11-02";
const LUI = {
  eyebrow: { it: "Orbis · Lezioni", en: "Orbis · Lessons" },
  title: { it: "Mini lezioni di scienza", en: "Science mini-lessons" },
  lead: { it: "Lezioni brevi ma vere, per curiosi di tutte le età: dai quanti alle stelle, dalle cellule all’infinito. Molte hanno un disegno o un esperimento da toccare.", en: "Short but real lessons for the curious of every age: from quanta to stars, from cells to infinity. Many come with a drawing or an experiment to touch." },
  all: { it: "Tutte", en: "All" }, newOnes: { it: "Nuove", en: "New" }, isNew: { it: "Nuova", en: "New" },
  search: { it: "Cerca una lezione…", en: "Search the lessons…" }, none: { it: "Nessuna lezione trovata.", en: "No lessons found." },
  min: { it: "min", en: "min" }, read: { it: "letta", en: "read" }, exp: { it: "esperimento", en: "experiment" }, fig: { it: "disegno", en: "drawing" },
  progress: { it: "Ne hai lette {r} su {n}.", en: "You have read {r} of {n}." }, progress0: { it: "{n} lezioni da scoprire.", en: "{n} lessons to discover." },
  back: { it: "Tutte le lezioni", en: "All lessons" }, tryIt: { it: "Prova tu", en: "Try it" }, experiment: { it: "Esperimento", en: "Experiment" },
  goOrbis: { it: "Guardalo in Orbis", en: "See it in Orbis" }, prev: { it: "Precedente", en: "Previous" }, next: { it: "Successiva", en: "Next" },
  reset: { it: "Ricomincia", en: "Start again" }
};
let lessonFilter = "all", lessonQuery = "", lessonOpen = null, lessonStop = null, lessonListScroll = 0, lessonsPushed = false;
const lessonColor = (l) => SUBJ[l.s].c;
function lessonsRead() { try { return new Set(JSON.parse(localStorage.getItem("orbis-lessons-read") || "[]")); } catch (e) { return new Set(); } }
function markLessonRead(id) {
  const s = lessonsRead(); if (s.has(id)) return; s.add(id);
  try { localStorage.setItem("orbis-lessons-read", JSON.stringify([...s])); } catch (e) {}
}
function lessonIsNew(l) {
  if (!l.added || l.added <= LESSONS_LAUNCH) return false;
  const days = (Date.now() - Date.parse(l.added + "T00:00:00")) / 864e5; return days >= 0 && days <= 14;
}
function lessonMinutes(l) {
  const words = [t(l.k), ...l.b.map((b) => t(b.p)), t(l.try), t(l.fact)].join(" ").split(/\s+/).length;
  return Math.max(2, Math.ceil(words / 140) + (l.w ? 1 : 0));
}
function lessonsShown() {
  const q = lessonQuery.trim().toLowerCase();
  return LESSONS.filter((l) => (lessonFilter === "all" || (lessonFilter === "new" ? lessonIsNew(l) : l.s === lessonFilter)) &&
    (!q || [t(l.t), t(l.k), t(SUBJ[l.s])].join(" ").toLowerCase().includes(q)))
    .map((l, i, arr) => ({ l, k: arr.slice(0, i).filter((x) => x.s === l.s).length * 10 + Object.keys(SUBJ).indexOf(l.s) }))
    .sort((a, b) => (lessonIsNew(b.l) - lessonIsNew(a.l)) || (lessonFilter === "all" && !q ? a.k - b.k : 0)).map((x) => x.l);
}
function measureBar() { const b = document.querySelector(".bar"); if (b) document.documentElement.style.setProperty("--bar-real", b.offsetHeight + "px"); }
function stopLessonWidget() { if (lessonStop) { try { lessonStop(); } catch (e) {} lessonStop = null; } }
function openLessons(id, push) {
  if (!diveEl.hidden) { diveEl.hidden = true; dive = null; cancelAnimationFrame(moteRaf); }
  closeCur(); $("lab").hidden = true; $("credits").hidden = true;
  const P = $("lessons"); P.hidden = false; overlayOpen = "lessons"; document.body.classList.add("lessons-open");
  measureBar();
  const l = id && LESSONS.find((x) => x.id === id);
  if (l) renderLesson(l.id); else renderLessonList();
  const h = l ? "lezioni/" + l.id : "lezioni";
  try { if (push) { history.pushState({ orbisLesson: 1 }, "", "#" + h); lessonsPushed = true; } else history.replaceState(null, "", "#" + h); } catch (e) {}
  renderNav();
}
function closeLessons() {
  if ($("lessons").hidden) return;
  stopLessonWidget(); $("lessons").hidden = true; document.body.classList.remove("lessons-open"); lessonOpen = null; lessonsPushed = false;
  overlayOpen = diveEl.hidden ? null : "dive";
  renderNav();
}
function lessonCard(l, read) {
  const done = read.has(l.id), extra = l.w ? t(LUI.exp) : l.fig ? t(LUI.fig) : "";
  return `<button type="button" class="l-card${done ? " done" : ""}" data-id="${l.id}" style="--sc:${lessonColor(l)}">
    <span class="l-subj">${esc(t(SUBJ[l.s]))}${lessonIsNew(l) ? `<span class="l-new">${esc(t(LUI.isNew))}</span>` : ""}</span>
    <span class="l-title">${esc(t(l.t))}</span><span class="l-hook">${esc(t(l.k))}</span>
    <span class="l-meta">${lessonMinutes(l)} ${esc(t(LUI.min))}${extra ? " · " + esc(extra) : ""}${done ? ` · <span class="ok">✓ ${esc(t(LUI.read))}</span>` : ""}</span></button>`;
}
function renderLessonGrid() {
  const read = lessonsRead(), list = lessonsShown();
  $("l-grid").innerHTML = list.length ? list.map((l) => lessonCard(l, read)).join("") : `<p class="l-empty">${esc(t(LUI.none))}</p>`;
  $("l-grid").querySelectorAll(".l-card").forEach((b) => b.onclick = () => { lessonListScroll = $("lessons").scrollTop; openLessons(b.dataset.id, true); });
}
function renderLessonList() {
  stopLessonWidget(); lessonOpen = null;
  const read = lessonsRead(), n = LESSONS.length, r = LESSONS.filter((l) => read.has(l.id)).length, anyNew = LESSONS.some(lessonIsNew);
  const keys = ["all", ...(anyNew ? ["new"] : []), ...Object.keys(SUBJ)];
  const chips = keys.map((k) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${lessonFilter === k}"${SUBJ[k] ? ` style="--sc:${SUBJ[k].c}"` : ""}>${esc(k === "all" ? t(LUI.all) : k === "new" ? t(LUI.newOnes) : t(SUBJ[k]))}</button>`).join("");
  $("lessons-inner").innerHTML = `<header class="l-head"><p class="l-eyebrow">${esc(t(LUI.eyebrow))}</p><h1>${esc(t(LUI.title))}</h1>
    <p class="lead">${esc(t(LUI.lead))}</p><p class="l-progress">${esc(t(r ? LUI.progress : LUI.progress0).replace("{r}", r).replace("{n}", n))}</p></header>
    <div class="l-tools"><input type="search" id="l-search" placeholder="${esc(t(LUI.search))}" aria-label="${esc(t(LUI.search))}" value="${esc(lessonQuery)}"><div class="chips l-chips">${chips}</div></div>
    <div class="l-grid" id="l-grid"></div>`;
  renderLessonGrid();
  $("lessons-inner").querySelectorAll(".l-chips .chip").forEach((b) => b.onclick = () => { lessonFilter = b.dataset.k; $("lessons-inner").querySelectorAll(".l-chips .chip").forEach((c) => c.setAttribute("aria-pressed", c === b)); renderLessonGrid(); });
  $("l-search").addEventListener("input", (e) => { lessonQuery = e.target.value; renderLessonGrid(); });
  requestAnimationFrame(() => { $("lessons").scrollTop = lessonListScroll; });
}
function renderLesson(id) {
  stopLessonWidget();
  const l = LESSONS.find((x) => x.id === id); if (!l) { renderLessonList(); return; }
  lessonOpen = id;
  const list = lessonsShown().some((x) => x.id === id) ? lessonsShown() : LESSONS, i = list.findIndex((x) => x.id === id);
  const prev = list[i - 1], next = list[i + 1];
  const fig = l.fig && LFIG[l.fig] ? `<figure class="l-fig">${LFIG[l.fig]()}</figure>` : "";
  const body = l.b.map((b) => `<h2>${esc(t(b.h))}</h2><p>${esc(t(b.p))}</p>`).join("");
  const widget = l.w && LWIDGET[l.w] ? `<section class="l-widget" aria-label="${esc(t(LUI.experiment))}"><p class="l-wlabel">${esc(t(LUI.experiment))}</p><div id="l-w"></div></section>` : "";
  const go = l.go ? `<button type="button" class="cta" id="l-go">${esc(t(LUI.goOrbis))} →</button>` : "";
  const pn = `<nav class="l-pn">${prev ? `<button type="button" data-id="${prev.id}"><small>← ${esc(t(LUI.prev))}</small><span>${esc(t(prev.t))}</span></button>` : "<span></span>"}${next ? `<button type="button" class="nx" data-id="${next.id}"><small>${esc(t(LUI.next))} →</small><span>${esc(t(next.t))}</span></button>` : ""}</nav>`;
  $("lessons-inner").innerHTML = `<div class="l-backrow"><button type="button" class="l-back" id="l-back">← ${esc(t(LUI.back))}</button></div>
    <article class="l-article" style="--sc:${lessonColor(l)}"><p class="l-subj">${esc(t(SUBJ[l.s]))} · ${lessonMinutes(l)} ${esc(t(LUI.min))}</p>
    <h1>${esc(t(l.t))}</h1><p class="lead">${esc(t(l.k))}</p>${fig}${body}${widget}
    <aside class="l-box l-try"><strong>${esc(t(LUI.tryIt))}</strong><p>${esc(t(l.try))}</p></aside>
    <aside class="l-box l-fact" id="l-fact"><strong>${esc(t(UI.fact))}</strong><p>${esc(t(l.fact))}</p></aside>${go}${pn}</article>`;
  $("lessons").scrollTop = 0;
  $("l-back").onclick = () => { if (lessonsPushed) { try { history.back(); return; } catch (e) {} } renderLessonList(); setHash("lezioni"); };
  $("lessons-inner").querySelectorAll(".l-pn button").forEach((b) => b.onclick = () => openLessons(b.dataset.id, false));
  const g = $("l-go"); if (g) g.onclick = () => { const target = l.go; closeLessons(); goTo(target); };
  if (l.w) { try { lessonStop = LWIDGET[l.w]($("l-w")) || null; } catch (e) { console.warn(e); } }
  const fact = $("l-fact");
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((en) => { if (en.some((x) => x.isIntersecting)) { markLessonRead(id); io.disconnect(); } }, { root: $("lessons"), threshold: 0.6 });
    io.observe(fact); const old = lessonStop; lessonStop = () => { io.disconnect(); if (old) old(); };
  } else markLessonRead(id);
}
window.addEventListener("popstate", () => {
  const h = (location.hash || "").replace("#", "");
  if (h.startsWith("lezioni/")) openLessons(h.slice(8), false);
  else if (h === "lezioni") { if (!$("lessons").hidden) { lessonsPushed = false; renderLessonList(); } else openLessons(null, false); }
  else if (!$("lessons").hidden) closeLessons();
});

/* ---------- drawings ---------- */
const svgT = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || "#d6dbe5"}" font-size="${o.size || 13}" text-anchor="${o.anchor || "middle"}"${o.weight ? ` font-weight="${o.weight}"` : ""} font-family="Atkinson Hyperlegible, system-ui, sans-serif">${esc(s)}</text>`;
const LFIG = {
  atom() {
    let dots = ""; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 260; i++) { const a = rnd() * Math.PI * 2, r = 40 + Math.pow(rnd(), 0.6) * 95; dots += `<circle cx="${(300 + Math.cos(a) * r * 1.25).toFixed(1)}" cy="${(140 + Math.sin(a) * r * 0.9).toFixed(1)}" r="1.6" fill="#9fc3ff" opacity="${(0.25 + rnd() * 0.5).toFixed(2)}"/>`; }
    const nuc = [[0, 0, "p"], [6, -5, "n"], [-6, -4, "p"], [-4, 6, "n"], [5, 5, "p"], [0, -9, "n"]].map(([x, y, k]) => `<circle cx="${300 + x}" cy="${140 + y}" r="6" fill="${k === "p" ? "#ff7a6b" : "#c9ced8"}"/>`).join("");
