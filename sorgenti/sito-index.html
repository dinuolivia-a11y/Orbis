        text: { it: "Un’antilope bianca con lunghe corna a spirale, adatta come nessun’altra al deserto: può vivere quasi senza bere, perché prende l’acqua dalle piante che mangia. D’estate il suo pelo diventa quasi bianco e riflette il sole.", en: "A white antelope with long spiralled horns, adapted to the desert like no other: it can live almost without drinking, getting water from the plants it eats. In summer its coat turns almost white and reflects the sun." },
        fact: { it: "È una delle antilopi più rare della Terra: in natura ne restano forse meno di 100.", en: "It is one of the rarest antelopes on Earth: perhaps fewer than 100 are left in the wild." },
        prompt: "Photorealistic wildlife photograph of an addax (Addax nasomaculatus) walking across Saharan sand dunes: a pale antelope with a white summer coat, long slender horns twisted in two or three spiral turns, a brown forelock tuft on the forehead and a white X-shaped mark across the face, broad splayed hooves, golden dunes behind.", style: "forest" },
      { id: "sandcat", d: -0.3, h: 35, name: { it: "Gatto delle sabbie", en: "Sand cat" }, sci: "Felis margarita",
        range: { it: "deserti di sabbia del Sahara e dell’Arabia", en: "sandy deserts of the Sahara and Arabia" }, size: { it: "circa 45 cm più 30 cm di coda", en: "about 45 cm plus a 30 cm tail" },
        text: { it: "Un gattino del deserto dal muso largo, che di giorno dorme in una tana e caccia di notte. Sotto le zampe ha un fitto tappeto di pelo che lo protegge dalla sabbia rovente e non lascia quasi impronte.", en: "A broad-faced little desert cat that sleeps in a burrow by day and hunts at night. The soles of its feet are covered in thick fur that protects it from the scorching sand and leaves almost no footprints." },
        fact: { it: "Può vivere quasi senza bere: l’acqua che gli serve la prende dalle prede che mangia.", en: "It can live almost without drinking: it gets the water it needs from the prey it eats." },
        prompt: "Photorealistic night wildlife photograph of a sand cat (Felis margarita) walking on a sand dune under a starry sky: a small stocky wild cat with pale sandy fur, a broad flat head, large low-set ears, faint dark bars on the legs, a black-tipped tail with a few dark rings, thick fur on the soles of its paws.", style: "forest" },
      { id: "fennec", d: -0.2, h: 38, name: { it: "Fennec", en: "Fennec fox" }, sci: "Vulpes zerda",
        range: { it: "deserti di sabbia del Nord Africa", en: "sandy deserts of North Africa" }, size: { it: "circa 37 cm più 20 cm di coda, poco più di 1 kg", en: "about 37 cm plus a 20 cm tail, just over 1 kg" },
        text: { it: "La volpe più piccola del mondo, con le orecchie più grandi rispetto al corpo. Le orecchie servono a sentire gli insetti che si muovono sotto la sabbia e a disperdere il calore, come radiatori.", en: "The smallest fox in the world, with the biggest ears for its size. Its ears help it hear insects moving under the sand and get rid of heat, like radiators." },
        fact: { it: "Scava tane lunghe e piene di gallerie, che a volte si collegano a quelle di altre famiglie.", en: "It digs long burrows full of tunnels, which sometimes connect to those of other families." },
        prompt: "Photorealistic wildlife photograph of a fennec fox (Vulpes zerda) standing on a Saharan sand dune at sunset: a tiny fox with cream-coloured fur, enormous upright ears much larger than its head, big dark eyes, a black-tipped bushy tail, furry paws, rippled dunes behind.", style: "forest" },
      { id: "silverant", d: -0.01, h: 40, name: { it: "Formica argentata del Sahara", en: "Saharan silver ant" }, sci: "Cataglyphis bombycina",
        range: { it: "dune del Sahara", en: "Saharan dunes" }, size: { it: "circa 1 cm", en: "about 1 cm" },
        text: { it: "Esce dal nido proprio nell’ora più calda, quando la sabbia supera i 60 °C e i suoi predatori sono nascosti. Ha peli argentati a forma di prisma che riflettono la luce del sole e la tengono fresca.", en: "It leaves its nest at the very hottest time of day, when the sand is above 60 °C and its predators are hiding. It has silvery, prism-shaped hairs that reflect sunlight and keep it cool." },
        fact: { it: "È una delle formiche più veloci del mondo: quasi 1 metro al secondo, più di 100 volte la lunghezza del suo corpo.", en: "It is one of the fastest ants in the world: nearly 1 metre a second, more than 100 times its body length." },
        prompt: "Photorealistic extreme macro photograph of a Saharan silver ant (Cataglyphis bombycina) running across hot golden sand: a slender long-legged ant about 1 cm long covered in shiny silvery hairs that reflect the sunlight like metal, a slim waist, long antennae, heat shimmer over the sand.", style: "forest" },
      { id: "hornedviper", d: 0.03, h: 35, name: { it: "Vipera cornuta", en: "Saharan horned viper" }, sci: "Cerastes cerastes",
        range: { it: "deserti del Nord Africa e del Medio Oriente", en: "deserts of North Africa and the Middle East" }, size: { it: "di solito 30–60 cm", en: "usually 30–60 cm" },
        text: { it: "Ha due piccole corna sopra gli occhi. Si nasconde scuotendo il corpo finché affonda nella sabbia, lasciando fuori solo gli occhi, e aspetta le prede. Si sposta di lato, a onde, toccando la sabbia rovente il meno possibile.", en: "It has two little horns above its eyes. It hides by shuffling its body until it sinks into the sand, leaving only its eyes showing, and waits for prey. It moves sideways in waves, touching the scorching sand as little as possible." },
        fact: { it: "È velenosa: come tutti i serpenti del deserto, va ammirata solo da lontano.", en: "It is venomous: like all desert snakes, it should only be admired from a distance." },
        prompt: "Photorealistic wildlife photograph of a Saharan horned viper (Cerastes cerastes) partly buried in pale desert sand with only its head and eyes showing: a sandy-beige viper with faint darker blotches, vertical pupils, and a single small pointed horn-like scale rising above each eye, sidewinding tracks in the sand nearby.", style: "forest" },
      { id: "sandfish", d: 0.12, h: 40, name: { it: "Pesce delle sabbie", en: "Sandfish" }, sci: "Scincus scincus",
        range: { it: "dune di sabbia del Nord Africa", en: "sand dunes of North Africa" }, size: { it: "circa 20 cm", en: "about 20 cm" },
        text: { it: "Non è un pesce ma una lucertola, che «nuota» dentro la sabbia ondeggiando il corpo come un pesce nell’acqua. Ha il muso a forma di pala, le squame lisce e lucide, e si tuffa nella sabbia appena sente un pericolo.", en: "It isn’t a fish but a lizard that “swims” through the sand, wriggling its body like a fish in water. It has a shovel-shaped snout and smooth, shiny scales, and dives into the sand at the first sign of danger." },
        fact: { it: "Riesce a respirare sotto la sabbia senza che nemmeno un granello gli entri nei polmoni.", en: "It can breathe under the sand without a single grain getting into its lungs." },
        prompt: "Photorealistic wildlife photograph of a sandfish skink (Scincus scincus) half-buried as it dives head-first into fine golden Saharan sand: a stout lizard about 20 cm long with a wedge-shaped shovel-like snout, very smooth glossy scales, sandy-yellow body with dark brownish crossbands, short legs with fringed toes.", style: "forest" },
      { id: "jerboa", d: 0.8, h: 35, at: { it: "Nella tana, sotto la sabbia", en: "In its burrow, under the sand" }, name: { it: "Gerboa egiziano minore", en: "Lesser Egyptian jerboa" }, sci: "Jaculus jaculus",
        range: { it: "deserti del Nord Africa e del Medio Oriente", en: "deserts of North Africa and the Middle East" }, size: { it: "circa 10 cm più 18 cm di coda", en: "about 10 cm plus an 18 cm tail" },
        text: { it: "Un topolino del deserto che salta sulle lunghe zampe posteriori come un canguro, fino a quasi 3 metri in un solo balzo. Di giorno dorme in una tana e ne chiude l’ingresso con la sabbia per tenere fuori il caldo.", en: "A little desert rodent that hops on its long hind legs like a kangaroo, up to nearly 3 metres in a single leap. By day it sleeps in a burrow and blocks the entrance with sand to keep the heat out." },
        fact: { it: "Usa la coda lunghissima, con un ciuffo bianco e nero in fondo, per stare in equilibrio mentre salta.", en: "It uses its very long tail, with a black-and-white tuft at the end, to keep its balance while jumping." },
        prompt: "Photorealistic night wildlife photograph of a lesser Egyptian jerboa (Jaculus jaculus) leaping across moonlit desert sand: a small sandy-coloured rodent with a white belly, very long kangaroo-like hind legs, tiny front paws, big dark eyes, large ears, and a very long tail ending in a black-and-white tuft.", style: "forest" }
    ]
  },
  reef: {
    axis: "ground", start: -40, end: 600, px: 0.9, minGap: 70, maxGap: 460, motes: "reef", water: true,
    below: { it: "sotto il mare", en: "below the sea" }, zeroLabel: { it: "0 m · livello del mare", en: "0 m · sea level" },
    gauge: [{ l: { it: "Altezza / profondità", en: "Height / depth" }, k: "height" }, { l: { it: "Luce del sole", en: "Sunlight" }, k: "sun" }, { l: { it: "Strato", en: "Layer" }, k: "zone" }],
    where: { it: "Australia · Grande Barriera Corallina", en: "Australia · Great Barrier Reef" },
    eyebrow: { it: "Grande Barriera Corallina", en: "Great Barrier Reef" },
    title: { it: "La Grande <em>Barriera Corallina</em>", en: "The Great <em>Barrier Reef</em>" },
    lead: { it: "Dal cielo sopra un’isola di corallo fino a 600 metri lungo la parete che scende nel Mar dei Coralli. Lo strumento mostra l’altezza o la profondità e quanta luce del sole arriva.", en: "From the sky above a coral island down to 600 metres along the wall that drops into the Coral Sea. The gauge shows the height or depth and how much sunlight gets through." },
    cue: { it: "Scorri per scendere", en: "Scroll to descend" },
    note: { it: "La Grande Barriera è lunga circa 2.300 km: queste creature vivono in punti diversi della barriera e del Mar dei Coralli lì accanto. Qui le trovi all’altezza o alla profondità in cui si incontrano.", en: "The Great Barrier Reef is about 2,300 km long: these creatures live in different parts of the reef and of the Coral Sea next to it. Here you meet them at the height or depth where they are found." },
    stops: [[-40, "#7fc0e6"], [-1, "#c9ebf6"], [0, "#e6f6f2"], [0.6, "#5fd0cc"], [3, "#22a7bf"], [30, "#127aa3"], [100, "#0a4670"], [250, "#052540"], [600, "#020c18"]],
    zones: [
      { from: -40, to: 0, name: { it: "Sopra la barriera", en: "Above the reef" }, range: { it: "0–40 m", en: "0–40 m" }, text: { it: "Dalla barriera spuntano centinaia di isolette di sabbia e corallo. Ci nidificano uccelli marini e tartarughe: l’isola di Raine, a nord, è il luogo dove nidificano più tartarughe verdi al mondo.", en: "Hundreds of little islands of sand and coral poke out of the reef. Seabirds and turtles nest on them: Raine Island, in the north, is where more green turtles nest than anywhere else in the world." } },
      { from: 0, to: 3, name: { it: "La piana della barriera", en: "The reef flat" }, range: { it: "0–3 m", en: "0–3 m" }, text: { it: "La parte piatta in cima alla barriera. Con la bassa marea l’acqua si ritira e restano pozze calde, che di notte rimangono quasi senza ossigeno: qui vive solo chi sa resistere.", en: "The flat top of the reef. At low tide the water drains away, leaving warm pools that at night run almost out of oxygen: only the toughest live here." } },
      { from: 3, to: 30, name: { it: "La barriera viva", en: "The living reef" }, range: { it: "3–30 m", en: "3–30 m" }, text: { it: "Coralli di ogni forma e colore, migliaia di pesci e invertebrati. La Grande Barriera è fatta di quasi 3.000 barriere più piccole ed è la costruzione più grande fatta da esseri viventi: si vede anche dallo spazio.", en: "Corals of every shape and colour, thousands of fish and invertebrates. The Great Barrier Reef is made of almost 3,000 smaller reefs and is the largest structure built by living things: it can be seen even from space." } },
      { from: 30, to: 150, name: { it: "Il crepuscolo della barriera", en: "The reef’s twilight" }, range: { it: "30–150 m", en: "30–150 m" }, text: { it: "La luce diventa blu e debole, e i coralli si fanno piatti come vassoi per raccogliere quella che resta. Questa zona, detta mesofotica, è ancora poco esplorata: è troppo profonda per i sub e troppo bassa per molti sottomarini.", en: "The light turns blue and weak, and corals grow flat like trays to catch what is left. This zone, called mesophotic, is still little explored: too deep for divers and too shallow for many submarines." } },
      { from: 150, to: 600, name: { it: "La parete profonda", en: "The deep wall" }, range: { it: "150–600 m", en: "150–600 m" }, text: { it: "Fuori dalla barriera il fondale precipita nel Mar dei Coralli, fino a migliaia di metri. Nel buio vivono i nautili, che di notte risalgono lungo la parete per mangiare.", en: "Beyond the reef the seabed plunges into the Coral Sea, thousands of metres deep. In the dark live nautiluses, which climb the wall at night to feed." } }
    ],
    marks: [
      { d: 0, text: { it: "Il livello del mare: con la bassa marea la piana della barriera resta quasi all’asciutto", en: "Sea level: at low tide the reef flat is left almost dry" } },
      { d: 40, text: { it: "Il limite delle immersioni sportive con le bombole", en: "The limit for recreational scuba diving" } },
      { d: 100, text: { it: "Qui arriva circa l’1% della luce del sole", en: "About 1% of the sunlight gets this deep" } },
      { d: 125, text: { it: "I coralli più profondi della Grande Barriera, trovati nel 2014 con un robot sottomarino", en: "The deepest corals of the Great Barrier Reef, found in 2014 with an underwater robot" } }
    ],
    endTitle: { it: "La parete del Mar dei Coralli, circa 600 m", en: "The Coral Sea wall, about 600 m" },
    endText: { it: "La Grande Barriera Corallina è Patrimonio dell’Umanità dal 1981. Negli ultimi anni il mare troppo caldo ha causato diversi sbiancamenti di massa: i coralli espellono le alghe che li nutrono e diventano bianchi. Se l’acqua torna fresca abbastanza presto, possono riprendersi.", en: "The Great Barrier Reef has been a World Heritage Site since 1981. In recent years overly warm seas have caused several mass bleaching events: the corals expel the algae that feed them and turn white. If the water cools down again soon enough, they can recover." },
    creatures: [
      { id: "frigate", d: -30, h: 350, name: { it: "Fregata minore", en: "Lesser frigatebird" }, sci: "Fregata ariel",
        range: { it: "cielo sopra le isole; nidifica sull’isola di Raine", en: "skies over the islands; nests on Raine Island" }, size: { it: "70–80 cm, ali fino a 1,9 m", en: "70–80 cm, wings up to 1.9 m" },
        text: { it: "Un uccello marino nero con ali lunghissime e la coda a forbice. Plana per ore sopra il mare quasi senza battere le ali, sfruttando le correnti d’aria calda. Il maschio, per corteggiare, gonfia sotto il becco un sacco rosso come un palloncino.", en: "A black seabird with very long wings and a scissor-shaped tail. It glides over the sea for hours, hardly flapping, riding rising currents of warm air. To court a female, the male inflates a red pouch under his bill like a balloon." },
        fact: { it: "Non può posarsi sul mare, perché le sue piume non sono impermeabili e si inzupperebbero. Così caccia al volo, e a volte insegue gli altri uccelli finché lasciano cadere il pesce. Le sue cugine, le fregate maggiori, riescono persino a dormire in volo, pochi secondi alla volta.", en: "It cannot land on the sea, because its feathers are not waterproof and would get soaked. So it hunts on the wing, and sometimes chases other birds until they drop their fish. Its cousins, the great frigatebirds, can even sleep while flying, a few seconds at a time." },
        prompt: "Photorealistic wildlife photograph of a lesser frigatebird (Fregata ariel) soaring over a turquoise coral reef and a small white sand cay: a slender black seabird with very long narrow angular wings and a deeply forked scissor-like tail, a long grey hooked bill, an adult male with a bright red throat pouch partly inflated and a small white patch on each flank, seen from slightly below against a clear blue tropical sky.", style: "forest" },
      { id: "greenturtle", d: -1, h: 150, at: { it: "La spiaggia", en: "The beach" }, name: { it: "Tartaruga verde", en: "Green sea turtle" }, sci: "Chelonia mydas",
        range: { it: "spiagge delle isole e praterie di alghe", en: "island beaches and seagrass meadows" }, size: { it: "fino a circa 1,2 m; appena nata, 5 cm", en: "up to about 1.2 m; 5 cm at hatching" },
        text: { it: "Si chiama verde per il colore del grasso sotto il guscio, non della corazza. Le femmine tornano a deporre le uova sulla spiaggia dove sono nate, dopo decenni passati in mare. Intorno all’isola di Raine, nel 2019, i droni ne hanno contate circa 64.000.", en: "It is called green after the colour of the fat under its shell, not the shell itself. Females come back to lay their eggs on the beach where they hatched, after decades at sea. Around Raine Island, in 2019, drones counted about 64,000 of them." },
        fact: { it: "Se le uova covano nella sabbia calda nascono femmine, in quella più fresca maschi. Con le spiagge sempre più calde, uno studio del 2018 ha scoperto che il 99% delle tartarughe giovani nate nel nord della Barriera è femmina. Ora si prova a fare ombra ai nidi.", en: "Eggs that develop in warm sand hatch as females, in cooler sand as males. With beaches getting hotter, a 2018 study found that 99% of the young turtles born in the northern reef are female. People are now trying to shade the nests." },
        prompt: "Photorealistic wildlife photograph of a green sea turtle hatchling (Chelonia mydas) crawling across white coral sand towards the sea on a tropical island beach at dawn: a tiny turtle about 5 cm long, dark grey-black shell with a thin pale edge, white underside, flippers edged in white, sand grains sticking to it, the turquoise sea blurred in the background, soft warm morning light.", style: "forest" },
      { id: "epaulette", d: 1, h: 35, name: { it: "Squalo dalle spalline", en: "Epaulette shark" }, sci: "Hemiscyllium ocellatum",
        range: { it: "piana della barriera e pozze di bassa marea", en: "reef flats and low-tide pools" }, size: { it: "fino a circa 1 m", en: "up to about 1 m" },
        text: { it: "Un piccolo squalo maculato che più che nuotare cammina: usa le pinne come zampe per spostarsi tra le pozze e i coralli, e riesce perfino ad attraversare tratti quasi all’asciutto. Dietro le pinne ha una grande macchia nera bordata di bianco, come la spallina di una divisa.", en: "A small spotted shark that walks more than it swims: it uses its fins like legs to move between pools and corals, and can even cross patches that are almost dry. Behind its fins it has a big white-ringed black spot, like the epaulette on a uniform." },
        fact: { it: "Con la bassa marea notturna le pozze restano quasi senza ossigeno. Lui resiste per ore: rallenta tutto per risparmiare energia, e il suo cervello continua a ricevere sangue senza danni. Gli scienziati lo studiano per capire come proteggere il cervello quando manca l’ossigeno.", en: "At night, low tide leaves the pools with almost no oxygen. It survives for hours: it slows everything down to save energy, and its brain keeps getting blood without damage. Scientists study it to learn how to protect the brain when oxygen runs out." },
        prompt: "Photorealistic underwater photograph of an epaulette shark (Hemiscyllium ocellatum) walking on its paddle-like pectoral and pelvic fins across a shallow coral reef flat at low tide: a slender pale beige-tan shark about 80 cm long covered in scattered small dark spots, a large black spot ringed in white just behind each pectoral fin like an epaulette, a long thick tail, small eyes, crystal-clear shallow water over coral and sand.", style: "reef" },
      { id: "irukandji", d: 1.6, h: 195, name: { it: "Medusa Irukandji", en: "Irukandji jellyfish" }, sci: "Carukia barnesi",
        range: { it: "acque costiere e della barriera, soprattutto d’estate", en: "coastal and reef waters, mostly in summer" }, size: { it: "campana di circa 2 cm, tentacoli fino a 1 m", en: "bell about 2 cm, tentacles up to 1 m" },
        text: { it: "Una medusa trasparente grande come un’unghia, quasi invisibile in acqua, con quattro tentacoli sottilissimi coperti di anellini urticanti. La puntura all’inizio sembra quella di una zanzara, ma dopo una mezz’ora può causare dolori fortissimi da ricovero in ospedale: è la sindrome di Irukandji, dal nome del popolo aborigeno di quella costa.", en: "A see-through jellyfish the size of a fingernail, almost invisible in the water, with four very thin tentacles ringed with stinging cells. At first the sting feels like a mosquito bite, but after half an hour or so it can cause severe pain that needs hospital care: it is called Irukandji syndrome, after the Aboriginal people of that coast." },
        fact: { it: "Nel 1961 il medico australiano Jack Barnes, per dimostrare che la colpevole era proprio lei, si fece pungere di proposito insieme al figlio di 9 anni e a un bagnino. Finirono tutti e tre in ospedale, ma guarirono, e la medusa porta il suo nome: barnesi.", en: "In 1961 the Australian doctor Jack Barnes, to prove this was the culprit, let it sting him on purpose, along with his 9-year-old son and a lifeguard. All three ended up in hospital but recovered, and the jellyfish bears his name: barnesi." },
        prompt: "Photorealistic underwater macro photograph of an Irukandji jellyfish (Carukia barnesi): a tiny transparent box-shaped bell only about 2 cm tall, almost invisible, dotted with small white clusters of stinging cells, four extremely thin trailing tentacles beaded at regular intervals with small reddish-brown and white bands like a string of pearls, drifting in clear blue-green tropical water against a darker background so its glassy body shows.", style: "reef" },
      { id: "acropora", d: 3, h: 40, name: { it: "Corallo Acropora", en: "Acropora coral" }, sci: "Acropora",
        range: { it: "barriera poco profonda, soprattutto nei primi 20 m", en: "shallow reef, mostly in the top 20 m" }, size: { it: "polipi di pochi millimetri, colonie larghe metri", en: "polyps a few millimetres wide, colonies metres across" },
        text: { it: "Sembra una pianta o una pietra, ma è un animale: ogni ramo è coperto da migliaia di polipi minuscoli, parenti delle meduse, che costruiscono insieme uno scheletro di calcare. Dentro di loro vivono alghe microscopiche che con la luce del sole producono cibo e danno al corallo i suoi colori.", en: "It looks like a plant or a stone, but it is an animal: every branch is covered in thousands of tiny polyps, relatives of jellyfish, which together build a skeleton of limestone. Inside them live microscopic algae that use sunlight to make food and give the coral its colours." },
        fact: { it: "Una volta all’anno, poche notti dopo una luna piena di fine primavera (in Australia tra ottobre e dicembre), più di 130 specie di coralli liberano insieme miliardi di uova e spermatozoi: sembra una nevicata al contrario. È stato osservato per la prima volta solo nel 1981, proprio sulla Grande Barriera.", en: "Once a year, a few nights after a late-spring full moon (between October and December in Australia), more than 130 species of coral release billions of eggs and sperm all together: it looks like snow falling upwards. It was first seen only in 1981, right here on the Great Barrier Reef." },
        prompt: "Photorealistic underwater photograph of a branching Acropora coral colony on a shallow sunlit reef: dense clusters of short finger-like branches covered in tiny polyps, cream and golden-brown with pale lilac tips, small blue-green chromis fish hovering above, sunbeams and rippling light patterns from the surface.", style: "reef" },
      { id: "xmastree", d: 5, h: 225, name: { it: "Verme albero di Natale", en: "Christmas tree worm" }, sci: "Spirobranchus",
        range: { it: "su coralli massicci, 3–30 m", en: "on massive corals, 3–30 m" }, size: { it: "pennacchi di circa 4 cm", en: "plumes about 4 cm" },
        text: { it: "Quelle due spirali colorate, simili a piccoli alberi di Natale, sono le branchie di un verme che vive in un tubo dentro il corallo. Le usa per respirare e per catturare il plancton. Ce ne sono di blu, rossi, gialli, arancioni e bianchi.", en: "Those two colourful spirals, like tiny Christmas trees, are the gills of a worm that lives in a tube inside the coral. It uses them to breathe and to catch plankton. They come in blue, red, yellow, orange and white." },
        fact: { it: "Al minimo movimento, o se un’ombra gli passa sopra, si ritira nel tubo in una frazione di secondo e chiude l’ingresso con un tappo spinoso. Contando gli anelli di crescita del corallo intorno ai tubi, gli scienziati hanno calcolato che può vivere fino a 40 anni.", en: "At the slightest movement, or if a shadow passes over it, it pulls back into its tube in a split second and shuts the entrance with a spiny lid. By counting the coral’s growth rings around the tubes, scientists worked out that it can live up to 40 years." },
        prompt: "Photorealistic underwater macro photograph of a pair of Christmas tree worms (Spirobranchus) emerging from a massive brain coral: two small spiral plumes about 4 cm high shaped like little Christmas trees, made of fine feathery radioles in vivid royal blue with white rings, a small spiny operculum beside them, the textured coral surface all around, natural sunlight.", style: "reef" },
      { id: "giantclam", d: 6, h: 175, name: { it: "Vongola gigante", en: "Giant clam" }, sci: "Tridacna gigas",
        range: { it: "barriera poco profonda, fino a 20 m", en: "shallow reef, down to 20 m" }, size: { it: "fino a 1,2 m e oltre 200 kg", en: "up to 1.2 m and over 200 kg" },
        text: { it: "Il mollusco con la conchiglia più grande del mondo, e può vivere più di 100 anni. Da adulta non si sposta più: resta aperta verso il sole, e nel suo mantello colorato vivono alghe microscopiche che le preparano gran parte del cibo, come un orto che si porta sempre dietro.", en: "The mollusc with the largest shell in the world, and it can live for more than 100 years. As an adult it never moves: it stays open towards the sun, and microscopic algae living in its colourful mantle make most of its food, like a vegetable garden it always carries with it." },
        fact: { it: "Lungo il bordo del mantello ha centinaia di occhietti grandi mezzo millimetro, che vedono luci e ombre: se un’ombra le passa sopra, si chiude piano piano. Non è vero che può intrappolare un sub: si chiude troppo lentamente.", en: "Along the edge of its mantle it has hundreds of tiny eyes, each half a millimetre wide, that sense light and shadow: if a shadow passes over, it slowly closes. It is a myth that it can trap a diver: it closes far too slowly." },
        prompt: "Photorealistic underwater photograph of a giant clam (Tridacna gigas) resting in the sand among corals on a shallow sunlit reef, seen from above at an angle: a huge heavy shell about 1 m wide with deep wavy folds, wide open, its thick fleshy mantle spilling over the edges in dark olive-brown and teal with iridescent blue-green spots, a large siphon opening visible, sunlight dappling the scene.", style: "reef" },
      { id: "pearlfish", d: 8, h: 330, name: { it: "Pesce perla", en: "Pearlfish" }, sci: "Carapus",
        range: { it: "dentro i cetrioli di mare e le stelle marine", en: "inside sea cucumbers and sea stars" }, size: { it: "10–20 cm", en: "10–20 cm" },
        text: { it: "Un pesce sottile e quasi trasparente, senza squame, che di giorno sta al sicuro dentro un cetriolo di mare. Ci entra dall’unica porta possibile: l’ano, che il cetriolo di mare usa anche per respirare. Di notte esce a caccia di piccoli crostacei e prima dell’alba torna dentro.", en: "A slender, almost see-through fish with no scales that spends the day safe inside a sea cucumber. It gets in through the only door there is: the anus, which the sea cucumber also uses to breathe. At night it comes out to hunt small crustaceans and before dawn it goes back in." },
        fact: { it: "Trova l’apertura seguendo il filo d’acqua che il cetriolo di mare espira, e spesso ci si infila di coda. A volte in un solo cetriolo ne vivono due, e alcune specie, meno educate, ne mangiano gli organi. Una specie vive anche nel Mediterraneo: il fierasfer, quello della foto.", en: "It finds the opening by following the stream of water the sea cucumber breathes out, and often slips in tail first. Sometimes two live in the same sea cucumber, and some less polite species eat its organs. One species also lives in the Mediterranean: the one in the photo." },
        prompt: "Photorealistic underwater night photograph of a pearlfish (Carapus) halfway out of the rear opening of a large leopard sea cucumber (Bohadschia argus) lying on reef sand: a slender eel-like translucent fish about 15 cm long with no scales, pale pinkish-silver body with tiny dark speckles and a big eye, its long tapering tail still inside the sea cucumber, the sea cucumber’s cream skin with dark ringed spots, lit by a diver’s torch against dark water.", style: "forest" },
      { id: "cots", d: 9, h: 285, name: { it: "Stella corona di spine", en: "Crown-of-thorns starfish" }, sci: "Acanthaster solaris",
        range: { it: "su tutta la barriera", en: "all over the reef" }, size: { it: "di solito 25–35 cm", en: "usually 25–35 cm" },
        text: { it: "Una stella marina coperta di spine velenose, con fino a una ventina di braccia. Mangia il corallo: ci si sdraia sopra, rovescia lo stomaco fuori dalla bocca e lo digerisce sul posto, lasciando uno scheletro bianco. Poche vanno bene, ma a volte diventano migliaia e divorano interi tratti di barriera.", en: "A starfish covered in venomous spines, with up to twenty or so arms. It eats coral: it lies on top, pushes its stomach out of its mouth and digests the coral on the spot, leaving a white skeleton. A few are fine, but sometimes they number in the thousands and devour whole stretches of reef." },
        fact: { it: "Una sola femmina grande può produrre più di 100 milioni di uova in una stagione: è il record per una stella marina. Per difendere la barriera, sub specializzati le cercano una a una e le eliminano con un’iniezione di aceto o di sali biliari.", en: "A single large female can produce more than 100 million eggs in one season: a record for a starfish. To protect the reef, specialist divers hunt them one by one and kill them with an injection of vinegar or bile salts." },
        prompt: "Photorealistic underwater photograph of a crown-of-thorns starfish (Acanthaster solaris) feeding on a table coral on a sunlit reef: a large spiny starfish about 35 cm across with around 16 thick arms, its whole upper surface covered in long sharp spines, purplish-grey and reddish-brown, the part of the coral it has already eaten bleached bright white, healthy colourful corals around.", style: "reef" },
      { id: "cleaner", d: 11, h: 210, name: { it: "Labro pulitore", en: "Bluestreak cleaner wrasse" }, sci: "Labroides dimidiatus",
        range: { it: "stazioni di pulizia sulla barriera, 1–40 m", en: "cleaning stations on the reef, 1–40 m" }, size: { it: "circa 10 cm", en: "about 10 cm" },
        text: { it: "Un pesciolino a strisce nere e blu che fa il dentista della barriera. In punti fissi, le stazioni di pulizia, i pesci grandi fanno la fila, aprono la bocca e allargano le branchie, e lui ci entra per mangiare parassiti e pelle morta. Sulla Grande Barriera si è calcolato che ogni pulitore controlla più di 2.000 pesci al giorno.", en: "A little black-and-blue striped fish that works as the reef’s dentist. At fixed spots, the cleaning stations, big fish queue up, open their mouths and spread their gills, and it swims inside to eat parasites and dead skin. On the Great Barrier Reef, each cleaner was found to check more than 2,000 fish a day." },
        fact: { it: "Nel 2019 dei ricercatori gli hanno fatto un segno colorato sulla gola, in un punto che poteva vedere solo allo specchio: guardandosi, ha cercato di toglierselo strofinandosi sul fondo. È stato il primo pesce a superare il test dello specchio, e nel 2023 si è scoperto che riconosce anche la propria foto.", en: "In 2019 researchers put a coloured mark on its throat, where it could only see it in a mirror: looking at itself, it tried to rub the mark off on the seabed. It was the first fish to pass the mirror test, and in 2023 it turned out it can also recognise its own photo." },
        prompt: "Photorealistic underwater photograph of a bluestreak cleaner wrasse (Labroides dimidiatus) cleaning a larger reef fish at a cleaning station: a slender little fish about 10 cm long with a bold black stripe from snout to tail that widens towards the tail, bordered by bright electric blue and white, picking parasites near the gills of a calm golden damselfish holding still with its fins spread, coral reef background.", style: "reef" },
      { id: "bumphead", d: 13, h: 165, name: { it: "Pesce pappagallo gigante", en: "Bumphead parrotfish" }, sci: "Bolbometopon muricatum",
        range: { it: "barriera esterna e lagune, 1–30 m", en: "outer reef and lagoons, 1–30 m" }, size: { it: "fino a 1,3 m e oltre 45 kg", en: "up to 1.3 m and over 45 kg" },
        text: { it: "Il pesce pappagallo più grande del mondo, con una gobba sulla fronte e un becco fatto di denti saldati insieme. Gira in branchi anche di decine di pesci e mangia corallo vivo, che stacca a morsi con tutto il calcare. I maschi si sfidano a testate, così forti che il colpo si sente sott’acqua.", en: "The largest parrotfish in the world, with a bump on its forehead and a beak made of fused teeth. It roams in schools of up to dozens of fish and eats living coral, biting off chunks with all the limestone. Males fight by ramming heads, so hard that you can hear the clash underwater." },
        fact: { it: "Il calcare che ingoia esce dall’altra parte come sabbia finissima: secondo una stima, ogni adulto ne produce più di 5 tonnellate all’anno. Una parte della sabbia bianca delle isole coralline è fatta proprio così.", en: "The limestone it swallows comes out the other end as very fine sand: by one estimate each adult makes more than 5 tonnes a year. Some of the white sand on coral islands is made exactly this way." },
        prompt: "Photorealistic underwater photograph of a bumphead parrotfish (Bolbometopon muricatum) swimming towards the camera over a coral reef: a huge bulky greenish-grey fish about 1.2 m long with a large rounded bump on its forehead, a pale pinkish face and a big white beak of fused teeth, a school of other bumpheads fading into the blue behind it, natural sunlight.", style: "reef" },
      { id: "mantis", d: 16, h: 15, name: { it: "Canocchia pavone", en: "Peacock mantis shrimp" }, sci: "Odontodactylus scyllarus",
        range: { it: "tane nella sabbia e nei detriti, 3–40 m", en: "burrows in sand and rubble, 3–40 m" }, size: { it: "fino a circa 18 cm", en: "up to about 18 cm" },
        text: { it: "Un crostaceo colorato come un pavone, con due clave ripiegate sotto la testa. Le scatta in avanti per spaccare conchiglie e granchi: il colpo parte a più di 80 km all’ora, così veloce che nell’acqua si formano bolle che, scoppiando, colpiscono la preda una seconda volta.", en: "A crustacean as colourful as a peacock, with two clubs folded under its head. It snaps them forward to smash shells and crabs: the strike starts at over 80 km/h, so fast that bubbles form in the water and, as they burst, hit the prey a second time." },
        fact: { it: "I suoi occhi si muovono ognuno per conto suo e hanno 12 tipi di recettori per i colori: noi ne abbiamo 3. Eppure, secondo uno studio del 2014, le canocchie distinguono i colori peggio di noi: forse li riconoscono al volo, invece di confrontarli.", en: "Its eyes move independently and have 12 types of colour receptors: we have 3. Yet a 2014 study found that mantis shrimps tell colours apart worse than we do: they may recognise them instantly instead of comparing them." },
        prompt: "Photorealistic underwater macro photograph of a peacock mantis shrimp (Odontodactylus scyllarus) at the entrance of its burrow in coral rubble, facing the camera: a stocky colourful crustacean about 15 cm long with a bright emerald-green body, red legs, a leopard-spotted orange-red front, two raptorial club arms folded under its head, two large stalked eyes like pink-and-green orbs with a band across the middle, natural reef light.", style: "reef" },
      { id: "seasnake", d: 22, h: 70, name: { it: "Serpente marino oliva", en: "Olive sea snake" }, sci: "Aipysurus laevis",
        range: { it: "barriere coralline del nord dell’Australia, fino a 45 m", en: "coral reefs of northern Australia, down to 45 m" }, size: { it: "di solito 1–2 m", en: "usually 1–2 m" },
        text: { it: "Un serpente velenoso che vive solo in mare e non va mai a terra: partorisce i piccoli direttamente in acqua. Respira aria, ma può restare sotto anche due ore, e con la coda piatta come un remo nuota tra i coralli cercando pesci nascosti nelle fessure. È curioso e a volte si avvicina ai sub, ma morde raramente.", en: "A venomous snake that lives only in the sea and never comes ashore: it gives birth to its young in the water. It breathes air but can stay under for up to two hours, and with its oar-like flat tail it swims among the corals looking for fish hidden in cracks. It is curious and sometimes approaches divers, but rarely bites." },
        fact: { it: "Sulla pelle della coda ha cellule sensibili alla luce: se la coda resta illuminata, la ritira. Così sa se è nascosta bene anche senza guardarla. È stato il primo rettile in cui si è scoperta questa specie di vista con la pelle.", en: "The skin of its tail has light-sensitive cells: if the tail is left in the light, it pulls it in. That way it knows if it is well hidden without looking. It was the first reptile found to have this sort of skin vision." },
        prompt: "Photorealistic underwater photograph of an olive sea snake (Aipysurus laevis) swimming over a coral reef: a thick muscular sea snake about 1.5 m long with smooth olive-brown to creamy-tan skin, a flattened paddle-shaped tail and a small head with a dark eye, its body curving gracefully above corals and sand in clear blue-green water.", style: "reef" },
      { id: "pygmyseahorse", d: 28, h: 345, name: { it: "Cavalluccio marino pigmeo", en: "Pygmy seahorse" }, sci: "Hippocampus bargibanti",
        range: { it: "sulle gorgonie Muricella, 10–40 m", en: "on Muricella sea fans, 10–40 m" }, size: { it: "meno di 2,5 cm", en: "under 2.5 cm" },
        text: { it: "Un cavalluccio marino più piccolo di un’unghia, che passa tutta la vita aggrappato con la coda a un solo tipo di gorgonia, un ventaglio di mare. Ha lo stesso colore e gli stessi bitorzoli della gorgonia su cui vive, rosa o gialli: è quasi impossibile vederlo.", en: "A seahorse smaller than a fingernail that spends its whole life gripping one kind of sea fan, a gorgonian, with its tail. It has the same colour and the same bumps as the sea fan it lives on, pink or yellow: it is almost impossible to spot." },
        fact: { it: "È stato scoperto per caso nel 1969: Georges Bargibant, un ricercatore della Nuova Caledonia, aveva raccolto una gorgonia per un museo, e solo dopo si accorse che sopra c’erano dei cavallucci minuscoli. Ancora oggi i fotografi subacquei passano ore a cercarli.", en: "It was discovered by chance in 1969: Georges Bargibant, a researcher in New Caledonia, had collected a sea fan for a museum, and only later noticed tiny seahorses on it. Underwater photographers still spend hours looking for them." },
        prompt: "Photorealistic underwater macro photograph of a pygmy seahorse (Hippocampus bargibanti) gripping a branch of a pink Muricella sea fan with its tail: a tiny seahorse about 2 cm tall, its body covered in round pink-red bumpy tubercles that exactly match the sea fan’s polyps, pale pink skin, a short snout and a small dark eye, perfectly camouflaged among the knobbly branches, dark blue background, crisp macro detail.", style: "reef" },
      { id: "flashlight", d: 110, h: 185, name: { it: "Pesce torcia", en: "Splitfin flashlightfish" }, sci: "Anomalops katoptron",
        range: { it: "pareti e grotte del Mar dei Coralli; di giorno fino a 400 m, di notte quasi in superficie", en: "walls and caves of the Coral Sea; by day down to 400 m, at night almost at the surface" }, size: { it: "fino a 35 cm", en: "up to 35 cm" },
        text: { it: "Un pesce scuro che sotto ogni occhio ha una torcia a forma di fagiolo, piena di batteri che producono luce verde-azzurra. Di notte i branchi salgono lungo la barriera e lampeggiano per vedere le prede, per restare uniti e per confondere chi vorrebbe mangiarli.", en: "A dark fish with a bean-shaped torch under each eye, full of bacteria that make blue-green light. At night schools rise up the reef and flash their lights to see their prey, to keep together and to confuse anything that wants to eat them." },
        fact: { it: "I batteri brillano sempre e il pesce non può spegnerli: per chiudere la luce ruota la torcia verso il basso, dentro una tasca scura. Così riesce a lampeggiare fino a 90 volte al minuto.", en: "The bacteria glow all the time and the fish cannot switch them off: to hide the light it rotates the torch downwards into a dark pocket. That way it can blink up to 90 times a minute." },
        prompt: "Photorealistic underwater night photograph of a small school of splitfin flashlightfish (Anomalops katoptron) in front of a dark coral reef wall: deep-bodied black-brown fish about 30 cm long with large eyes, each with a big bean-shaped light organ under the eye glowing bright blue-green, some fish showing the light and others with it rotated away, the only light coming from their glowing organs and a faint blue glow in the black water.", style: "forest" },
      { id: "nautilus", d: 320, h: 25, name: { it: "Nautilo", en: "Chambered nautilus" }, sci: "Nautilus pompilius",
        range: { it: "pareti esterne nel Mar dei Coralli, 150–700 m", en: "outer walls in the Coral Sea, 150–700 m" }, size: { it: "conchiglia di 15–20 cm", en: "shell 15–20 cm" },
        text: { it: "Un parente dei polpi che vive in una conchiglia a spirale divisa in tante stanze. Abita solo l’ultima, la più grande; le altre contengono gas e un po’ di liquido, e regolandoli sale e scende come un sottomarino. Ha circa 90 tentacoli appiccicosi senza ventose, e di notte risale lungo la parete per mangiare.", en: "A relative of the octopus that lives in a spiral shell divided into many chambers. It lives only in the last, largest one; the others hold gas and a little liquid, which it adjusts to rise and sink like a submarine. It has about 90 sticky tentacles with no suckers, and at night it climbs the wall to feed." },
        fact: { it: "I suoi antenati nuotavano nei mari già 500 milioni di anni fa, prima che esistessero i pesci con le mascelle. A Osprey Reef, nel Mar dei Coralli, gli scienziati li hanno marcati e ritrovati anni dopo: vivono più di 20 anni.", en: "Its ancestors were swimming in the seas 500 million years ago, before fish with jaws existed. At Osprey Reef, in the Coral Sea, scientists tagged them and found them again years later: they live for more than 20 years." },
        prompt: "Photorealistic deep-sea photograph of a chambered nautilus (Nautilus pompilius) hovering beside a steep reef wall at night: a smooth coiled shell about 18 cm across, creamy white with bold reddish-brown tiger stripes on the top half, a dark hood over the head, a large simple pinhole eye, many thin pale ridged tentacles fanned out in front, its siphon visible.", style: "ocean" }
    ]
  },
  ghats: {
    scene: [{ fx: "ridges", from: -2800, to: -1700, fade: 200 }, { fx: "clouds", from: -2800, to: -900, fade: 200 }, { fx: "mist", from: -1900, to: -1000, fade: 150, a: 0.6 }, { fx: "leaves", from: -1500, to: -50, fade: 120, dark: 0.8 }, { fx: "trunks", from: -1100, to: -50, fade: 100 }, { fx: "rain", from: -1300, to: -50, fade: 120 }],
    axis: "altitude", start: -2695, end: -100, px: 0.2, minGap: 70, maxGap: 480,
    gauge: [{ l: { it: "Altitudine", en: "Altitude" }, k: "alt" }, { l: { it: "Ossigeno", en: "Oxygen" }, k: "oxy" }, { l: { it: "Fascia", en: "Belt" }, k: "zone" }],
    where: { it: "India · Ghati occidentali", en: "India · Western Ghats" },
    eyebrow: { it: "Ghati occidentali", en: "Western Ghats" },
    title: { it: "I Ghati <em>occidentali</em>", en: "The Western <em>Ghats</em>" },
    lead: { it: "Una catena di montagne lunga 1.600 km lungo la costa ovest dell’India, più antica dell’Himalaya. Dalla vetta dell’Anamudi, a 2.695 m, scendi tra praterie fiorite, foreste nelle nuvole e foreste pluviali fino ai fiumi. Lo strumento mostra l’altitudine e l’ossigeno.", en: "A 1,600 km mountain range along the west coast of India, older than the Himalayas. From the summit of Anamudi, 2,695 m, go down through flowering grasslands, cloud forests and rainforests to the rivers. The gauge shows the altitude and the oxygen." },
    cue: { it: "Scorri per scendere", en: "Scroll to descend" },
    note: { it: "Queste creature vivono in punti diversi della catena, dal Kerala al Karnataka e al Maharashtra: qui le trovi all’altitudine in cui si incontrano.", en: "These creatures live in different parts of the range, from Kerala to Karnataka and Maharashtra: here you meet them at the altitude where they are found." },
    stops: [[-2695, "#3f6584"], [-2200, "#5a8670"], [-1800, "#4a7d5a"], [-1300, "#3a6e4c"], [-900, "#2b5c3e"], [-500, "#1f4a33"], [-100, "#173d2c"]],
    zones: [
      { from: -2695, to: -1800, name: { it: "Le praterie delle cime", en: "The summit grasslands" }, range: { it: "1.800–2.695 m", en: "1,800–2,695 m" }, text: { it: "In cima ai Ghati ci sono prati ondulati, con macchie di foresta nelle valli: le shola. Fa fresco tutto l’anno e d’inverno, di notte, può gelare.", en: "At the top of the Ghats there are rolling grasslands with patches of forest in the valleys: the sholas. It is cool all year round and on winter nights it can freeze." } },
      { from: -1800, to: -1000, name: { it: "Le foreste nelle nuvole", en: "The cloud forests" }, range: { it: "1.000–1.800 m", en: "1,000–1,800 m" }, text: { it: "Foreste umide, spesso avvolte nelle nuvole del monsone, piene di muschi, felci e orchidee.", en: "Damp forests, often wrapped in monsoon clouds, full of mosses, ferns and orchids." } },
      { from: -1000, to: -400, name: { it: "La foresta pluviale", en: "The rainforest" }, range: { it: "400–1.000 m", en: "400–1,000 m" }, text: { it: "Alberi altissimi e sempre verdi. Da giugno a settembre il monsone porta piogge fortissime: in alcuni punti cadono più di 5 metri di pioggia in un anno.", en: "Very tall evergreen trees. From June to September the monsoon brings huge rains: in some places more than 5 metres of rain fall in a year." } },
      { from: -400, to: -100, name: { it: "Torrenti e fiumi", en: "Streams and rivers" }, range: { it: "100–400 m", en: "100–400 m" }, text: { it: "Ai piedi dei monti i torrenti diventano fiumi che scendono verso il Mar Arabico, con alcune delle cascate più alte dell’India.", en: "At the foot of the mountains the streams become rivers flowing to the Arabian Sea, with some of the highest waterfalls in India." } }
    ],
    marks: [
      { d: -2695, text: { it: "La vetta dell’Anamudi, la montagna più alta dell’India del sud", en: "The summit of Anamudi, the highest mountain in southern India" } },
      { d: -1000, text: { it: "Da qui in giù cominciano le foreste pluviali, tra le più ricche di specie della Terra", en: "From here down the rainforests begin, among the richest in species on Earth" } }
    ],
    endTitle: { it: "I fiumi ai piedi dei Ghati, circa 100 m", en: "The rivers at the foot of the Ghats, about 100 m" },
    endText: { it: "I Ghati occidentali sono Patrimonio dell’Umanità dal 2012. Fermano le nuvole del monsone e danno acqua a milioni di persone. Ci vivono più di 200 specie di anfibi, e la maggior parte non si trova da nessun’altra parte del mondo.", en: "The Western Ghats have been a World Heritage Site since 2012. They stop the monsoon clouds and give water to millions of people. More than 200 species of amphibians live here, and most of them are found nowhere else in the world." },
    creatures: [
      { id: "niltahr", d: -2200, h: 30, name: { it: "Tahr dei Nilgiri", en: "Nilgiri tahr" }, sci: "Nilgiritragus hylocrius",
        range: { it: "praterie delle cime, 1.200–2.600 m", en: "summit grasslands, 1,200–2,600 m" }, size: { it: "alto circa 1 m alla spalla", en: "about 1 m at the shoulder" },
        text: { it: "Una capra di montagna che vive solo sui prati più alti dei Ghati, tra rocce e dirupi. I maschi adulti diventano scuri, quasi neri, con una macchia chiara sulla schiena, come una sella.", en: "A mountain goat that lives only on the highest grasslands of the Ghats, among rocks and cliffs. Adult males turn dark, almost black, with a pale patch on the back, like a saddle." },
        fact: { it: "Ne vivono circa 2.700, e quasi un terzo sta in un solo parco, l’Eravikulam, in Kerala. È l’animale simbolo dello stato del Tamil Nadu.", en: "About 2,700 of them are left, and almost a third live in a single park, Eravikulam, in Kerala. It is the state animal of Tamil Nadu." },
        prompt: "Photorealistic wildlife photograph of a Nilgiri tahr (Nilgiritragus hylocrius) standing on a rocky grassy mountain slope in the Western Ghats: a stocky wild goat about 1 m tall at the shoulder with short curved horns, an adult male with dark chocolate-brown almost black coat and a pale greyish saddle patch on its back, rolling green hills with patches of shola forest and misty mountains behind, soft morning light.", style: "forest" },
      { id: "kurinji", d: -2000, h: 270, name: { it: "Neelakurinji", en: "Neelakurinji" }, sci: "Strobilanthes kunthiana",
        range: { it: "praterie e colline, 1.300–2.400 m", en: "grasslands and hills, 1,300–2,400 m" }, size: { it: "arbusto alto 30–60 cm", en: "shrub 30–60 cm tall" },
        text: { it: "Un arbusto che per anni sembra un cespuglio qualunque. Poi fiorisce tutto insieme, una volta ogni 12 anni, e intere colline diventano blu e viola. Il nome dei Nilgiri, le «Montagne Blu», forse viene proprio da lui.", en: "A shrub that for years looks like any other bush. Then it all flowers at once, once every 12 years, and whole hillsides turn blue and purple. The name of the Nilgiris, the ‘Blue Mountains’, may come from it." },
        fact: { it: "Dopo la fioritura le piante muoiono e lasciano i semi, che aspettano altri 12 anni. A Eravikulam l’ultima fioritura è stata nel 2018 e la prossima è attesa nel 2030. Ma ogni collina ha il suo calendario: su alcune colline vicino a Munnar è fiorito nel 2026.", en: "After flowering the plants die and leave their seeds, which wait another 12 years. At Eravikulam the last bloom was in 2018 and the next is expected in 2030. But every hill keeps its own calendar: on some hills near Munnar it flowered in 2026." },
        prompt: "Photorealistic landscape and nature photograph of a mass bloom of Neelakurinji (Strobilanthes kunthiana) covering a rolling hillside in the Western Ghats: dense low shrubs about 50 cm tall covered in small bell-shaped lavender-blue and violet flowers, the whole slope turned purple-blue, green grassland and misty mountains behind, soft light.", style: "forest" },
      { id: "sholakili", d: -1900, h: 215, name: { it: "Sholakili panciabianca", en: "White-bellied sholakili" }, sci: "Sholicola albiventris",
        range: { it: "sottobosco delle shola, sopra i 1.200 m", en: "shola forest undergrowth, above 1,200 m" }, size: { it: "circa 15 cm", en: "about 15 cm" },
        text: { it: "Un uccellino blu scuro con la pancia chiara che vive nel sottobosco delle shola, le macchie di foresta tra i prati delle cime. Ogni gruppo di montagne ha la sua popolazione, isolata dalle altre come su un’isola.", en: "A small dark-blue bird with a pale belly that lives in the undergrowth of the sholas, the patches of forest among the summit grasslands. Each group of mountains has its own population, cut off from the others as if on an island." },
        fact: { it: "Nel 2017 gli scienziati hanno scoperto che lui e i suoi parenti sono così diversi dagli altri uccelli da meritare un genere tutto nuovo: Sholicola, cioè «abitante delle shola». Da allora si chiamano sholakili.", en: "In 2017 scientists found that it and its relatives are so different from other birds that they deserved a whole new genus: Sholicola, meaning ‘dweller of the sholas’. Since then they have been called sholakilis." },
        prompt: "Photorealistic wildlife photograph of a white-bellied sholakili (Sholicola albiventris) perched on a mossy branch in a dim shola forest undergrowth: a small plump songbird about 15 cm long, dark slate-blue upperparts and head, greyish-white belly, a short black bill and strong legs, soft green blurred background.", style: "forest" },
      { id: "liontail", d: -1150, h: 20, name: { it: "Macaco dalla coda di leone", en: "Lion-tailed macaque" }, sci: "Macaca silenus",
        range: { it: "foreste pluviali di montagna", en: "mountain rainforests" }, size: { it: "circa 50 cm, più 30 cm di coda", en: "about 50 cm, plus a 30 cm tail" },
        text: { it: "Una scimmia nera con una criniera argentata intorno al muso e una coda con un ciuffo in fondo, come quella del leone. Vive quasi sempre sugli alberi e mangia frutti, semi e insetti.", en: "A black monkey with a silvery mane around its face and a tail with a tuft at the end, like a lion’s. It lives almost always in the trees and eats fruit, seeds and insects." },
        fact: { it: "Vive solo nei Ghati occidentali e ne restano poche migliaia. Dove le foreste sono state tagliate per le piantagioni di tè e caffè, molti gruppi sono rimasti chiusi in boschetti isolati.", en: "It lives only in the Western Ghats and only a few thousand are left. Where forests were cut down for tea and coffee plantations, many groups were left trapped in isolated patches of woodland." },
        prompt: "Photorealistic wildlife photograph of a lion-tailed macaque (Macaca silenus) sitting on a tree branch in a dense rainforest: a monkey with glossy black fur, a striking silver-grey mane framing its dark face, brown eyes, its long tail ending in a lion-like tuft hanging down, green leaves around, soft natural light.", style: "forest" },
      { id: "giantsquirrel", d: -1000, h: 350, name: { it: "Scoiattolo gigante di Malabar", en: "Malabar giant squirrel" }, sci: "Ratufa indica",
        range: { it: "chiome delle foreste", en: "forest canopy" }, size: { it: "fino a circa 1 m, coda compresa", en: "up to about 1 m, tail included" },
        text: { it: "Uno scoiattolo grande come un gatto, colorato di rosso scuro, viola, nero e crema. Salta da un albero all’altro anche per 6 metri e scende a terra molto di rado.", en: "A squirrel as big as a cat, coloured deep red, purple, black and cream. It leaps from tree to tree, even 6 metres at a time, and very rarely comes down to the ground." },
        fact: { it: "Ogni scoiattolo costruisce diversi nidi di rami e foglie nel suo territorio: alcuni per dormire, altri per i piccoli. È l’animale simbolo dello stato del Maharashtra.", en: "Each squirrel builds several nests of twigs and leaves in its territory: some for sleeping, others for its young. It is the state animal of Maharashtra." },
        prompt: "Photorealistic wildlife photograph of a Malabar giant squirrel (Ratufa indica) resting along a thick branch high in the rainforest canopy: a huge squirrel about 1 m long including its bushy tail, deep maroon-red and purple-brown back, black shoulders and very long black tail, cream-yellow belly and face, small round ears, green leaves and dappled sunlight.", style: "forest" },
      { id: "hornbill", d: -880, h: 48, name: { it: "Bucero bicorne", en: "Great hornbill" }, sci: "Buceros bicornis",
        range: { it: "foreste pluviali, fino a circa 1.500 m", en: "rainforests, up to about 1,500 m" }, size: { it: "circa 1–1,3 m, ali fino a 1,5 m", en: "about 1–1.3 m, wings up to 1.5 m" },
        text: { it: "Un grande uccello con un becco enorme e sopra una specie di elmo giallo, il casco. Quando vola si sente un rumore forte, come il soffio di una locomotiva, perché l’aria passa tra le penne delle sue grandi ali.", en: "A big bird with a huge bill topped by a sort of yellow helmet, the casque. When it flies you hear a loud whooshing, like a steam engine, as air rushes through the feathers of its broad wings." },
        fact: { it: "Quando cova, la femmina si chiude dentro un buco nel tronco murando l’ingresso con fango e cibo masticato, e lascia solo una fessura. Per mesi il maschio la nutre attraverso quella fessura, un frutto alla volta.", en: "When nesting, the female shuts herself inside a hole in a tree trunk, walling up the entrance with mud and chewed food and leaving only a slit. For months the male feeds her through that slit, one fruit at a time." },
        prompt: "Photorealistic wildlife photograph of a great hornbill (Buceros bicornis) perched on a branch at the top of a rainforest tree: a large bird with a massive curved yellow bill topped by a broad yellow and black casque, black face and back, white neck stained yellow, black wings with white bars, white tail with a black band, misty forested hills behind.", style: "forest" },
      { id: "birdwing", d: -800, h: 55, name: { it: "Ali d’uccello del sud", en: "Southern birdwing" }, sci: "Troides minos",
        range: { it: "foreste e giardini dell’India del sud", en: "forests and gardens of southern India" }, size: { it: "ali fino a circa 19 cm", en: "wings up to about 19 cm" },
        text: { it: "Una delle farfalle più grandi dell’India, nera con le ali posteriori gialle. Il bruco mangia piante velenose e diventa velenoso anche lui, e così la farfalla: gli uccelli riconoscono i suoi colori e la lasciano stare.", en: "One of the largest butterflies in India, black with yellow hindwings. The caterpillar eats poisonous plants and becomes poisonous itself, and so does the butterfly: birds recognise its colours and leave it alone." },
        fact: { it: "Per quasi 90 anni è stata considerata la farfalla più grande dell’India. Nel 2020 ha perso il titolo: in Himalaya è stata misurata una sua cugina con ali di 19,4 cm.", en: "For almost 90 years it was considered the largest butterfly in India. In 2020 it lost the title: in the Himalayas one of its cousins was measured with a 19.4 cm wingspan." },
        prompt: "Photorealistic macro wildlife photograph of a southern birdwing butterfly (Troides minos) resting with open wings on a leaf in a tropical forest: a very large butterfly about 18 cm across, velvety black forewings with pale grey streaks along the veins, bright golden-yellow hindwings with black edges and black spots, a red-and-black body, soft green blurred background.", style: "forest" },
      { id: "glidingfrog", d: -720, h: 100, name: { it: "Rana volante del Malabar", en: "Malabar gliding frog" }, sci: "Rhacophorus malabaricus",
        range: { it: "foreste pluviali e piantagioni", en: "rainforests and plantations" }, size: { it: "circa 10 cm", en: "about 10 cm" },
        text: { it: "Una rana verde brillante con le dita lunghissime unite da membrane arancioni. Quando salta le apre come paracaduti e plana da un albero all’altro.", en: "A bright green frog with very long toes joined by orange webbing. When it jumps it spreads them like parachutes and glides from tree to tree." },
        fact: { it: "Depone le uova in un nido di schiuma attaccato a una foglia sopra l’acqua. Quando i girini sono pronti la schiuma si scioglie e loro cadono direttamente nella pozza qui sotto.", en: "It lays its eggs in a nest of foam stuck to a leaf above the water. When the tadpoles are ready the foam melts and they drop straight into the pool below." },
        prompt: "Photorealistic wildlife photograph of a Malabar gliding frog (Rhacophorus malabaricus) gliding through the air between rainforest trees with its legs spread: a bright leaf-green frog about 10 cm long with large eyes, very long toes with wide orange-red webbing stretched like parachutes, pale belly, blurred green forest behind.", style: "forest" },
      { id: "draco", d: -650, h: 38, name: { it: "Drago volante dei Ghati", en: "Western Ghats flying lizard" }, sci: "Draco dussumieri",
        range: { it: "tronchi degli alberi nelle foreste", en: "tree trunks in the forests" }, size: { it: "circa 23 cm, coda compresa", en: "about 23 cm, tail included" },
        text: { it: "Una lucertola che plana: lungo i fianchi ha delle costole lunghissime che si aprono come le stecche di un ventaglio e tendono una membrana di pelle, come un paio di ali.", en: "A gliding lizard: along its sides it has very long ribs that open like the spokes of a fan and stretch a membrane of skin, like a pair of wings." },
        fact: { it: "Così passa da un tronco all’altro planando anche per decine di metri, senza toccare terra. Il maschio, per farsi notare, apre e chiude sotto la gola una bandierina gialla.", en: "That way it glides from trunk to trunk, even tens of metres, without touching the ground. To get noticed, the male flicks a little yellow flag under his throat open and shut." },
        prompt: "Photorealistic wildlife photograph of a Western Ghats flying lizard (Draco dussumieri) gliding between tree trunks with its wing membranes fully spread: a slender mottled grey-brown lizard about 23 cm long including the tail, wide patagial wings supported by elongated ribs, patterned in brown, orange and black, a yellow throat flap extended, rainforest trunks behind.", style: "forest" },
      { id: "pitviper", d: -600, h: 90, name: { it: "Vipera di Malabar", en: "Malabar pit viper" }, sci: "Craspedocephalus malabaricus",
        range: { it: "foreste pluviali, su rami e rocce vicino ai torrenti", en: "rainforests, on branches and rocks near streams" }, size: { it: "fino a poco più di 1 m", en: "up to just over 1 m" },
        text: { it: "Una vipera che può essere verde, gialla, arancione o marrone, anche nello stesso bosco. Aspetta immobile per ore su un ramo o una roccia vicino ai torrenti, finché passa una preda.", en: "A viper that can be green, yellow, orange or brown, even in the same forest. It waits motionless for hours on a branch or rock near a stream until prey comes by." },
        fact: { it: "Tra gli occhi e le narici ha due fossette che «vedono» il calore: così sente una rana o un topo anche nel buio completo.", en: "Between its eyes and nostrils it has two pits that ‘see’ heat: so it can sense a frog or a mouse even in total darkness." },
        prompt: "Photorealistic wildlife photograph of a Malabar pit viper (Craspedocephalus malabaricus) coiled on a mossy rock beside a forest stream: a stout snake with a broad triangular head, pale green body with bold dark brown blotches, a visible heat-sensing pit between eye and nostril, vertical pupil, wet rock and ferns around, soft light.", style: "forest" },
      { id: "purplefrog", d: -560, h: 285, at: { it: "Sotto terra", en: "Underground" }, name: { it: "Rana viola", en: "Purple frog" }, sci: "Nasikabatrachus sahyadrensis",
        range: { it: "sotto terra, a qualche metro di profondità", en: "underground, a few metres deep" }, size: { it: "circa 7 cm", en: "about 7 cm" },
        text: { it: "Una rana gonfia e viola, con il muso a punta e gli occhi piccolissimi, che passa quasi tutto l’anno sotto terra mangiando termiti. Esce solo per circa due settimane, con le prime piogge del monsone, per deporre le uova nelle pozze dei torrenti gonfi di pioggia.", en: "A bloated purple frog with a pointed snout and tiny eyes that spends almost the whole year underground eating termites. It comes out for only about two weeks, with the first monsoon rains, to lay its eggs in the pools of rain-swollen streams." },
        fact: { it: "È stata descritta solo nel 2003, ma è una specie di fossile vivente: i suoi parenti più stretti vivono alle Seychelles, a quasi 3.000 km, perché decine di milioni di anni fa India e Seychelles erano unite.", en: "It was only described in 2003, but it is a kind of living fossil: its closest relatives live in the Seychelles, almost 3,000 km away, because tens of millions of years ago India and the Seychelles were joined." },
        prompt: "Photorealistic wildlife photograph of a purple frog (Nasikabatrachus sahyadrensis) sitting on wet brown fallen leaves on the forest floor after rain: a plump bloated frog about 7 cm long, smooth dark purple-grey skin, a small pointed pig-like snout, tiny eyes and short stubby legs, a few raindrops, soft overcast light.", style: "forest" },
      { id: "kaalinga", d: -500, h: 45, name: { it: "Cobra reale dei Ghati", en: "Western Ghats king cobra" }, sci: "Ophiophagus kaalinga",
        range: { it: "foreste pluviali dei Ghati occidentali", en: "rainforests of the Western Ghats" }, size: { it: "spesso più di 3 m", en: "often over 3 m" },
        text: { it: "I cobra reali sono i serpenti velenosi più lunghi del mondo. Mangiano soprattutto altri serpenti: il nome Ophiophagus vuol dire proprio «mangiatore di serpenti». La femmina è l’unico serpente che costruisce un nido di foglie per le uova e lo sorveglia.", en: "King cobras are the longest venomous snakes in the world. They eat mostly other snakes: the name Ophiophagus means ‘snake eater’. The female is the only snake that builds a nest of leaves for her eggs and guards it." },
        fact: { it: "Fino al 2024 si pensava che esistesse una sola specie di cobra reale. Poi gli scienziati hanno scoperto che sono almeno quattro, e quello dei Ghati è una specie a sé: kaalinga.", en: "Until 2024 everyone thought there was only one species of king cobra. Then scientists found there are at least four, and the one in the Ghats is a species of its own: kaalinga." },
        prompt: "Photorealistic wildlife photograph of a Western Ghats king cobra (Ophiophagus kaalinga) raising the front of its body with a narrow hood spread on the rainforest floor: a very long olive-brown snake with pale yellowish crossbands, large smooth head scales, calm dark eyes, ferns and fallen leaves around, dappled green light.", style: "forest" },
      { id: "dancingfrog", d: -400, h: 25, name: { it: "Rana danzante", en: "Dancing frog" }, sci: "Micrixalus",
        range: { it: "rocce bagnate di torrenti e cascate", en: "wet rocks of streams and waterfalls" }, size: { it: "pochi centimetri", en: "a few centimetres" },
        text: { it: "Una piccola rana che vive sulle rocce bagnate dei torrenti. Il rumore dell’acqua copre il suo canto, così il maschio fa anche segnali con le zampe: le stende e le muove come se ballasse, per farsi notare dalle femmine e allontanare i rivali.", en: "A little frog that lives on the wet rocks of streams. The noise of the water drowns out its call, so the male also signals with its legs: it stretches and waves them as if dancing, to get the females’ attention and drive off rivals." },
        fact: { it: "Nel 2014 gli scienziati ne hanno descritte 14 specie nuove, tutte dei Ghati. Molte di queste specie sono in pericolo, perché i torrenti in cui vivono si seccano o vengono rovinati.", en: "In 2014 scientists described 14 new species, all from the Ghats. Many of these species are in danger, because the streams they live in dry up or are damaged." },
        prompt: "Photorealistic wildlife photograph of a dancing frog (Micrixalus) on a wet mossy boulder beside a rushing forest stream, foot-flagging: a small brown frog about 3 cm long with a pale throat, one long hind leg stretched out sideways with toes spread, splashing white water behind, damp green moss.", style: "forest" },
      { id: "misskerala", d: -300, h: 0, name: { it: "Barbo di Denison", en: "Denison barb" }, sci: "Sahyadria denisonii",
        range: { it: "fiumi e torrenti del Kerala e del Karnataka", en: "rivers and streams of Kerala and Karnataka" }, size: { it: "circa 10 cm, al massimo 15", en: "about 10 cm, at most 15" },
        text: { it: "Un pesce argentato e slanciato con una striscia nera e una rossa lungo il corpo, e la coda a strisce gialle e nere. È così bello che in India lo chiamano «Miss Kerala».", en: "A slender silvery fish with a black and a red stripe along its body and a tail striped yellow and black. It is so beautiful that in India it is called ‘Miss Kerala’." },
        fact: { it: "Proprio per la sua bellezza è stato pescato a migliaia per gli acquari di tutto il mondo, e oggi è in pericolo. Adesso si cerca di allevarlo in vasca invece di prenderlo dai fiumi.", en: "Precisely because of its beauty it was caught by the thousand for aquariums all over the world, and today it is endangered. Now people try to breed it in tanks instead of taking it from the rivers." },
        prompt: "Photorealistic underwater photograph of a small group of Denison barbs (Sahyadria denisonii) swimming over smooth pebbles in a clear shallow forest river in Kerala: slender silvery torpedo-shaped fish about 10 cm long with a black horizontal stripe from snout to tail, a bright red stripe above it running from the snout through the eye to the middle of the body, a red front edge on the dorsal fin, tail lobes each with a yellow and a black stripe, sunlight rippling on the stones.", style: "forest" }
    ]
  },
};
