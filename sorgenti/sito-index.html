    lead: { it: "La catena di montagne più lunga del mondo, circa 7.000 km dal Venezuela alla Patagonia. Dalla vetta più alta, a 6.961 m, scendi tra vulcani, altipiani e foreste nelle nuvole. Lo strumento mostra l’altitudine e l’ossigeno.", en: "The longest mountain range in the world, about 7,000 km from Venezuela to Patagonia. From the highest peak, at 6,961 m, descend through volcanoes, high plateaus and cloud forests. The gauge shows the altitude and the oxygen." },
    cue: { it: "Scorri per scendere", en: "Scroll to descend" },
    note: { it: "Queste creature vivono in paesi diversi lungo la catena, dal Perù al Cile e all’Argentina: qui le trovi all’altitudine in cui si incontrano.", en: "These creatures live in different countries along the range, from Peru to Chile and Argentina: here you meet them at the altitude where they are found." },
    stops: [[-6961, "#22324f"], [-5500, "#8d9cb0"], [-4500, "#b3a585"], [-3500, "#9c9a6a"], [-2500, "#4f7a4f"], [-1500, "#1f4a33"]],
    zones: [
      { from: -6961, to: -5200, name: { it: "Vulcani e ghiacciai", en: "Volcanoes and glaciers" }, range: { it: "5.200–6.961 m", en: "5,200–6,961 m" }, text: { it: "Tra le cime più alte ci sono vulcani di oltre 6.000 metri. L’aria è secchissima e c’è meno della metà dell’ossigeno che c’è al mare.", en: "Among the highest peaks are volcanoes over 6,000 metres tall. The air is extremely dry and holds less than half the oxygen found at sea level." } },
      { from: -5200, to: -3800, name: { it: "La puna", en: "The puna" }, range: { it: "3.800–5.200 m", en: "3,800–5,200 m" }, text: { it: "Un altopiano freddo e ventoso di erbe dure, lagune salate e rocce, dove di notte gela quasi sempre.", en: "A cold, windy plateau of tough grasses, salty lagoons and rocks, where it freezes almost every night." } },

      { from: -2500, to: -1500, name: { it: "La foresta delle nuvole", en: "The cloud forest" }, range: { it: "1.500–2.500 m", en: "1,500–2,500 m" }, text: { it: "Sui versanti verso l’Amazzonia le nuvole si fermano contro le montagne: alberi coperti di muschi, orchidee e bromelie.", en: "On the slopes facing the Amazon, clouds stall against the mountains: trees covered in moss, orchids and bromeliads." } }

    endTitle: { it: "La spina dorsale del Sud America", en: "The backbone of South America" },
    endText: { it: "Le Ande sono nate e crescono ancora perché la placca dell’oceano Pacifico scivola sotto il Sud America: per questo qui ci sono tanti vulcani e terremoti. Dai loro ghiacciai dipende l’acqua di milioni di persone.", en: "The Andes formed, and are still rising, because the Pacific plate slides under South America: that’s why there are so many volcanoes and earthquakes here. Millions of people depend on their glaciers for water." },
    creatures: [
      { id: "leafmouse", d: -6739, h: 30, name: { it: "Topo dalle orecchie a foglia", en: "Leaf-eared mouse" }, sci: "Phyllotis vaccarum",
        range: { it: "deserti d’alta quota di Cile e Argentina, fino a 6.739 m", en: "high deserts of Chile and Argentina, up to 6,739 m" }, size: { it: "circa 12 cm più la coda", en: "about 12 cm plus the tail" },
        text: { it: "Il mammifero trovato più in alto sulla Terra. Nel 2020 un gruppo di scienziati ne ha catturato uno vivo proprio sulla cima del vulcano Llullaillaco, a 6.739 metri, dove non c’è quasi niente da mangiare. Su altre cime vicine sono state trovate anche delle mummie di questi topolini.", en: "The highest mammal ever found on Earth. In 2020 a team of scientists caught a live one right on the summit of the Llullaillaco volcano, at 6,739 metres, where there is almost nothing to eat. Mummies of these little mice were also found on other nearby summits." },
        fact: { it: "Nessuno sa ancora bene perché salga così in alto: è uno dei misteri di cui si occupano gli scienziati.", en: "Nobody knows yet why it climbs so high: it is one of the mysteries scientists are working on." },
        prompt: "Photorealistic wildlife photograph of a leaf-eared mouse (Phyllotis vaccarum) on volcanic rocks near the summit of an Andean volcano above 6,000 m: a small mouse with soft greyish-brown and sandy fur, a pale belly, very large rounded leaf-like ears, big dark eyes, long whiskers, a long tail, barren snowy volcanic slopes and deep blue sky behind.", style: "forest" },
      { id: "condor", d: -5000, h: 10, name: { it: "Condor delle Ande", en: "Andean condor" }, sci: "Vultur gryphus",
        range: { it: "Ande, dal Venezuela alla Terra del Fuoco", en: "Andes, from Venezuela to Tierra del Fuego" }, size: { it: "ali fino a 3,3 m, circa 15 kg", en: "wings up to 3.3 m, about 15 kg" },
        text: { it: "Uno degli uccelli volanti più pesanti del mondo, con ali larghe più di 3 metri. Quasi non sbatte le ali: plana sulle correnti d’aria calda che salgono dalle montagne.", en: "One of the heaviest flying birds in the world, with wings more than 3 metres across. It hardly ever flaps: it glides on the warm air currents rising from the mountains." },
        fact: { it: "Uno studio del 2020 ha seguito un condor che ha volato per più di 5 ore e 170 km senza sbattere le ali nemmeno una volta.", en: "A 2020 study followed a condor that flew for more than 5 hours and 170 km without flapping its wings once." },
        prompt: "Photorealistic wildlife photograph of a male Andean condor (Vultur gryphus) perched on a high rocky crag in the Andes: a huge black vulture with large white panels on the wings, a fluffy white neck ruff, a bare wrinkled reddish-grey head with a fleshy comb on top, a hooked pale bill, snowy peaks and clouds behind.", style: "forest" },
      { id: "liolaemus", d: -4800, h: 35, name: { it: "Lucertola di Arequipa", en: "Arequipa lizard" }, sci: "Liolaemus archipensis",
        range: { it: "puna di Arequipa, Perù, oltre i 4.800 m", en: "puna of Arequipa, Peru, above 4,800 m" }, size: { it: "6–8 cm", en: "6–8 cm" },
        text: { it: "Una lucertola annunciata dagli scienziati proprio a ottobre 2026. Vive oltre i 4.800 metri, dove di notte gela quasi sempre, e di giorno si scalda al sole sulle rocce per riuscire a muoversi.", en: "A lizard announced by scientists in October 2026. It lives above 4,800 metres, where it freezes almost every night, and by day it warms up in the sun on the rocks so that it can move." },
        fact: { it: "Le femmine hanno macchie quadrate sul dorso; i maschi hanno macchie oblique e squame bianche che li mimetizzano tra le rocce.", en: "Females have square spots on their backs; males have slanted spots and white scales that camouflage them among the rocks." },
        prompt: "Photorealistic wildlife photograph of a small Andean lizard (Liolaemus archipensis) about 7 cm long basking on a lichen-covered rock in the high puna of Arequipa, Peru, above 4,800 m: rough keeled grey-brown scales, a male with slanted dark spots and scattered white scales along the back, dry yellow tufted grass behind.", style: "forest" },
      { id: "andeancat", d: -4300, h: 210, name: { it: "Gatto delle Ande", en: "Andean mountain cat" }, sci: "Leopardus jacobita",
        range: { it: "puna e pietraie, di solito sopra i 3.500 m", en: "puna and scree, usually above 3,500 m" }, size: { it: "circa 60 cm più 45 cm di coda", en: "about 60 cm plus a 45 cm tail" },
        text: { it: "Uno dei felini più rari e meno conosciuti del mondo: ne restano forse meno di 1.400 adulti. Ha il pelo grigio-argento con macchie rossicce e una coda grossissima ad anelli, che lo aiuta a stare in equilibrio sulle rocce.", en: "One of the rarest and least known cats in the world: perhaps fewer than 1,400 adults are left. It has silver-grey fur with reddish spots and a very thick ringed tail that helps it balance on the rocks." },
        fact: { it: "Il popolo aymara lo considera sacro e lo chiama titi.", en: "The Aymara people consider it sacred and call it titi." },
        prompt: "Photorealistic wildlife photograph of an Andean mountain cat (Leopardus jacobita) on a rocky slope in the high puna at 4,300 m: a small wild cat with thick silver-grey fur marked with rusty-orange to brown spots and stripes, a pale face, and a very long, thick, bushy tail with broad dark rings, dry tufted grass and snowy Andes behind.", style: "forest" },
      { id: "vicuna", d: -4200, h: 30, name: { it: "Vigogna", en: "Vicuña" }, sci: "Vicugna vicugna",
        range: { it: "puna tra 3.200 e 4.800 m", en: "puna between 3,200 and 4,800 m" }, size: { it: "alta circa 90 cm alla spalla", en: "about 90 cm at the shoulder" },
        text: { it: "La parente selvatica dell’alpaca, snella ed elegante. Ha una delle lane più fini del mondo, e per questo un tempo solo i re inca potevano vestirsene.", en: "The wild relative of the alpaca, slender and elegant. It has one of the finest wools in the world, which is why once only Inca kings were allowed to wear it." },
        fact: { it: "Negli anni Sessanta ne restavano pochi migliaia; grazie alla protezione oggi sono centinaia di migliaia.", en: "In the 1960s only a few thousand were left; thanks to protection there are now hundreds of thousands." },
        prompt: "Photorealistic wildlife photograph of a vicuña (Vicugna vicugna) standing in the golden grass of the high Andean puna at 4,200 m: a slender, graceful wild camelid with a long neck, bright cinnamon-tan woolly coat on the back, a long white bib on the chest and white belly, a small head with alert ears, snowy volcanoes behind.", style: "forest" },
      { id: "titicacafrog", d: -3812, h: 90, at: { it: "Sul fondo del lago Titicaca, a 3.812 m", en: "On the bottom of Lake Titicaca, at 3,812 m" }, name: { it: "Rana del Titicaca", en: "Titicaca water frog" }, sci: "Telmatobius culeus",
        range: { it: "lago Titicaca, tra Perù e Bolivia", en: "Lake Titicaca, between Peru and Bolivia" }, size: { it: "corpo fino a circa 15 cm", en: "body up to about 15 cm" },
        text: { it: "Una grande rana che non esce quasi mai dall’acqua. Ha la pelle piena di pieghe larghe e flosce: più pelle vuol dire più superficie per prendere l’ossigeno direttamente dall’acqua gelida del lago.", en: "A large frog that hardly ever leaves the water. Its skin hangs in loose, baggy folds: more skin means more surface to take oxygen straight from the lake’s cold water." },
        fact: { it: "Se l’acqua ha poco ossigeno, fa su e giù con il corpo per muovere l’acqua tra le sue pieghe.", en: "When the water is low in oxygen, it bobs up and down to move water across its folds." },
        prompt: "Photorealistic underwater photograph of a Titicaca water frog (Telmatobius culeus) resting on the muddy bottom of Lake Titicaca: a large aquatic frog with olive-brown to grey mottled skin hanging in very loose, baggy folds along its body and legs, small eyes on top of the head, cold clear lake water with green aquatic plants.", style: "water" },
      { id: "specbear", d: -2200, h: 20, name: { it: "Orso dagli occhiali", en: "Spectacled bear" }, sci: "Tremarctos ornatus",
        range: { it: "foreste delle nuvole e praterie andine", en: "cloud forests and Andean grasslands" }, size: { it: "fino a 1,8 m in piedi", en: "up to 1.8 m standing" },
        text: { it: "L’unico orso del Sud America. Ha disegni color crema intorno agli occhi, diversi in ogni orso come le impronte digitali. Si arrampica benissimo e costruisce piattaforme di rami sugli alberi per mangiare e riposare.", en: "South America’s only bear. It has cream-coloured markings around its eyes, different in every bear like fingerprints. It is an excellent climber and builds platforms of branches in the trees to eat and rest." },
        fact: { it: "È l’orso che ha ispirato Paddington, l’orsetto arrivato a Londra «dal Perù più profondo».", en: "It is the bear that inspired Paddington, who came to London “from darkest Peru”." },
        prompt: "Photorealistic wildlife photograph of a spectacled bear (Tremarctos ornatus) on a mossy rock in an Andean cloud forest: a medium-sized bear with shaggy black fur and distinctive cream-coloured markings around the eyes and across the muzzle and chest, small round ears, misty trees covered in moss and bromeliads.", style: "forest" }

    endText: { it: "Il Sahara non è sempre stato un deserto: fino a circa 5.000 anni fa era verde, con laghi, ippopotami e giraffe, come raccontano le pitture sulle rocce. Oggi molti dei suoi grandi animali, come l’addax, sono quasi scomparsi a causa della caccia.", en: "The Sahara hasn’t always been a desert: until about 5,000 years ago it was green, with lakes, hippos and giraffes, as rock paintings show. Today many of its large animals, such as the addax, have almost vanished because of hunting." },

      { id: "addax", d: -1.05, h: 35, name: { it: "Addax", en: "Addax" }, sci: "Addax nasomaculatus",
